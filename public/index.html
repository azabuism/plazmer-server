<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PLAZMERS Ver.1.004</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action: none; }
        #canvas { display: block; background: #0a0a15; }
        #menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #menu h1 { font-size: 42px; color: #0ff; text-shadow: 0 0 30px #0ff, 0 0 60px #08f; margin-bottom: 10px; letter-spacing: 8px; }
        #menu .version { font-size: 14px; color: #888; margin-bottom: 30px; }
        #menu input { width: 200px; padding: 12px; font-size: 18px; background: #111; border: 2px solid #0ff; color: #fff; margin: 10px; text-align: center; border-radius: 5px; }
        .menu-btn { padding: 15px 40px; font-size: 18px; background: transparent; border: 2px solid #0ff; color: #0ff; cursor: pointer; margin: 10px; transition: all 0.3s; border-radius: 5px; }
        .menu-btn:hover, .menu-btn:active { background: #0ff; color: #000; }
        #room-info { color: #0ff; font-size: 28px; margin: 20px; letter-spacing: 4px; }
        #status { color: #888; font-size: 14px; margin-top: 20px; }
        
        /* バーチャルスティック */
        #stick-zone { position: fixed; left: 0; bottom: 0; width: 45%; height: 50%; z-index: 45; }
        #stick-base { position: fixed; left: 30px; bottom: 30px; width: 120px; height: 120px; background: rgba(0,255,255,0.1); border: 2px solid rgba(0,255,255,0.4); border-radius: 50%; z-index: 50; display: none; }
        #stick-knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; background: rgba(0,255,255,0.5); border: 2px solid #0ff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(0,255,255,0.5); }
        
        /* ダッシュボタン */
        #btn-dash { position: fixed; left: 170px; bottom: 50px; width: 70px; height: 70px; background: rgba(255,153,0,0.15); border: 3px solid #f90; border-radius: 50%; color: #f90; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 50; transition: all 0.1s; }
        #btn-dash.active { background: rgba(255,153,0,0.6); box-shadow: 0 0 30px #f90, 0 0 60px #f60; transform: scale(1.1); }
        
        /* 武器ボタン */
        #weapons { position: fixed; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 50; }
        .weapon-btn { width: 80px; height: 48px; background: rgba(0,100,200,0.2); border: 2px solid rgba(0,150,255,0.6); border-radius: 8px; color: #fff; font-size: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; transition: all 0.15s; }
        .weapon-btn.active { background: rgba(0,255,100,0.4); border-color: #0f0; box-shadow: 0 0 15px #0f0; }
        .weapon-btn.disabled { opacity: 0.3; border-color: #333; }
        .weapon-name { font-weight: bold; font-size: 10px; }
        .weapon-level { font-size: 8px; color: #ff0; }
        
        /* HUD */
        #hud { position: fixed; top: 10px; left: 10px; color: #fff; font-size: 14px; z-index: 40; text-shadow: 2px 2px 4px #000; }
        #hud > div { margin-bottom: 3px; }
        #hp-bar { width: 150px; height: 12px; background: rgba(0,0,0,0.7); border: 1px solid #0ff; margin-top: 5px; }
        #hp-fill { height: 100%; background: linear-gradient(90deg, #0f0, #0ff); transition: width 0.3s; }
        
        /* ボスHP */
        #boss-bar { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); width: 280px; height: 18px; background: rgba(0,0,0,0.8); border: 2px solid #f00; display: none; z-index: 40; border-radius: 3px; }
        #boss-hp { height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.3s; }
        #boss-name { position: absolute; width: 100%; text-align: center; color: #fff; font-size: 11px; line-height: 18px; text-shadow: 1px 1px 2px #000; }
        
        /* メッセージ */
        #message { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); color: #0ff; font-size: 32px; font-weight: bold; text-shadow: 0 0 20px #0ff, 0 0 40px #08f; z-index: 60; display: none; text-align: center; }
        
        /* リスポーンカウンター */
        #respawn { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #f00; font-size: 48px; font-weight: bold; text-shadow: 0 0 30px #f00; z-index: 65; display: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="menu">
        <h1>PLAZMERS</h1>
        <div class="version">Ver.1.004</div>
        <div id="menu-main">
            <input type="text" id="player-name" placeholder="YOUR NAME" maxlength="12">
            <br>
            <button class="menu-btn" onclick="hostGame()">HOST GAME</button>
            <br>
            <input type="text" id="room-code" placeholder="ROOM CODE" maxlength="4" style="text-transform:uppercase;">
            <button class="menu-btn" onclick="joinGame()">JOIN</button>
        </div>
        <div id="menu-waiting" class="hidden">
            <div id="room-info">ROOM: <span id="room-id"></span></div>
            <div id="players-list"></div>
            <button class="menu-btn" id="start-btn" onclick="startGame()">START GAME</button>
        </div>
        <div id="status">Connecting...</div>
    </div>
    
    <div id="stick-zone" class="hidden"></div>
    <div id="stick-base" class="hidden"><div id="stick-knob"></div></div>
    <div id="btn-dash" class="hidden">DASH</div>
    
    <div id="weapons" class="hidden">
        <div class="weapon-btn" id="btn-gatling" data-weapon="gatling"><span class="weapon-name">GATLING</span><span class="weapon-level">Lv.1</span></div>
        <div class="weapon-btn disabled" id="btn-fannel" data-weapon="fannel"><span class="weapon-name">FANNEL</span><span class="weapon-level">Lv.0</span></div>
        <div class="weapon-btn disabled" id="btn-missile" data-weapon="missile"><span class="weapon-name">MISSILE</span><span class="weapon-level">Lv.0</span></div>
        <div class="weapon-btn disabled" id="btn-laser" data-weapon="laser"><span class="weapon-name">LASER</span><span class="weapon-level">Lv.0</span></div>
    </div>
    
    <div id="hud" class="hidden">
        <div>WAVE: <span id="wave-text">1</span></div>
        <div>SCORE: <span id="score-text">0</span></div>
        <div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
    </div>
    
    <div id="boss-bar"><div id="boss-hp"></div><div id="boss-name"></div></div>
    <div id="message"></div>
    <div id="respawn"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const WORLD_W = 2000, WORLD_H = 2000;
const LERP_SPEED = 0.15; // 補間速度

let socket = null, myId = null, myPlayer = null, gameState = null, isHost = false, frame = 0;
let camera = { x: 0, y: 0 }, screenShake = { x: 0, y: 0, intensity: 0 };
const input = { dx: 0, dy: 0, dashing: false };
let bullets = [], missiles = [], lasers = [], particles = [], effects = [], dashTrail = [], dashParticles = [];

// 補間用
let displayX = 0, displayY = 0, displayAngle = 0;

// スティック
let stickActive = false, stickTouchId = null;
let stickBaseX = 0, stickBaseY = 0;
let stickKnobX = 0, stickKnobY = 0;
const STICK_RADIUS = 60;
const KNOB_RADIUS = 25;

function init() {
    resize();
    window.addEventListener('resize', resize);
    socket = io({ transports: ['websocket', 'polling'] });
    
    socket.on('connect', () => { document.getElementById('status').textContent = '✓ Connected'; document.getElementById('status').style.color = '#0f0'; });
    socket.on('hosted', (data) => { myId = data.playerId; myPlayer = data.player; displayX = myPlayer.x; displayY = myPlayer.y; displayAngle = myPlayer.angle; isHost = true; document.getElementById('room-id').textContent = data.roomId; document.getElementById('menu-main').classList.add('hidden'); document.getElementById('menu-waiting').classList.remove('hidden'); document.getElementById('start-btn').style.display = 'block'; });
    socket.on('joined', (data) => { myId = data.playerId; myPlayer = data.player; displayX = myPlayer.x; displayY = myPlayer.y; displayAngle = myPlayer.angle; isHost = false; document.getElementById('room-id').textContent = data.roomId; document.getElementById('menu-main').classList.add('hidden'); document.getElementById('menu-waiting').classList.remove('hidden'); document.getElementById('start-btn').style.display = 'none'; });
    socket.on('joinError', (data) => alert(data.message));
    socket.on('gameStarted', () => { document.getElementById('menu').classList.add('hidden'); document.getElementById('stick-zone').classList.remove('hidden'); document.getElementById('btn-dash').classList.remove('hidden'); document.getElementById('weapons').classList.remove('hidden'); document.getElementById('hud').classList.remove('hidden'); showMessage('WAVE 1 START!'); });
    
    socket.on('state', (state) => {
        gameState = state;
        const me = state.players.find(p => p.id === myId);
        if (me) {
            myPlayer = me;
            updateHUD();
            updateWeaponButtons();
            // リスポーンカウンター
            if (!me.alive && me.respawnTimer !== undefined) {
                const remaining = Math.ceil((300 - me.respawnTimer) / 60);
                document.getElementById('respawn').style.display = 'block';
                document.getElementById('respawn').textContent = remaining > 0 ? remaining : '';
            } else {
                document.getElementById('respawn').style.display = 'none';
            }
        }
        if (state.boss) { document.getElementById('boss-bar').style.display = 'block'; document.getElementById('boss-name').textContent = state.boss.name; document.getElementById('boss-hp').style.width = (state.boss.hp / state.boss.maxHp * 100) + '%'; }
        else { document.getElementById('boss-bar').style.display = 'none'; }
    });
    
    socket.on('waveStart', (data) => { showMessage('WAVE ' + data.wave); triggerScreenShake(10); });
    socket.on('bossSpawn', (data) => { showMessage('⚠️ ' + data.name + ' ⚠️', 3000); triggerScreenShake(20); });
    socket.on('bossDefeated', (data) => { showMessage('🎉 BOSS DEFEATED! 🎉', 3000); if (gameState && gameState.boss) { for (let i = 0; i < 50; i++) { const angle = Math.random() * Math.PI * 2; const speed = 2 + Math.random() * 8; particles.push({ x: gameState.boss.x, y: gameState.boss.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: 3 + Math.random() * 8, life: 60, maxLife: 60, color: ['#f00', '#ff0', '#f80', '#fff'][Math.floor(Math.random() * 4)] }); } } triggerScreenShake(30); });
    socket.on('itemCollected', (data) => { showMessage(data.type + ' Lv UP!', 1000); for (let i = 0; i < 15; i++) { particles.push({ x: myPlayer.x + (Math.random() - 0.5) * 40, y: myPlayer.y + (Math.random() - 0.5) * 40, vx: (Math.random() - 0.5) * 3, vy: -1 - Math.random() * 3, size: 2 + Math.random() * 3, life: 40, maxLife: 40, color: '#ff0', type: 'sparkle' }); } });
    socket.on('fannelShot', (data) => { effects.push({ type: 'beam', x: data.x, y: data.y, tx: data.tx, ty: data.ty, life: 8 }); });
    socket.on('died', () => { showMessage('💀 YOU DIED 💀', 2000); triggerScreenShake(25); });
    socket.on('respawned', () => { showMessage('RESPAWN!', 1500); displayX = myPlayer.x; displayY = myPlayer.y; });
    
    setupControls();
    requestAnimationFrame(gameLoop);
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function updateHUD() { document.getElementById('wave-text').textContent = gameState.wave; document.getElementById('score-text').textContent = gameState.score; const hpPercent = Math.max(0, myPlayer.hp / myPlayer.maxHp * 100); document.getElementById('hp-fill').style.width = hpPercent + '%'; document.getElementById('hp-fill').style.background = hpPercent > 50 ? 'linear-gradient(90deg, #0f0, #0ff)' : hpPercent > 25 ? 'linear-gradient(90deg, #ff0, #f80)' : 'linear-gradient(90deg, #f00, #f80)'; }
function updateWeaponButtons() { ['gatling', 'fannel', 'missile', 'laser'].forEach(w => { const btn = document.getElementById('btn-' + w); const level = myPlayer.weapons[w]; const active = myPlayer.autoFire[w]; btn.querySelector('.weapon-level').textContent = 'Lv.' + level; btn.classList.toggle('disabled', level <= 0); btn.classList.toggle('active', active && level > 0); }); }
function showMessage(text, duration = 2000) { const msg = document.getElementById('message'); msg.textContent = text; msg.style.display = 'block'; setTimeout(() => { msg.style.display = 'none'; }, duration); }
function triggerScreenShake(intensity) { screenShake.intensity = Math.max(screenShake.intensity, intensity); }
function updateScreenShake() { if (screenShake.intensity > 0) { screenShake.x = (Math.random() - 0.5) * screenShake.intensity; screenShake.y = (Math.random() - 0.5) * screenShake.intensity; screenShake.intensity *= 0.9; if (screenShake.intensity < 0.5) screenShake.intensity = 0; } else { screenShake.x = 0; screenShake.y = 0; } }

function setupControls() {
    const stickZone = document.getElementById('stick-zone');
    const stickBase = document.getElementById('stick-base');
    const stickKnob = document.getElementById('stick-knob');
    
    // スティック操作
    stickZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (stickActive) return;
        const touch = e.changedTouches[0];
        stickActive = true;
        stickTouchId = touch.identifier;
        stickBaseX = touch.clientX;
        stickBaseY = touch.clientY;
        stickBase.style.display = 'block';
        stickBase.style.left = (stickBaseX - STICK_RADIUS) + 'px';
        stickBase.style.top = (stickBaseY - STICK_RADIUS) + 'px';
        stickKnob.style.left = '50%';
        stickKnob.style.top = '50%';
    }, { passive: false });
    
    stickZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!stickActive) return;
        for (const touch of e.changedTouches) {
            if (touch.identifier === stickTouchId) {
                let dx = touch.clientX - stickBaseX;
                let dy = touch.clientY - stickBaseY;
                const dist = Math.hypot(dx, dy);
                if (dist > STICK_RADIUS) {
                    dx = dx / dist * STICK_RADIUS;
                    dy = dy / dist * STICK_RADIUS;
                }
                stickKnob.style.left = (50 + dx / STICK_RADIUS * 50) + '%';
                stickKnob.style.top = (50 + dy / STICK_RADIUS * 50) + '%';
                input.dx = dx / STICK_RADIUS;
                input.dy = dy / STICK_RADIUS;
            }
        }
    }, { passive: false });
    
    const endStick = (e) => {
        for (const touch of e.changedTouches) {
            if (touch.identifier === stickTouchId) {
                stickActive = false;
                stickTouchId = null;
                stickBase.style.display = 'none';
                input.dx = 0;
                input.dy = 0;
            }
        }
    };
    stickZone.addEventListener('touchend', endStick, { passive: false });
    stickZone.addEventListener('touchcancel', endStick, { passive: false });
    
    // ダッシュ
    const dashBtn = document.getElementById('btn-dash');
    const dashStart = () => { input.dashing = true; dashBtn.classList.add('active'); };
    const dashEnd = () => { input.dashing = false; dashBtn.classList.remove('active'); };
    dashBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dashStart(); }, { passive: false });
    dashBtn.addEventListener('touchend', (e) => { e.preventDefault(); dashEnd(); }, { passive: false });
    dashBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); dashEnd(); }, { passive: false });
    dashBtn.addEventListener('mousedown', dashStart);
    dashBtn.addEventListener('mouseup', dashEnd);
    dashBtn.addEventListener('mouseleave', dashEnd);
    
    // 武器ボタン
    document.querySelectorAll('.weapon-btn').forEach(btn => {
        const toggle = () => toggleWeapon(btn.dataset.weapon);
        btn.addEventListener('touchend', (e) => { e.preventDefault(); toggle(); }, { passive: false });
        btn.addEventListener('click', toggle);
    });
    
    // キーボード
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w') input.dy = -1;
        if (e.key === 'ArrowDown' || e.key === 's') input.dy = 1;
        if (e.key === 'ArrowLeft' || e.key === 'a') input.dx = -1;
        if (e.key === 'ArrowRight' || e.key === 'd') input.dx = 1;
        if (e.key === 'Shift') dashStart();
        if (e.key >= '1' && e.key <= '4') toggleWeapon(['gatling', 'fannel', 'missile', 'laser'][e.key - 1]);
    });
    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w') input.dy = 0;
        if (e.key === 'ArrowDown' || e.key === 's') input.dy = 0;
        if (e.key === 'ArrowLeft' || e.key === 'a') input.dx = 0;
        if (e.key === 'ArrowRight' || e.key === 'd') input.dx = 0;
        if (e.key === 'Shift') dashEnd();
    });
}

function toggleWeapon(weapon) { if (!myPlayer || myPlayer.weapons[weapon] <= 0) return; socket.emit('toggleWeapon', { weapon: weapon }); }
function hostGame() { const name = document.getElementById('player-name').value || 'Host'; socket.emit('hostRoom', { name: name }); }
function joinGame() { const name = document.getElementById('player-name').value || 'Player'; const code = document.getElementById('room-code').value.toUpperCase(); if (!code) { alert('Enter room code'); return; } socket.emit('joinRoom', { name: name, roomId: code }); }
function startGame() { socket.emit('startGame'); }

function updateDashTrail() {
    if (!myPlayer || !myPlayer.alive) return;
    if (myPlayer.dashing) {
        dashTrail.unshift({ x: displayX, y: displayY, angle: displayAngle, life: 30, maxLife: 30, color: '#0ff' });
        for (let i = 0; i < 6; i++) { const spreadAngle = displayAngle + Math.PI + (Math.random() - 0.5) * 1.2; const speed = 3 + Math.random() * 8; dashParticles.push({ x: displayX + (Math.random() - 0.5) * 20, y: displayY + (Math.random() - 0.5) * 20, vx: Math.cos(spreadAngle) * speed, vy: Math.sin(spreadAngle) * speed, size: 1 + Math.random() * 4, life: 20 + Math.random() * 15, maxLife: 35, color: Math.random() > 0.4 ? '#fff' : '#0ff', type: 'star' }); }
        if (Math.random() > 0.5) { dashParticles.push({ x: displayX + (Math.random() - 0.5) * 30, y: displayY + (Math.random() - 0.5) * 30, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, size: 2 + Math.random() * 3, life: 30 + Math.random() * 20, maxLife: 50, color: '#fff', type: 'sparkle' }); }
    }
    dashTrail.forEach(t => t.life--); dashTrail = dashTrail.filter(t => t.life > 0); if (dashTrail.length > 40) dashTrail.length = 40;
    dashParticles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life--; }); dashParticles = dashParticles.filter(p => p.life > 0);
}

function drawDashEffects() {
    if (!myPlayer) return;
    const glowColor = '#0ff';
    dashParticles.forEach(p => { const sx = p.x - camera.x + screenShake.x; const sy = p.y - camera.y + screenShake.y; const alpha = p.life / (p.maxLife || 35); const size = p.size * alpha; ctx.save(); ctx.globalAlpha = alpha; if (p.type === 'sparkle') { ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.shadowBlur = 8; ctx.shadowColor = p.color; const sparkleSize = size * 2; ctx.beginPath(); ctx.moveTo(sx - sparkleSize, sy); ctx.lineTo(sx + sparkleSize, sy); ctx.moveTo(sx, sy - sparkleSize); ctx.lineTo(sx, sy + sparkleSize); ctx.stroke(); } else { ctx.fillStyle = p.color; ctx.shadowBlur = 12; ctx.shadowColor = p.color; ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); });
    if (dashTrail.length > 2) { ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowBlur = 50; ctx.shadowColor = glowColor; ctx.strokeStyle = glowColor; ctx.lineWidth = 25; ctx.globalAlpha = 0.1; ctx.beginPath(); for (let i = 0; i < dashTrail.length; i++) { const t = dashTrail[i]; const sx = t.x - camera.x + screenShake.x; const sy = t.y - camera.y + screenShake.y; if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); } ctx.stroke(); for (let layer = 0; layer < 3; layer++) { const layerWidth = 18 - layer * 6; const layerAlpha = 0.15 + layer * 0.1; ctx.beginPath(); ctx.strokeStyle = layer === 2 ? '#fff' : glowColor; ctx.lineWidth = layerWidth; ctx.globalAlpha = layerAlpha; ctx.shadowBlur = 15 - layer * 4; for (let i = 0; i < dashTrail.length; i++) { const t = dashTrail[i]; const sx = t.x - camera.x + screenShake.x; const sy = t.y - camera.y + screenShake.y; if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); } ctx.stroke(); } ctx.beginPath(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.globalAlpha = 0.8; ctx.shadowBlur = 10; ctx.shadowColor = '#fff'; for (let i = 0; i < Math.min(dashTrail.length, 15); i++) { const t = dashTrail[i]; const sx = t.x - camera.x + screenShake.x; const sy = t.y - camera.y + screenShake.y; if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); } ctx.stroke(); ctx.restore(); }
    dashTrail.forEach((t, idx) => { if (idx % 3 !== 0) return; const sx = t.x - camera.x + screenShake.x; const sy = t.y - camera.y + screenShake.y; const lifeRatio = t.life / (t.maxLife || 30); const alpha = lifeRatio * 0.5; const size = 8 * lifeRatio; ctx.save(); ctx.globalAlpha = alpha; ctx.translate(sx, sy); ctx.shadowBlur = 15; ctx.shadowColor = glowColor; ctx.fillStyle = glowColor; ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
}

function gameLoop() {
    frame++;
    if (gameState && myPlayer) {
        if (myPlayer.alive) {
            // 入力送信
            socket.emit('input', input);
            
            // クライアント予測
            const dashLevel = myPlayer.weapons.dash || 1;
            const speed = input.dashing ? (5 + dashLevel * 0.6) : 5;
            let predictX = displayX + input.dx * speed;
            let predictY = displayY + input.dy * speed;
            predictX = Math.max(30, Math.min(WORLD_W - 30, predictX));
            predictY = Math.max(30, Math.min(WORLD_H - 30, predictY));
            
            // サーバー位置との補間
            displayX = displayX + (predictX - displayX) * 0.5 + (myPlayer.x - displayX) * LERP_SPEED;
            displayY = displayY + (predictY - displayY) * 0.5 + (myPlayer.y - displayY) * LERP_SPEED;
            
            if (input.dx !== 0 || input.dy !== 0) {
                const targetAngle = Math.atan2(input.dy, input.dx);
                let angleDiff = targetAngle - displayAngle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                displayAngle += angleDiff * 0.2;
            }
            
            myPlayer.dashing = input.dashing;
            processWeapons();
        } else {
            // 死亡中はサーバー位置に追従
            displayX = myPlayer.x;
            displayY = myPlayer.y;
        }
        
        camera.x = displayX - canvas.width / 2;
        camera.y = displayY - canvas.height / 2;
    }
    
    updateDashTrail(); updateBullets(); updateParticles(); updateScreenShake();
    draw();
    requestAnimationFrame(gameLoop);
}

function processWeapons() {
    if (!myPlayer || !myPlayer.autoFire) return;
    if (myPlayer.autoFire.gatling && myPlayer.weapons.gatling > 0) { const level = myPlayer.weapons.gatling; const fireRate = Math.max(2, 10 - level); if (frame % fireRate === 0) { const bulletCount = level >= 8 ? 3 : level >= 4 ? 2 : 1; const spread = level >= 5 ? 0.15 : 0; for (let i = 0; i < bulletCount; i++) { const angle = displayAngle + (i - (bulletCount - 1) / 2) * spread; bullets.push({ x: displayX + Math.cos(displayAngle) * 15, y: displayY + Math.sin(displayAngle) * 15, vx: Math.cos(angle) * 18, vy: Math.sin(angle) * 18, damage: 1 + Math.floor(level / 2), life: 40, color: '#0ff', size: 2 }); } } }
    if (myPlayer.autoFire.missile && myPlayer.weapons.missile > 0) { const level = myPlayer.weapons.missile; if (frame % 20 === 0) { for (let i = 0; i < level; i++) { const offsetAngle = displayAngle + (i - (level - 1) / 2) * 0.3; missiles.push({ x: displayX, y: displayY, vx: Math.cos(offsetAngle) * 10, vy: Math.sin(offsetAngle) * 10, damage: 5 + level * 2, life: 80, trail: [] }); } } }
    if (myPlayer.autoFire.laser && myPlayer.weapons.laser > 0) { const level = myPlayer.weapons.laser; if (frame % 2 === 0) { const width = 3 + level * 1.5; const length = 200 + level * 35; const hits = []; const cos = Math.cos(displayAngle), sin = Math.sin(displayAngle); if (gameState) { gameState.enemies.forEach(e => { const dx = e.x - displayX, dy = e.y - displayY; const along = dx * cos + dy * sin; const perp = Math.abs(dx * sin - dy * cos); if (along > 0 && along < length && perp < width + e.size) { hits.push({ id: e.id, damage: 2 + level }); } }); if (gameState.boss) { const dx = gameState.boss.x - displayX, dy = gameState.boss.y - displayY; const along = dx * cos + dy * sin; const perp = Math.abs(dx * sin - dy * cos); if (along > 0 && along < length && perp < width + gameState.boss.size) { hits.push({ id: gameState.boss.id, damage: 2 + level }); } } if (hits.length > 0) socket.emit('attack', { weapon: 'laser', targets: hits }); } lasers.push({ x: displayX, y: displayY, angle: displayAngle, length: length, width: width, life: 3 }); } }
}

function updateBullets() {
    const hits = [];
    bullets = bullets.filter(b => { b.x += b.vx; b.y += b.vy; b.life--; if (b.life <= 0) return false; if (gameState) { for (const e of gameState.enemies) { if (Math.hypot(b.x - e.x, b.y - e.y) < e.size + 4) { hits.push({ id: e.id, damage: b.damage }); for (let i = 0; i < 4; i++) { particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, size: 2, life: 12, maxLife: 12, color: '#0ff' }); } return false; } } if (gameState.boss && Math.hypot(b.x - gameState.boss.x, b.y - gameState.boss.y) < gameState.boss.size + 4) { hits.push({ id: gameState.boss.id, damage: b.damage }); return false; } } return true; });
    missiles = missiles.filter(m => { if (gameState) { let closest = null, minDist = 350; gameState.enemies.forEach(e => { const d = Math.hypot(e.x - m.x, e.y - m.y); if (d < minDist) { minDist = d; closest = e; } }); if (gameState.boss) { const d = Math.hypot(gameState.boss.x - m.x, gameState.boss.y - m.y); if (d < minDist) closest = gameState.boss; } if (closest) { const angle = Math.atan2(closest.y - m.y, closest.x - m.x); const currentAngle = Math.atan2(m.vy, m.vx); let diff = angle - currentAngle; while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2; const turn = Math.min(0.15, Math.abs(diff)) * Math.sign(diff); const newAngle = currentAngle + turn; const speed = Math.hypot(m.vx, m.vy); m.vx = Math.cos(newAngle) * speed; m.vy = Math.sin(newAngle) * speed; } } m.trail.push({ x: m.x, y: m.y, life: 12 }); m.trail = m.trail.filter(t => { t.life--; return t.life > 0; }); if (m.trail.length > 15) m.trail.shift(); m.x += m.vx; m.y += m.vy; m.life--; if (m.life <= 0) return false; if (gameState) { for (const e of gameState.enemies) { if (Math.hypot(m.x - e.x, m.y - e.y) < e.size + 12) { hits.push({ id: e.id, damage: m.damage }); socket.emit('missileExplosion', { x: m.x, y: m.y, radius: 45 }); createExplosion(m.x, m.y, 45); return false; } } if (gameState.boss && Math.hypot(m.x - gameState.boss.x, m.y - gameState.boss.y) < gameState.boss.size + 12) { hits.push({ id: gameState.boss.id, damage: m.damage }); socket.emit('missileExplosion', { x: m.x, y: m.y, radius: 45 }); createExplosion(m.x, m.y, 45); return false; } } return true; });
    lasers = lasers.filter(l => { l.life--; return l.life > 0; });
    effects = effects.filter(e => { e.life--; return e.life > 0; });
    if (hits.length > 0) socket.emit('attack', { targets: hits });
}
function createExplosion(x, y, radius) { for (let i = 0; i < 25; i++) { const angle = Math.random() * Math.PI * 2; const speed = 2 + Math.random() * 5; particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: 2 + Math.random() * 3, life: 25, maxLife: 25, color: ['#f80', '#ff0', '#f00'][Math.floor(Math.random() * 3)] }); } effects.push({ type: 'explosion', x: x, y: y, radius: radius, life: 15, maxLife: 15 }); triggerScreenShake(6); }
function updateParticles() { particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--; return p.life > 0; }); }

function draw() {
    ctx.fillStyle = '#0a0a15'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!gameState) return;
    const sx = screenShake.x, sy = screenShake.y;
    ctx.strokeStyle = 'rgba(0,255,255,0.08)'; ctx.lineWidth = 1; const gridSize = 100; const startX = -camera.x % gridSize + sx; const startY = -camera.y % gridSize + sy; for (let x = startX; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); } for (let y = startY; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
    drawDashEffects();
    gameState.items.forEach(item => { const ix = item.x - camera.x + sx, iy = item.y - camera.y + sy; if (ix < -50 || ix > canvas.width + 50 || iy < -50 || iy > canvas.height + 50) return; const colors = { HP: '#f00', GATLING: '#0ff', FANNEL: '#0f0', MISSILE: '#f80', LASER: '#f0f', DASH: '#ff0' }; ctx.fillStyle = colors[item.type] || '#fff'; ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle; ctx.beginPath(); ctx.arc(ix, iy, 8 + Math.sin(frame * 0.1) * 2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(item.type[0], ix, iy + 3); });
    gameState.enemies.forEach(e => { const ex = e.x - camera.x + sx, ey = e.y - camera.y + sy; if (ex < -60 || ex > canvas.width + 60 || ey < -60 || ey > canvas.height + 60) return; ctx.fillStyle = e.color; ctx.shadowBlur = 12; ctx.shadowColor = e.color; ctx.beginPath(); ctx.arc(ex, ey, e.size, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(ex, ey, e.size * 0.6, 0, Math.PI * 2); ctx.fill(); const hpRatio = e.hp / e.maxHp; ctx.fillStyle = '#300'; ctx.fillRect(ex - e.size, ey - e.size - 8, e.size * 2, 3); ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : hpRatio > 0.25 ? '#ff0' : '#f00'; ctx.fillRect(ex - e.size, ey - e.size - 8, e.size * 2 * hpRatio, 3); });
    if (gameState.boss) { const b = gameState.boss; const bx = b.x - camera.x + sx, by = b.y - camera.y + sy; ctx.fillStyle = b.color; ctx.shadowBlur = 40; ctx.shadowColor = b.color; ctx.globalAlpha = 0.3 + Math.sin(frame * 0.1) * 0.1; ctx.beginPath(); ctx.arc(bx, by, b.size * 1.3, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(bx, by, b.size, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#000'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(bx, by, b.size * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, b.size * 0.15, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#f00'; ctx.shadowBlur = 12; ctx.shadowColor = '#f00'; gameState.bullets.forEach(b => { const bx = b.x - camera.x + sx, by = b.y - camera.y + sy; if (bx < -20 || bx > canvas.width + 20 || by < -20 || by > canvas.height + 20) return; ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill(); }); ctx.shadowBlur = 0;
    bullets.forEach(b => { const bx = b.x - camera.x + sx, by = b.y - camera.y + sy; ctx.fillStyle = b.color; ctx.shadowBlur = 8; ctx.shadowColor = b.color; ctx.beginPath(); ctx.arc(bx, by, b.size, 0, Math.PI * 2); ctx.fill(); }); ctx.shadowBlur = 0;
    missiles.forEach(m => { if (m.trail.length > 1) { ctx.strokeStyle = 'rgba(255,150,0,0.4)'; ctx.lineWidth = 2; ctx.beginPath(); m.trail.forEach((t, i) => { const tx = t.x - camera.x + sx, ty = t.y - camera.y + sy; if (i === 0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty); }); ctx.stroke(); } const mx = m.x - camera.x + sx, my = m.y - camera.y + sy; ctx.save(); ctx.translate(mx, my); ctx.rotate(Math.atan2(m.vy, m.vx)); ctx.fillStyle = '#f80'; ctx.shadowBlur = 12; ctx.shadowColor = '#f80'; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -4); ctx.lineTo(-5, 4); ctx.closePath(); ctx.fill(); ctx.restore(); });
    lasers.forEach(l => { const lx = l.x - camera.x + sx, ly = l.y - camera.y + sy; ctx.save(); ctx.translate(lx, ly); ctx.rotate(l.angle); ctx.shadowBlur = 25; ctx.shadowColor = '#f0f'; const gradient = ctx.createLinearGradient(0, 0, l.length, 0); gradient.addColorStop(0, 'rgba(255,100,255,0.9)'); gradient.addColorStop(0.5, 'rgba(255,50,255,0.6)'); gradient.addColorStop(1, 'rgba(255,0,255,0)'); ctx.fillStyle = gradient; ctx.fillRect(0, -l.width / 2, l.length, l.width); const coreGradient = ctx.createLinearGradient(0, 0, l.length * 0.7, 0); coreGradient.addColorStop(0, 'rgba(255,255,255,0.9)'); coreGradient.addColorStop(1, 'rgba(255,200,255,0)'); ctx.fillStyle = coreGradient; ctx.fillRect(0, -l.width / 4, l.length * 0.7, l.width / 2); ctx.restore(); });
    effects.forEach(e => { const ex = e.x - camera.x + sx, ey = e.y - camera.y + sy; if (e.type === 'explosion') { const progress = 1 - e.life / e.maxLife; const r = e.radius * progress; ctx.strokeStyle = 'rgba(255,150,0,' + (1 - progress) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.stroke(); ctx.strokeStyle = 'rgba(255,255,0,' + ((1 - progress) * 0.5) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, ey, r * 0.6, 0, Math.PI * 2); ctx.stroke(); } else if (e.type === 'beam') { const tx = e.tx - camera.x + sx, ty = e.ty - camera.y + sy; ctx.strokeStyle = 'rgba(0,255,100,' + (e.life / 8) + ')'; ctx.lineWidth = 2; ctx.shadowBlur = 8; ctx.shadowColor = '#0f0'; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(tx, ty); ctx.stroke(); ctx.shadowBlur = 0; } });
    particles.forEach(p => { const px = p.x - camera.x + sx, py = p.y - camera.y + sy; const alpha = p.life / p.maxLife; ctx.fillStyle = p.color; ctx.globalAlpha = alpha; ctx.shadowBlur = 6; ctx.shadowColor = p.color; ctx.beginPath(); ctx.arc(px, py, p.size * alpha, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    
    // プレイヤー描画
    gameState.players.forEach(p => {
        if (!p.alive) return;
        let px, py, pa;
        if (p.id === myId) { px = displayX - camera.x + sx; py = displayY - camera.y + sy; pa = displayAngle; }
        else { px = p.x - camera.x + sx; py = p.y - camera.y + sy; pa = p.angle; }
        if (p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) return;
        ctx.save(); ctx.translate(px, py); ctx.rotate(pa);
        drawShip(ctx, p.id === myId, p.dashing);
        ctx.restore();
        if (p.fannels) { p.fannels.forEach(f => { const fx = px + Math.cos(f.angle) * f.dist; const fy = py + Math.sin(f.angle) * f.dist; ctx.fillStyle = '#0f0'; ctx.shadowBlur = 12; ctx.shadowColor = '#0f0'; ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(fx, fy, 2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }); }
        ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.shadowBlur = 2; ctx.shadowColor = '#000'; ctx.fillText(p.name, px, py - 25); ctx.shadowBlur = 0;
    });
}

// 小さめのスーパーX風機体
function drawShip(ctx, isMe, dashing) {
    const scale = 0.7; // 小さく
    ctx.scale(scale, scale);
    ctx.shadowBlur = dashing ? 35 : 18; ctx.shadowColor = isMe ? '#0ff' : '#08f';
    ctx.fillStyle = '#8899aa'; ctx.strokeStyle = '#bcd'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(10, -7); ctx.lineTo(-5, -9); ctx.lineTo(-13, -7); ctx.lineTo(-16, 0); ctx.lineTo(-13, 7); ctx.lineTo(-5, 9); ctx.lineTo(10, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#667788'; ctx.beginPath(); ctx.ellipse(-5, -12, 9, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(-5, 12, 9, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const engineGlow = dashing ? 1 : 0.6 + Math.sin(frame * 0.2) * 0.2; ctx.fillStyle = 'rgba(0,170,255,' + engineGlow + ')'; ctx.shadowBlur = 20; ctx.shadowColor = '#0af'; ctx.beginPath(); ctx.arc(-11, -12, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(-11, 12, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(-16, 0, 3, 0, Math.PI * 2); ctx.fill();
    if (dashing) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(-11, -12, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(-11, 12, 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#0066aa'; ctx.shadowBlur = 8; ctx.shadowColor = '#08f'; ctx.beginPath(); ctx.ellipse(6, 0, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c9a227'; ctx.shadowBlur = 0; ctx.fillRect(3, -1.5, 10, 1.2); ctx.fillRect(3, 0.3, 10, 1.2);
    if (frame % 40 < 20) { ctx.fillStyle = '#f00'; ctx.shadowBlur = 8; ctx.shadowColor = '#f00'; ctx.beginPath(); ctx.arc(0, -7, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(0, 7, 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.shadowBlur = 0;
    ctx.scale(1/scale, 1/scale);
}

window.onload = init;
</script>
