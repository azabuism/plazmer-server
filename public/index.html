// ========== 敵生成 ==========
function spawnEnemy(type, x, y) {
    const template = ENEMY_TYPES[type];
    if (!template) return null;
    
    const waveScale = 1 + wave * 0.08;
    
    const enemy = {
        id: 'e_' + (enemyIdCounter++),
        type,
        x, y,
        hp: Math.floor(template.hp * waveScale),
        maxHp: Math.floor(template.hp * waveScale),
        speed: template.speed + wave * 0.03,
        size: template.size,
        color: template.color,
        score: template.score,
        name: template.name,
        shoots: template.shoots || false,
        armor: template.armor || false,
        divides: template.divides || false,
        isBoss: false,
        timer: Math.floor(Math.random() * 60),
        phase: Math.random() * Math.PI * 2
    };
    
    enemies.push(enemy);
    return enemy;
}

function spawnBoss() {
    let template, bossIndex;
    
    if (wave >= 100) {
        // WAVE 100以降はMEGA BOSS
        bossIndex = (Math.floor((wave - 100) / 10)) % MEGA_BOSS_TYPES.length;
        template = MEGA_BOSS_TYPES[bossIndex];
    } else {
        bossIndex = (wave - 1) % BOSS_TYPES.length;
        template = BOSS_TYPES[bossIndex];
    }
    
    const waveScale = 1 + Math.floor(wave / 10) * 0.3;
    
    const pos = findSafeSpawnPosition(500);
    
    const boss = {
        id: 'boss_' + (enemyIdCounter++),
        type: 'boss',
        bossType: bossIndex,
        pattern: template.pattern,
        x: pos.x,
        y: pos.y,
        hp: Math.floor(template.baseHp * waveScale),
        maxHp: Math.floor(template.baseHp * waveScale),
        speed: 1.5,
        size: template.size + Math.floor(wave / 5) * 2,
        color: template.color,
        score: 3000 + wave * 500,
        name: template.name,
        isBoss: true,
        timer: 0,
        attackTimer: 0,
        phase: 0,
        isMega: wave >= 100
    };
    
    enemies.push(boss);
    currentBoss = boss;
    
    ui.bossContainer.style.display = 'block';
    ui.bossName.textContent = `◆ WAVE ${wave} - ${boss.name} ◆`;
    showMessage(`◆ ${boss.name} ◆`);
    triggerScreenShake(wave >= 100 ? 40 : 20);
    playSound('bossAppear');
    
    return boss;
}

function findSafeSpawnPosition(minDist) {
    for (let i = 0; i < 50; i++) {
        const x = 150 + Math.random() * (WORLD_W - 300);
        const y = 150 + Math.random() * (WORLD_H - 300);
        if (checkWall(x, y)) continue;
        if (player && Math.hypot(player.x - x, player.y - y) < minDist) continue;
        return { x, y };
    }
    return { x: WORLD_W - 300, y: WORLD_H - 300 };
}

// ========== 敵更新 ==========
function updateEnemies() {
    enemies.forEach(enemy => {
        if (enemy.hp <= 0) return;
        enemy.timer++;
        
        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        const vx = Math.cos(angle) * enemy.speed;
        const vy = Math.sin(angle) * enemy.speed;
        
        if (!checkWall(enemy.x + vx, enemy.y + vy)) {
            enemy.x += vx;
            enemy.y += vy;
        } else {
            // 壁を避ける
            if (!checkWall(enemy.x + vx, enemy.y)) enemy.x += vx;
            else if (!checkWall(enemy.x, enemy.y + vy)) enemy.y += vy;
        }
        
        if (player && Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.r + enemy.size) {
            if (!player.dashing && player.invincible <= 0) {
                player.damage(enemy.isBoss ? 20 : 10);
            }
        }
        
        if (enemy.shoots && enemy.timer % 90 === 0) {
            const a = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemyBullets.push({ x: enemy.x, y: enemy.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 5, color: enemy.color });
            playSound('enemyShoot');
        }
        
        if (enemy.isBoss) {
            enemy.attackTimer++;
            bossAttack(enemy);
        }
    });
}

// ========== ボス攻撃パターン ==========
function bossAttack(boss) {
    const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
    
    switch (boss.pattern) {
        case 'radial':
            if (boss.attackTimer % 60 === 0) {
                for (let i = 0; i < 16; i++) {
                    const a = (Math.PI * 2 / 16) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 150, size: 6, color: boss.color });
                }
                boss.phase += 0.2;
                playSound('bossAttack');
            }
            break;
            
        case 'spiral':
            if (boss.attackTimer % 8 === 0) {
                const a = boss.timer * 0.15;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 5, color: boss.color });
            }
            break;
            
        case 'burst':
            if (boss.attackTimer % 40 === 0) {
                for (let i = 0; i < 8; i++) {
                    const a = angle + (Math.random() - 0.5) * 0.8;
                    const speed = 4 + Math.random() * 3;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 60, size: 8, color: '#f80' });
                }
                playSound('bossAttack');
            }
            break;
            
        case 'divide':
            if (boss.attackTimer % 90 === 0) {
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI * 2 / 6) * i;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 90, size: 10, color: boss.color, splits: true, splitTimer: 45 });
                }
                playSound('bossAttack');
            }
            break;
            
        case 'swarm':
            if (boss.attackTimer % 5 === 0) {
                const a = angle + (Math.random() - 0.5) * 1.5;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, life: 80, size: 4, color: boss.color });
            }
            break;
            
        case 'laser':
            if (boss.attackTimer % 120 === 0) {
                for (let i = 0; i < 4; i++) {
                    const a = (Math.PI * 2 / 4) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, life: 150, size: 6, color: '#0ff', bounces: 3, isLaser: true });
                }
                boss.phase += 0.3;
                triggerScreenShake(15);
                playSound('bossLaser');
            }
            break;
            
        case 'chaos':
            if (boss.attackTimer % 30 === 0) {
                const pattern = Math.floor(boss.attackTimer / 30) % 4;
                switch (pattern) {
                    case 0:
                        for (let i = 0; i < 12; i++) {
                            const a = (Math.PI * 2 / 12) * i;
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 120, size: 6, color: '#f00' });
                        }
                        break;
                    case 1:
                        for (let i = 0; i < 3; i++) {
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3, life: 180, size: 8, color: '#a0f', homing: true });
                        }
                        break;
                    case 2:
                        for (let i = 0; i < 20; i++) {
                            const a = Math.random() * Math.PI * 2;
                            const speed = 2 + Math.random() * 4;
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 100, size: 5, color: '#ff0' });
                        }
                        break;
                    case 3:
                        for (let i = 0; i < 8; i++) {
                            const a1 = boss.timer * 0.1 + (Math.PI * 2 / 8) * i;
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a1) * 5, vy: Math.sin(a1) * 5, life: 100, size: 5, color: '#0f0' });
                        }
                        break;
                }
                playSound('bossAttack');
            }
            break;
            
        case 'all':
            if (boss.attackTimer % 20 === 0) {
                const a = boss.timer * 0.12;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 150, size: 5, color: '#fff' });
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a + Math.PI) * 4, vy: Math.sin(a + Math.PI) * 4, life: 150, size: 5, color: '#fff' });
            }
            if (boss.attackTimer % 60 === 0) {
                for (let i = 0; i < 24; i++) {
                    const a = (Math.PI * 2 / 24) * i;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 6, color: '#f00' });
                }
                triggerScreenShake(20);
                playSound('bossAttack');
            }
            if (boss.attackTimer % 120 === 0) {
                for (let i = 0; i < 4; i++) {
                    const types = Object.keys(ENEMY_TYPES);
                    const type = types[Math.floor(Math.random() * types.length)];
                    const a = (Math.PI * 2 / 4) * i;
                    spawnEnemy(type, boss.x + Math.cos(a) * 100, boss.y + Math.sin(a) * 100);
                }
            }
            break;
            
        // MEGA BOSS パターン
        case 'mega1':
            // 全方位レーザー + ミサイル群
            if (boss.attackTimer % 40 === 0) {
                for (let i = 0; i < 32; i++) {
                    const a = (Math.PI * 2 / 32) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, life: 150, size: 7, color: '#f00' });
                }
                boss.phase += 0.1;
            }
            if (boss.attackTimer % 60 === 0) {
                for (let i = 0; i < 6; i++) {
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle) * 2, vy: Math.sin(angle) * 2, life: 300, size: 10, color: '#f0f', homing: true });
                }
                playSound('bossLaser');
            }
            break;
            
        case 'mega2':
            // 二重螺旋 + 分裂弾
            if (boss.attackTimer % 5 === 0) {
                const a = boss.timer * 0.2;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 6, color: '#0ff' });
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(-a) * 5, vy: Math.sin(-a) * 5, life: 120, size: 6, color: '#f0f' });
            }
            if (boss.attackTimer % 80 === 0) {
                for (let i = 0; i < 8; i++) {
                    const a = (Math.PI * 2 / 8) * i;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 120, size: 12, color: '#ff0', splits: true, splitTimer: 40 });
                }
            }
            break;
            
        case 'mega3':
            // 全攻撃同時
            if (boss.attackTimer % 30 === 0) {
                // 放射
                for (let i = 0; i < 20; i++) {
                    const a = (Math.PI * 2 / 20) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 150, size: 6, color: '#f00' });
                }
                boss.phase += 0.15;
            }
            if (boss.attackTimer % 10 === 0) {
                // 螺旋
                const a = boss.timer * 0.25;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, life: 100, size: 5, color: '#ff0' });
            }
            if (boss.attackTimer % 50 === 0) {
                // 追尾
                for (let i = 0; i < 4; i++) {
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle) * 2, vy: Math.sin(angle) * 2, life: 250, size: 9, color: '#a0f', homing: true });
                }
            }
            break;
            
        case 'final':
            // 最終形態：全パターン + 雑魚大量召喚
            if (boss.attackTimer % 15 === 0) {
                for (let i = 0; i < 16; i++) {
                    const a = (Math.PI * 2 / 16) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 180, size: 6, color: '#fff' });
                }
                boss.phase += 0.08;
            }
            if (boss.attackTimer % 8 === 0) {
                const a = boss.timer * 0.3;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 7, vy: Math.sin(a) * 7, life: 100, size: 5, color: '#0ff' });
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(-a + Math.PI) * 7, vy: Math.sin(-a + Math.PI) * 7, life: 100, size: 5, color: '#f0f' });
            }
            if (boss.attackTimer % 90 === 0) {
                for (let i = 0; i < 8; i++) {
                    const types = Object.keys(ENEMY_TYPES);
                    const type = types[Math.floor(Math.random() * types.length)];
                    const a = (Math.PI * 2 / 8) * i;
                    spawnEnemy(type, boss.x + Math.cos(a) * 150, boss.y + Math.sin(a) * 150);
                }
                triggerScreenShake(30);
            }
            if (boss.attackTimer % 120 === 0) {
                for (let i = 0; i < 5; i++) {
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle + (i - 2) * 0.3) * 2, vy: Math.sin(angle + (i - 2) * 0.3) * 2, life: 400, size: 12, color: '#f00', homing: true });
                }
                playSound('bossLaser');
            }
            break;
    }
}

// ========== ダメージ処理 ==========
function damageEnemy(enemy, damage, weaponType) {
    if (enemy.hp <= 0) return;
    
    if (enemy.armor && weaponType !== 'THUNDER' && weaponType !== 'LASER') {
        damage = Math.floor(damage / 2);
    }
    
    enemy.hp -= damage;
    createFloatingText(enemy.x, enemy.y - enemy.size, `-${damage}`, '#fff');
    
    if (enemy.hp <= 0) defeatEnemy(enemy);
}

function defeatEnemy(enemy) {
    createParticles(enemy.x, enemy.y, enemy.color, enemy.isBoss ? 50 : 15);
    playSound(enemy.isBoss ? 'bossDefeat' : 'enemyDefeat');
    addCombo();
    
    score += Math.floor(enemy.score * combo.multiplier);
    ui.score.textContent = score;
    
    dropItems(enemy.x, enemy.y, enemy.isBoss);
    
    if (enemy.divides && !enemy.isBoss) {
        for (let i = 0; i < 2; i++) {
            const a = Math.random() * Math.PI * 2;
            spawnEnemy('virus', enemy.x + Math.cos(a) * 30, enemy.y + Math.sin(a) * 30);
        }
    }
    
    if (enemy.isBoss) {
        currentBoss = null;
        ui.bossContainer.style.display = 'none';
        showMessage('◆ PATHOGEN ELIMINATED ◆');
        triggerScreenShake(40);
        
        enemies.forEach(e => {
            if (!e.isBoss && e.hp > 0) {
                e.hp = 0;
                score += 50;
            }
        });
        ui.score.textContent = score;
        
        setTimeout(() => {
            if (gameState === 'playing') startWave();
        }, 3000);
    }
}

// ========== アイテム ==========
function dropItems(x, y, isBoss) {
    const itemColors = {
        PLAZMER: '#fff',
        HOMING: '#a0f',
        LASER: '#0ff',
        THUNDER: '#ff0',
        ALLRANGE: '#0f0',
        H: '#f06'
    };
    
    if (isBoss) {
        const count = 5 + Math.floor(Math.random() * 3);
        const types = ['PLAZMER', 'HOMING', 'LASER', 'THUNDER', 'ALLRANGE', 'H'];
        for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i;
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({
                x: x + Math.cos(a) * 60,
                y: y + Math.sin(a) * 60,
                type,
                color: itemColors[type]
            });
        }
    } else {
        if (Math.random() < 0.10) {
            const types = ['PLAZMER', 'HOMING', 'LASER', 'THUNDER'];
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({ x, y, type, color: itemColors[type] });
        }
        if (Math.random() < 0.04) {
            items.push({ x, y, type: 'H', color: '#f06' });
        }
        if (Math.random() < 0.03) {
            items.push({ x, y, type: 'ALLRANGE', color: '#0f0' });
        }
    }
}

function updateItems() {
    items = items.filter(item => {
        if (player && Math.hypot(player.x - item.x, player.y - item.y) < 150) {
            item.x += (player.x - item.x) * 0.1;
            item.y += (player.y - item.y) * 0.1;
        }
        
        if (player && Math.hypot(player.x - item.x, player.y - item.y) < player.r + 12) {
            collectItem(item.type);
            createFloatingText(item.x, item.y, item.type + '!', item.color);
            playSound('powerup');
            return false;
        }
        return true;
    });
}

function collectItem(type) {
    if (type === 'H') {
        player.heal(30);
    } else if (type === 'ALLRANGE') {
        if (options.length < 6) options.push(new Option());
        weaponLevels.ALLRANGE++;
    } else {
        weaponLevels[type] = (weaponLevels[type] || 0) + 1;
    }
    updateWeaponUI();
}

function updateWeaponUI() {
    ui.weapons.plazmer.classList.add('active');
    ui.weapons.plazmer.textContent = `PLAZMER Lv${weaponLevels.PLAZMER}`;
    
    ui.weapons.homing.classList.toggle('locked', weaponLevels.HOMING <= 0);
    ui.weapons.homing.classList.toggle('active', weaponLevels.HOMING > 0);
    ui.weapons.homing.textContent = weaponLevels.HOMING > 0 ? `HOMING Lv${weaponLevels.HOMING}` : 'HOMING';
    
    ui.weapons.laser.classList.toggle('locked', weaponLevels.LASER <= 0);
    ui.weapons.laser.classList.toggle('active', weaponLevels.LASER > 0);
    ui.weapons.laser.textContent = weaponLevels.LASER > 0 ? `LASER Lv${weaponLevels.LASER}` : 'LASER';
    
    ui.weapons.thunder.classList.toggle('locked', weaponLevels.THUNDER <= 0);
    ui.weapons.thunder.classList.toggle('active', weaponLevels.THUNDER > 0);
    ui.weapons.thunder.textContent = weaponLevels.THUNDER > 0 ? `THUNDER Lv${weaponLevels.THUNDER}` : 'THUNDER';
    
    ui.weapons.allrange.classList.toggle('locked', weaponLevels.ALLRANGE <= 0);
    ui.weapons.allrange.classList.toggle('active', weaponLevels.ALLRANGE > 0);
    ui.weapons.allrange.textContent = weaponLevels.ALLRANGE > 0 ? `ALL-RANGE x${options.length}` : 'ALL-RANGE';
    
    ui.formationDisplay.textContent = `FORMATION: ${FORMATIONS[currentFormation]}`;
}

// ========== WAVE管理 ==========
function startWave() {
    wave++;
    walls = generateWalls(wave);
    
    if (player && checkWall(player.x, player.y)) {
        player.update();
    }
    
    ui.wave.textContent = wave;
    showMessage(`◆ WAVE ${wave} ◆`);
    
    if (wave >= 100 && wave % 10 === 0) {
        showMessage(`◆ MEGA BOSS INCOMING ◆`);
    }
    
    setTimeout(() => {
        if (gameState === 'playing') spawnBoss();
    }, 1500);
}

function spawnMobs() {
    if (!currentBoss || currentBoss.hp <= 0) return;
    
    const mobCount = enemies.filter(e => !e.isBoss && e.hp > 0).length;
    if (mobCount >= 25) return;
    
    const pos = findSafeSpawnPosition(250);
    
    const types = ['virus', 'bacteria'];
    if (wave >= 2) types.push('infected', 'toxin');
    if (wave >= 4) types.push('mutant', 'parasite');
    if (wave >= 6) types.push('cancer');
    if (wave >= 8) types.push('tumor', 'plague');
    if (wave >= 10) types.push('necrosis');
    
    const type = types[Math.floor(Math.random() * types.length)];
    spawnEnemy(type, pos.x, pos.y);
}

// ========== 敵弾更新 ==========
function updateEnemyBullets() {
    enemyBullets.forEach(b => {
        if (b.homing && player) {
            const a = Math.atan2(player.y - b.y, player.x - b.x);
            let d = a - Math.atan2(b.vy, b.vx);
            while (d < -Math.PI) d += Math.PI * 2;
            while (d > Math.PI) d -= Math.PI * 2;
            const speed = Math.hypot(b.vx, b.vy);
            const newAngle = Math.atan2(b.vy, b.vx) + d * 0.04;
            b.vx = Math.cos(newAngle) * speed;
            b.vy = Math.sin(newAngle) * speed;
        }
        
        if (b.bounces && b.bounces > 0) {
            const normal = getWallNormal(b.x + b.vx, b.y + b.vy);
            if (normal) {
                const dot = b.vx * normal.x + b.vy * normal.y;
                b.vx = b.vx - 2 * dot * normal.x;
                b.vy = b.vy - 2 * dot * normal.y;
                b.bounces--;
            }
        }
        
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        
        // 分裂弾
        if (b.splits && b.splitTimer) {
            b.splitTimer--;
            if (b.splitTimer <= 0) {
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI * 2 / 6) * i;
                    enemyBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 60, size: 5, color: b.color });
                }
                b.dead = true;
            }
        }
        
        if (b.life <= 0 || (checkWall(b.x, b.y) && !b.bounces)) b.dead = true;
        
        if (player && Math.hypot(player.x - b.x, player.y - b.y) < player.r + b.size) {
            player.damage(8);
            b.dead = true;
        }
    });
    
    enemyBullets = enemyBullets.filter(b => !b.dead);
}

// ========== フォーメーション切り替え ==========
function cycleFormation() {
    currentFormation = (currentFormation + 1) % FORMATIONS.length;
    ui.formationDisplay.textContent = `FORMATION: ${FORMATIONS[currentFormation]}`;
    showMessage(FORMATIONS[currentFormation]);
    playSound('switch');
}

// ========== ユーティリティ ==========
function distToSegment(px, py, x1, y1, x2, y2) {
    const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let t = lenSq !== 0 ? Math.max(0, Math.min(1, dot / lenSq)) : 0;
    return Math.hypot(px - (x1 + t * C), py - (y1 + t * D));
}

class Particle {
    constructor(x, y, color, size, life) {
        this.x = x; this.y = y;
        this.color = color;
        this.size = size || 3;
        this.life = life || 20;
        this.maxLife = this.life;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;
        this.life--;
    }
    draw() {
        const alpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function createParticle(x, y, color) {
    particles.push(new Particle(x, y, color, 4, 15));
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, 3 + Math.random() * 4, 15 + Math.random() * 15));
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x; this.y = y;
        this.text = text;
        this.color = color;
        this.life = 40;
        this.vy = -2;
    }
    update() {
        this.y += this.vy;
        this.vy *= 0.95;
        this.life--;
    }
    draw() {
        const alpha = this.life / 40;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x - camera.x, this.y - camera.y);
        ctx.globalAlpha = 1;
    }
}

function createFloatingText(x, y, text, color) {
    texts.push(new FloatingText(x, y, text, color));
}

function showMessage(text) {
    ui.message.textContent = text;
    ui.message.style.opacity = 1;
    setTimeout(() => ui.message.style.opacity = 0, 2000);
}

function triggerScreenShake(intensity) {
    screenShake.intensity = Math.max(screenShake.intensity, intensity);
}

function updateScreenShake() {
    if (screenShake.intensity > 0) {
        screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.intensity *= 0.9;
        if (screenShake.intensity < 0.5) screenShake.intensity = 0;
    } else {
        screenShake.x = 0;
        screenShake.y = 0;
    }
}

function addCombo() {
    combo.count++;
    combo.timer = 120;
    combo.multiplier = 1 + Math.floor(combo.count / 5) * 0.5;
    if (combo.multiplier > 5) combo.multiplier = 5;
}

function updateCombo() {
    if (combo.timer > 0) {
        combo.timer--;
        if (combo.timer === 0) {
            combo.count = 0;
            combo.multiplier = 1;
        }
    }
}

function triggerDash() {
    if (player && gameState === 'playing') player.dash();
}

function triggerBomb() {
    if (!player || gameState !== 'playing' || player.bombs <= 0) return;
    player.bombs--;
    ui.bomb.textContent = player.bombs;
    
    enemies.forEach(e => {
        if (e.hp > 0 && Math.hypot(e.x - player.x, e.y - player.y) < 600) {
            damageEnemy(e, 80, 'BOMB');
        }
    });
    enemyBullets = [];
    
    playSound('bomb');
    triggerScreenShake(30);
    
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function endGame() {
    gameState = 'over';
    stopBGM();
    ui.gameOver.style.display = 'flex';
    document.getElementById('final-score').textContent = `SCORE: ${score}`;
    playSound('gameOver');
}

// ========== カメラ ==========
function updateCamera() {
    if (!player) return;
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;
    camera.x = Math.max(0, Math.min(WORLD_W - canvas.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H - canvas.height, camera.y));
}

// ========== 敵インジケーター描画 ==========
function drawEnemyIndicators() {
    const margin = 50;
    
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        
        const sx = e.x - camera.x;
        const sy = e.y - camera.y;
        
        // 画面外の場合のみ矢印を表示
        if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) {
            const angle = Math.atan2(e.y - player.y, e.x - player.x);
            const dist = Math.hypot(e.x - player.x, e.y - player.y);
            
            // 画面端の位置を計算
            let indicatorX = canvas.width / 2 + Math.cos(angle) * (canvas.width / 2 - margin);
            let indicatorY = canvas.height / 2 + Math.sin(angle) * (canvas.height / 2 - margin);
            
            // 画面内に収める
            indicatorX = Math.max(margin, Math.min(canvas.width - margin, indicatorX));
            indicatorY = Math.max(margin, Math.min(canvas.height - margin, indicatorY));
            
            // 矢印描画
            ctx.save();
            ctx.translate(indicatorX, indicatorY);
            ctx.rotate(angle);
            
            ctx.fillStyle = e.isBoss ? '#ff0' : '#f00';
            ctx.shadowBlur = 10;
            ctx.shadowColor = e.isBoss ? '#ff0' : '#f00';
            
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(-8, 10);
            ctx.lineTo(-3, 0);
            ctx.lineTo(-8, -10);
            ctx.fill();
            
            ctx.restore();
            
            // ボスの場合は距離とBOSS表示
            if (e.isBoss) {
                ctx.fillStyle = '#ff0';
                ctx.font = 'bold 12px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('BOSS', indicatorX, indicatorY + 25);
                ctx.fillText(Math.floor(dist) + 'm', indicatorX, indicatorY + 38);
            }
        }
    });
}

// ========== 描画 ==========
function draw() {
    ctx.fillStyle = '#000810';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // グリッド
    ctx.strokeStyle = 'rgba(100,20,30,0.3)';
    ctx.lineWidth = 1;
    const gridSize = 80;
    for (let x = -camera.x % gridSize; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = -camera.y % gridSize; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
    
    // 壁（赤血球/細胞壁）
    walls.forEach(w => {
        const sx = w.x - camera.x + screenShake.x;
        const sy = w.y - camera.y + screenShake.y;
        
        if (w.type === 'cell') {
            // 赤血球（円形）
            ctx.fillStyle = 'rgba(150,30,50,0.8)';
            ctx.strokeStyle = '#f66';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f00';
            ctx.beginPath();
            ctx.arc(w.cx - camera.x + screenShake.x, w.cy - camera.y + screenShake.y, w.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // 中央のくぼみ（赤血球っぽく）
            ctx.fillStyle = 'rgba(100,20,30,0.5)';
            ctx.beginPath();
            ctx.arc(w.cx - camera.x + screenShake.x, w.cy - camera.y + screenShake.y, w.radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 外壁
            ctx.fillStyle = 'rgba(100,30,50,0.9)';
            ctx.strokeStyle = '#f88';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f44';
            ctx.fillRect(sx, sy, w.w, w.h);
            ctx.strokeRect(sx, sy, w.w, w.h);
        }
        ctx.shadowBlur = 0;
    });
    
    // アイテム
    items.forEach(item => {
        const sx = item.x - camera.x + screenShake.x;
        const sy = item.y - camera.y + screenShake.y;
        
        ctx.fillStyle = item.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = item.color;
        
        if (item.type === 'H') {
            ctx.beginPath();
            ctx.moveTo(sx, sy - 3);
            ctx.bezierCurveTo(sx - 8, sy - 10, sx - 15, sy, sx, sy + 10);
            ctx.bezierCurveTo(sx + 15, sy, sx + 8, sy - 10, sx, sy - 3);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(sx, sy, 10 + Math.sin(frame * 0.1) * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = 'bold 9px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(item.type[0], sx, sy + 3);
        }
        ctx.shadowBlur = 0;
    });
    
    // 敵
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        const sx = e.x - camera.x + screenShake.x;
        const sy = e.y - camera.y + screenShake.y;
        
        if (e.isBoss) {
            drawBoss(e, sx, sy);
        } else {
            drawEnemy(e, sx, sy);
        }
    });
    
    // 敵弾
    enemyBullets.forEach(b => {
        const sx = b.x - camera.x + screenShake.x;
        const sy = b.y - camera.y + screenShake.y;
        
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.beginPath();
        ctx.arc(sx, sy, b.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });
    
    // 弾
    bullets.forEach(b => { if (!b.dead) b.draw(); });
    
    // パーティクル
    particles.forEach(p => p.draw());
    
    // テキスト
    texts.forEach(t => t.draw());
    
    // プレイヤー
    if (player) player.draw();
    
    // 敵インジケーター（矢印）
    drawEnemyIndicators();
    
    // コンボ表示
    if (combo.count > 0) {
        ctx.fillStyle = combo.multiplier >= 3 ? '#f00' : '#0ff';
        ctx.font = 'bold 20px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(`${combo.count} CHAIN x${combo.multiplier.toFixed(1)}`, canvas.width - 20, canvas.height - 80);
    }
    
    // ミニマップ
    drawMinimap();
}

function drawEnemy(e, sx, sy) {
    ctx.save();
    ctx.translate(sx, sy);
    
    const pulse = Math.sin(frame * 0.1 + e.phase) * 2;
    
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = e.color;
    
    // ウイルス形状
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
        const a = (Math.PI * 2 / 12) * i + frame * 0.02;
        const r = e.size + (i % 2 === 0 ? 4 + pulse : 0);
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.arc(0, 0, e.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
    
    // HPバー
    const hpRatio = e.hp / e.maxHp;
    ctx.fillStyle = '#300';
    ctx.fillRect(sx - e.size, sy - e.size - 10, e.size * 2, 4);
    ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : hpRatio > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(sx - e.size, sy - e.size - 10, e.size * 2 * hpRatio, 4);
    
    ctx.fillStyle = '#fff';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(e.hp, sx, sy - e.size - 14);
}

function drawBoss(boss, sx, sy) {
    ctx.save();
    ctx.translate(sx, sy);
    
    const pulse = Math.sin(frame * 0.05) * 5;
    
    ctx.strokeStyle = boss.color;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 30;
    ctx.shadowColor = boss.color;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(0, 0, boss.size + 20 + pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    
    ctx.rotate(frame * 0.02);
    ctx.strokeStyle = boss.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i;
        const r = boss.size + 10;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.stroke();
    
    ctx.rotate(-frame * 0.02);
    ctx.fillStyle = boss.color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
        const a = (Math.PI * 2 / 16) * i + frame * 0.01;
        const r = boss.size + (i % 2 === 0 ? 8 + pulse : 0);
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 0, boss.size * 0.4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, boss.size * 0.15, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function drawMinimap() {
    const mapW = 120, mapH = 120;
    const mapX = canvas.width - mapW - 10;
    const mapY = canvas.height - mapH - 10;
    const scale = mapW / WORLD_W;
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(mapX, mapY, mapW, mapH);
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 1;
    ctx.strokeRect(mapX, mapY, mapW, mapH);
    
    // 壁
    ctx.fillStyle = 'rgba(255,100,100,0.5)';
    walls.forEach(w => {
        if (w.type === 'cell') {
            ctx.beginPath();
            ctx.arc(mapX + w.cx * scale, mapY + w.cy * scale, w.radius * scale, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillRect(mapX + w.x * scale, mapY + w.y * scale, w.w * scale, w.h * scale);
        }
    });
    
    // 敵
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        ctx.fillStyle = e.isBoss ? '#ff0' : e.color;
        ctx.beginPath();
        ctx.arc(mapX + e.x * scale, mapY + e.y * scale, e.isBoss ? 4 : 2, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // プレイヤー
    if (player) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(mapX + player.x * scale, mapY + player.y * scale, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ========== サウンドシステム ==========
let audioCtx = null;
let bgmOsc = null;
let bgmGain = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playBGM() {
    if (!audioCtx) return;
    
    bgmGain = audioCtx.createGain();
    bgmGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    bgmGain.connect(audioCtx.destination);
    
    // 簡易BGM（低音のドローン）
    bgmOsc = audioCtx.createOscillator();
    bgmOsc.type = 'sine';
    bgmOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
    bgmOsc.connect(bgmGain);
    bgmOsc.start();
}

function stopBGM() {
    if (bgmOsc) {
        bgmOsc.stop();
        bgmOsc = null;
    }
}

function playSound(type) {
    if (!audioCtx) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    switch (type) {
        case 'shoot':
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            break;
            
        case 'laser':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            break;
            
        case 'missile':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
            
        case 'thunder':
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            break;
            
        case 'reflect':
            osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            break;
            
        case 'explode':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            break;
            
        case 'powerup':
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            break;
            
        case 'dash':
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
            
        case 'hit':
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
            
        case 'heal':
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
            
        case 'bomb':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            break;
            
        case 'switch':
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.setValueAtTime(700, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
            
        case 'enemyShoot':
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
            
        case 'enemyDefeat':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
            
        case 'bossAppear':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.5);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
            break;
            
        case 'bossAttack':
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            break;
            
        case 'bossLaser':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            break;
            
        case 'bossDefeat':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.8);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            break;
            
        case 'gameOver':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            osc.start(); osc.stop(audioCtx.currentTime + 1.5);
            break;
    }
}

// ========== モバイルコントロール ==========
function initMobileControls() {
    const joystickZone = document.getElementById('joystick-zone');
    const stick = document.getElementById('joystick-stick');
    
    let startX, startY;
    
    joystickZone.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = joystickZone.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
        joystick.active = true;
    });
    
    joystickZone.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!joystick.active) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 45;
        
        const clampedDist = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        
        joystick.dx = (clampedDist / maxDist) * Math.cos(angle);
        joystick.dy = (clampedDist / maxDist) * Math.sin(angle);
        
        stick.style.transform = `translate(calc(-50% + ${joystick.dx * maxDist}px), calc(-50% + ${joystick.dy * maxDist}px))`;
    });
    
    joystickZone.addEventListener('touchend', () => {
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        stick.style.transform = 'translate(-50%, -50%)';
    });
    
    document.getElementById('btn-dash').addEventListener('touchstart', e => {
        e.preventDefault();
        triggerDash();
    });
    
    document.getElementById('btn-bomb').addEventListener('touchstart', e => {
        e.preventDefault();
        triggerBomb();
    });
    
    document.getElementById('btn-form').addEventListener('touchstart', e => {
        e.preventDefault();
        cycleFormation();
    });
}

// ========== メインループ ==========
function update() {
    if (gameState !== 'playing') return;
    
    try {
        frame++;
        
        if (player) {
            player.update();
            updateCamera();
        }
        
        soloWaveTimer++;
        soloMobTimer++;
        
        if (wave === 0 && soloWaveTimer > 60) startWave();
        
        if (currentBoss && currentBoss.hp > 0 && soloMobTimer >= 60) {
            soloMobTimer = 0;
            spawnMobs();
        }
        
        updateEnemies();
        enemies = enemies.filter(e => e.hp > 0);
        
        if (currentBoss && currentBoss.hp > 0) {
            ui.bossHp.style.width = (currentBoss.hp / currentBoss.maxHp * 100) + '%';
        }
        
        bullets.forEach(b => { if (!b.dead) b.update(); });
        bullets = bullets.filter(b => !b.dead);
        
        updateEnemyBullets();
        updateItems();
        
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);
        texts.forEach(t => t.update());
        texts = texts.filter(t => t.life > 0);
        
        updateCombo();
        updateScreenShake();
        
        draw();
        
        requestAnimationFrame(update);
    } catch (e) {
        console.error(e);
        requestAnimationFrame(update);
    }
}

// ========== 開始 ==========
init();
</script>
</body>
</html>
