<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLAZMERS - ONLINE MULTIPLAYER</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000810; /* ここで背景を黒くしています */
            overflow: hidden; 
            font-family: 'Courier New', monospace;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            cursor: crosshair;
        }
        #canvas { display: block; background: #000810; }
        
        .ui { position: fixed; color: #0ff; font-size: 14px; text-shadow: 0 0 10px #0ff; z-index: 100; }
        
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #001020 0%, #000810 100%);
            z-index: 200;
        }
        #start-screen h1 {
            font-size: 60px; color: #0ff; text-shadow: 0 0 30px #0ff, 0 0 60px #08f;
            letter-spacing: 15px; margin-bottom: 10px;
        }
        #start-screen .subtitle {
            font-size: 16px; color: #f08; margin-bottom: 20px;
            text-shadow: 0 0 10px #f08; letter-spacing: 5px;
        }
        #start-screen .online-badge {
            font-size: 14px; color: #0f0; margin-bottom: 30px;
            text-shadow: 0 0 10px #0f0; letter-spacing: 3px;
            padding: 5px 15px; border: 1px solid #0f0; border-radius: 20px;
        }
        .menu-btn {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 15px 50px; margin: 10px; font-size: 18px; cursor: pointer;
            font-family: 'Courier New', monospace; letter-spacing: 3px;
            transition: all 0.3s; text-shadow: 0 0 10px #0ff;
        }
        .menu-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; }
        .name-input, .room-input {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 10px 20px; font-size: 16px; text-align: center;
            font-family: 'Courier New', monospace; margin-bottom: 10px; width: 200px;
        }
        .name-input::placeholder, .room-input::placeholder { color: #088; }
        .room-input { margin-bottom: 20px; }
        .back-btn { border-color: #888; color: #888; text-shadow: 0 0 10px #888; padding: 10px 30px; font-size: 14px; }
        .back-btn:hover { background: #888; color: #000; }
        .start-btn { border-color: #0f0; color: #0f0; text-shadow: 0 0 10px #0f0; }
        .start-btn:hover { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; }
        .ready-btn { border-color: #0f0; color: #0f0; text-shadow: 0 0 10px #0f0; }
        .ready-btn:hover { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; }
        .ready-btn.ready-sent { border-color: #888; color: #888; pointer-events: none; }
        .room-code-display {
            font-size: 32px; color: #ff0; margin: 20px 0;
            text-shadow: 0 0 20px #ff0; letter-spacing: 8px;
            padding: 15px 30px; border: 3px solid #ff0; border-radius: 10px;
            background: rgba(255,255,0,0.1);
        }
        .room-code-display span { font-weight: bold; }
        .waiting-text { color: #0ff; font-size: 14px; margin: 10px 0; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        #lobby-players, #guest-lobby-players {
            background: rgba(0,0,0,0.5); border: 1px solid #0ff; padding: 15px;
            margin: 15px 0; min-width: 250px; border-radius: 5px;
        }
        .lobby-player {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; margin: 5px 0; border-radius: 3px;
            background: rgba(0,255,255,0.1);
        }
        .lobby-player .player-color {
            width: 12px; height: 12px; border-radius: 50%; margin-right: 10px;
            box-shadow: 0 0 10px currentColor;
        }
        .lobby-player .player-name { flex: 1; text-align: left; }
        .lobby-player .player-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .lobby-player .player-status.host { color: #ff0; border: 1px solid #ff0; }
        .lobby-player .player-status.ready { color: #0f0; border: 1px solid #0f0; }
        .lobby-player .player-status.waiting { color: #888; border: 1px solid #888; }
        
        #connection-status {
            font-size: 12px; color: #888; margin-top: 20px;
        }
        #connection-status.connected { color: #0f0; }
        #connection-status.error { color: #f00; }
        
        #hud { position: fixed; top: 10px; left: 10px; }
        .hud-label { font-size: 10px; color: #088; margin-bottom: 2px; }
        .hud-value { font-size: 20px; color: #0ff; margin-bottom: 10px; }
        #hp-bar { width: 150px; height: 8px; background: #001; border: 1px solid #0ff; margin-bottom: 10px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0, #0f0); transition: width 0.2s; }
        
        #players-list {
            position: fixed; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #0ff;
            font-size: 12px; max-width: 200px;
        }
        #players-list h3 { color: #0ff; margin-bottom: 5px; font-size: 12px; }
        .player-entry { margin: 3px 0; display: flex; align-items: center; }
        .player-entry.me { font-weight: bold; }
        .player-entry.dead { opacity: 0.5; text-decoration: line-through; }
        
        #boss-container {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            width: 500px; max-width: 90%; display: none; text-align: center;
        }
        #boss-name { font-size: 14px; color: #f00; margin-bottom: 5px; text-shadow: 0 0 10px #f00; font-weight: bold; }
        #boss-bar { width: 100%; height: 12px; background: #200; border: 1px solid #f00; }
        #boss-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.3s; }
        
        #weapons {
            position: fixed; bottom: 10px; left: 10px;
            display: flex; gap: 8px; flex-wrap: wrap; max-width: 350px;
        }
        .weapon-slot {
            padding: 5px 8px; border: 1px solid #444; background: #001;
            font-size: 9px; color: #888; transition: all 0.3s;
        }
        .weapon-slot.active { border-color: #0ff; color: #0ff; box-shadow: 0 0 10px #0ff; }
        .weapon-slot.locked { opacity: 0.3; }
        
        #formation-display {
            position: fixed; bottom: 80px; left: 10px;
            font-size: 12px; color: #0f0; text-shadow: 0 0 10px #0f0;
        }
        
        #joystick-zone {
            position: fixed; bottom: 20px; left: 20px;
            width: 130px; height: 130px; display: none;
        }
        #joystick-base {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(0,255,255,0.1); border: 2px solid rgba(0,255,255,0.3);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.4); border: 2px solid #0ff;
        }
        #mobile-buttons {
            position: fixed; bottom: 20px; right: 20px;
            display: none; gap: 10px;
        }
        .mobile-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.2); border: 2px solid #0ff;
            color: #0ff; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .mobile-btn:active { background: rgba(0,255,255,0.5); }
        
        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 300;
        }
        #game-over h2 { font-size: 48px; color: #f00; margin-bottom: 20px; text-shadow: 0 0 30px #f00; }
        #final-score { font-size: 24px; color: #0ff; margin-bottom: 10px; }
        #final-wave { font-size: 18px; color: #0ff; margin-bottom: 30px; }
        
        #message {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: #0ff; text-shadow: 0 0 20px #0ff;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 150; width: 100%; text-align: center;
        }
        
        @media (max-width: 768px) {
            #start-screen h1 { font-size: 36px; letter-spacing: 8px; }
            .menu-btn { padding: 12px 30px; font-size: 14px; }
            #joystick-zone, #mobile-buttons { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="start-screen">
        <h1>PLAZMERS</h1>
        <div class="subtitle">◆ INNER SPACE ◆</div>
        <div class="online-badge">🌐 ONLINE CO-OP</div>
        <input type="text" id="player-name" class="name-input" placeholder="YOUR NAME" maxlength="12">
        
        <div id="menu-buttons">
            <button class="menu-btn" onclick="hostGame()">HOST GAME</button>
            <button class="menu-btn" onclick="showJoinForm()">JOIN GAME</button>
        </div>
        
        <div id="join-form" style="display:none;">
            <input type="text" id="room-id" class="room-input" placeholder="4-DIGIT CODE" maxlength="4">
            <button class="menu-btn" onclick="joinGame()">JOIN</button>
            <button class="menu-btn back-btn" onclick="showMainMenu()">BACK</button>
        </div>
        
        <div id="host-info" style="display:none;">
            <div class="room-code-display">ROOM CODE: <span id="generated-code">----</span></div>
            <div class="waiting-text">Share this code with friends!</div>
            <div id="lobby-players"></div>
            <button class="menu-btn start-btn" onclick="startHostedGame()">START GAME</button>
            <button class="menu-btn back-btn" onclick="cancelHost()">CANCEL</button>
        </div>
        
        <div id="guest-waiting" style="display:none;">
            <div class="room-code-display">ROOM: <span id="joined-room-code">----</span></div>
            <div id="guest-lobby-players"></div>
            <button class="menu-btn ready-btn" id="ready-btn" onclick="sendReady()">READY</button>
            <div id="waiting-for-host" class="waiting-text" style="display:none;">Waiting for host to start...</div>
            <button class="menu-btn back-btn" onclick="leaveRoom()">LEAVE</button>
        </div>
        
        <div id="connection-status">Connecting to server...</div>
    </div>
    
    <div id="hud" class="ui" style="display:none;">
        <div class="hud-label">HP</div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <div class="hud-label">WAVE</div>
        <div class="hud-value" id="wave">0</div>
        <div class="hud-label">TEAM SCORE</div>
        <div class="hud-value" id="score">0</div>
    </div>
    
    <div id="players-list" class="ui" style="display:none;">
        <h3>PLAYERS</h3>
        <div id="player-entries"></div>
    </div>
    
    <div id="boss-container">
        <div id="boss-name">BOSS</div>
        <div id="boss-bar"><div id="boss-hp"></div></div>
    </div>
    
    <div id="weapons" style="display:none;">
        <div class="weapon-slot active" id="w-plazmer">PLAZMER</div>
        <div class="weapon-slot locked" id="w-homing">HOMING</div>
        <div class="weapon-slot locked" id="w-laser">LASER</div>
        <div class="weapon-slot locked" id="w-thunder">THUNDER</div>
        <div class="weapon-slot locked" id="w-allrange">ALL-RANGE</div>
    </div>
    
    <div id="formation-display" style="display:none;">FORMATION: FOLLOW</div>
    
    <div id="joystick-zone">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>
    <div id="mobile-buttons">
        <div class="mobile-btn" id="btn-dash">DASH</div>
        <div class="mobile-btn" id="btn-form">FORM</div>
    </div>
    
    <div id="game-over">
        <h2>GAME OVER</h2>
        <div id="final-score">SCORE: 0</div>
        <div id="final-wave">WAVE: 0</div>
        <button class="menu-btn" onclick="location.reload()">RETRY</button>
    </div>
    
    <div id="message"></div>

<script>
// ========== 修正版スクリプト（安全対策済み） ==========

// グローバル変数の宣言
let canvas, ctx;
const WORLD_W = 3000, WORLD_H = 3000;

let socket = null;
let myPlayerId = null;
let myPlayer = null;
let gameState = null;
let walls = [];
let localBullets = [];
let localMissiles = [];
let activeLaser = null;
let particles = [];
let texts = [];
let frame = 0;

// 入力
let input = { x: 0, y: 0, angle: 0, moving: false, dash: false, hasMoved: false };
let joystick = { active: false, dx: 0, dy: 0 };

// カメラ
let camera = { x: 0, y: 0 };
let screenShake = { x: 0, y: 0, intensity: 0 };

// フォーメーション
const FORMATIONS = ['FOLLOW', 'GO AROUND 1', 'GO AROUND 2', 'HUNT'];
let currentFormation = 0;

// UI要素（初期化時に取得）
let ui = {};

// ========== 初期化（画面読み込み完了後に実行） ==========
function init() {
    console.log("Initializing Game...");

    // 1. キャンバスの取得（ここなら確実に存在する）
    canvas = document.getElementById('canvas');
    if (!canvas) {
        console.error("Canvas element not found!");
        return;
    }
    ctx = canvas.getContext('2d');

    // 2. UI要素の取得
    ui = {
        startScreen: document.getElementById('start-screen'),
        gameOver: document.getElementById('game-over'),
        hud: document.getElementById('hud'),
        playersList: document.getElementById('players-list'),
        weapons: document.getElementById('weapons'),
        formationDisplay: document.getElementById('formation-display'),
        hp: document.getElementById('hp-fill'),
        wave: document.getElementById('wave'),
        score: document.getElementById('score'),
        bossContainer: document.getElementById('boss-container'),
        bossName: document.getElementById('boss-name'),
        bossHp: document.getElementById('boss-hp'),
        message: document.getElementById('message'),
        connectionStatus: document.getElementById('connection-status'),
        weaponSlots: {
            plazmer: document.getElementById('w-plazmer'),
            homing: document.getElementById('w-homing'),
            laser: document.getElementById('w-laser'),
            thunder: document.getElementById('w-thunder'),
            allrange: document.getElementById('w-allrange')
        }
    };

    // 3. イベントリスナーの設定
    resize();
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('mousemove', e => {
        input.x = e.clientX;
        input.y = e.clientY;
        input.hasMoved = true;
    });
    
    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0 && myPlayer && myPlayer.alive) {
            cycleFormation();
        }
    });
    
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') triggerDash();
        if (e.code === 'KeyF') cycleFormation();
    });
    
    // 4. その他の初期化
    initMobileControls();
    
    // socket.ioが存在するか確認してから接続
    if (typeof io !== 'undefined') {
        connectToServer();
    } else {
        console.error("Socket.io is not loaded! Check script tags.");
        alert("通信ライブラリの読み込みに失敗しました。ページをリロードしてください。");
    }

    requestAnimationFrame(gameLoop);
}

function resize() {
    if(canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
}

// ========== サーバー接続 ==========
function connectToServer() {
    socket = io();
    
    socket.on('connect', () => {
        console.log('Connected to server');
        if(ui.connectionStatus) {
            ui.connectionStatus.textContent = 'Connected!';
            ui.connectionStatus.className = 'connected';
        }
    });
    
    socket.on('hosted', (data) => {
        console.log("Game hosted:", data);
        myPlayerId = data.playerId;
        myPlayer = data.player;
        walls = data.walls || [];
        document.getElementById('menu-buttons').style.display = 'none';
        document.getElementById('host-info').style.display = 'block';
        document.getElementById('generated-code').textContent = data.roomId;
        updateLobbyPlayers(data.players, 'lobby-players');
    });
    
    socket.on('joinError', (data) => { alert(data.message); });
    
    socket.on('playerJoined', (data) => {
        if (document.getElementById('host-info').style.display === 'block') updateLobbyPlayers(data.players, 'lobby-players');
        if (document.getElementById('guest-waiting').style.display === 'block') updateLobbyPlayers(data.players, 'guest-lobby-players');
    });
    
    socket.on('playerReadyUpdate', (data) => {
        if (document.getElementById('host-info').style.display === 'block') updateLobbyPlayers(data.players, 'lobby-players');
        if (document.getElementById('guest-waiting').style.display === 'block') updateLobbyPlayers(data.players, 'guest-lobby-players');
    });
    
    socket.on('gameStarted', (data) => {
        ui.startScreen.style.display = 'none';
        ui.hud.style.display = 'block';
        ui.playersList.style.display = 'block';
        ui.weapons.style.display = 'flex';
        ui.formationDisplay.style.display = 'block';
        if (data.players) {
            const me = data.players.find(p => p.id === myPlayerId);
            if (me) myPlayer = me;
        }
        updateWeaponUI();
        showMessage('◆ GAME START ◆');
    });
    
    socket.on('gameStart', () => { showMessage('◆ GET READY ◆'); });
    
    socket.on('joined', (data) => {
        myPlayerId = data.playerId;
        myPlayer = data.player;
        walls = data.walls || [];
        if (data.isGuest && data.state === 'waiting') {
            document.getElementById('menu-buttons').style.display = 'none';
            document.getElementById('join-form').style.display = 'none';
            document.getElementById('guest-waiting').style.display = 'block';
            document.getElementById('joined-room-code').textContent = data.roomId;
            updateLobbyPlayers(data.players, 'guest-lobby-players');
            return;
        }
        ui.startScreen.style.display = 'none';
        ui.hud.style.display = 'block';
        ui.playersList.style.display = 'block';
        ui.weapons.style.display = 'flex';
        ui.formationDisplay.style.display = 'block';
        updateWeaponUI();
        if (data.state === 'playing') showMessage('JOIN THE BATTLE!');
    });
    
    socket.on('respawned', (data) => {
        if (myPlayer) {
            myPlayer.x = data.x; myPlayer.y = data.y; myPlayer.hp = data.hp; myPlayer.alive = true;
            ui.hp.style.width = '100%';
        }
        showMessage('RESPAWN!');
    });
    
    socket.on('playerRespawned', (data) => {
        if (data.playerId !== myPlayerId) showMessage(`${data.name} RESPAWNED`);
    });
    
    socket.on('hostCancelled', () => { alert('Host cancelled the game.'); location.reload(); });
    socket.on('playerLeft', () => { showMessage('A player left'); });
    
    socket.on('waveStart', (data) => { 
        console.log(`Wave Started: ${data.wave}`);
        walls = data.walls || []; 
        showMessage(`◆ WAVE ${data.wave} ◆`); 
    });

    socket.on('bossSpawn', (data) => { 
        showMessage(`◆ ${data.boss.name} APPEARED ◆`); 
        triggerScreenShake(10); 
        playSound('bossAppear'); 
    });

    socket.on('bossDefeated', () => { 
        showMessage('◆ PATHOGEN ELIMINATED ◆'); 
        triggerScreenShake(20); 
        playSound('bossDefeat'); 
    });

    socket.on('enemyDefeated', (data) => { playSound(data.isBoss ? 'bossDefeat' : 'enemyDefeat'); });
    
    socket.on('playerDamaged', (data) => {
        if (myPlayer) { myPlayer.hp = data.hp; ui.hp.style.width = Math.max(0, (myPlayer.hp / myPlayer.maxHp) * 100) + '%'; }
        triggerScreenShake(5); 
        playSound('hit');
    });
    
    socket.on('playerDied', (data) => {
        if (data.playerId === myPlayerId) showMessage('YOU DIED'); else showMessage(`${data.name} DIED`);
    });
    
    socket.on('itemCollected', (data) => {
        if (myPlayer) {
            myPlayer.weaponLevels = data.weaponLevels;
            myPlayer.hp = data.hp;
            myPlayer.options = new Array(data.options).fill({});
            ui.hp.style.width = (myPlayer.hp / myPlayer.maxHp) * 100 + '%';
            updateWeaponUI();
        }
        playSound('powerup');
    });
    
    socket.on('gameState', (state) => {
        gameState = state;
        const me = state.players.find(p => p.id === myPlayerId);
        if (me && !isNaN(me.x) && !isNaN(me.y)) {
            myPlayer = me;
        }

        ui.wave.textContent = state.wave;
        ui.score.textContent = state.score;
        const bosses = state.enemies.filter(e => e.isBoss);
        if (bosses.length > 0) {
            ui.bossContainer.style.display = 'block';
            let totalHp = 0, totalMaxHp = 0;
            bosses.forEach(b => { totalHp += b.hp; totalMaxHp += b.maxHp; });
            ui.bossHp.style.width = (totalHp / totalMaxHp * 100) + '%';
            ui.bossName.textContent = `BOSS DANGER x${bosses.length}`;
        } else { ui.bossContainer.style.display = 'none'; }
        updatePlayersList(state.players);
    });
    
    socket.on('gameOver', (data) => {
        ui.gameOver.style.display = 'flex';
        document.getElementById('final-score').textContent = `SCORE: ${data.score}`;
        document.getElementById('final-wave').textContent = `WAVE: ${data.wave}`;
        playSound('gameOver');
    });

    socket.on('remoteFire', (data) => {
        if(data.playerId !== myPlayerId) spawnRemoteBullets(data);
    });
}

function spawnRemoteBullets(data) {
    if (!gameState) return;
    const shooter = gameState.players.find(p => p.id === data.playerId);
    if (!shooter) return;

    if (data.type === 'PLAZMER') {
        const lv = shooter.weaponLevels ? shooter.weaponLevels.PLAZMER : 1;
        const count = 1 + Math.floor(lv / 1.5);
        const maxSpread = Math.min(Math.PI * 2, lv * (Math.PI / 10));
        for (let i = 0; i < count; i++) {
            let angleOffset = 0;
            if (count > 1) {
                const range = maxSpread * (i / (count - 1)) - (maxSpread / 2);
                if (maxSpread >= Math.PI * 2 - 0.1) angleOffset = (Math.PI * 2 / count) * i;
                else angleOffset = range;
            }
            localBullets.push(new PlazmerBullet({
                x: shooter.x, y: shooter.y,
                angle: data.angle + angleOffset,
                color: '#0ff'
            }, null));
        }
    } else if (data.type === 'HOMING') {
        const lv = shooter.weaponLevels ? shooter.weaponLevels.HOMING : 1;
        const missileCount = 4 + lv * 2;
        for (let i = 0; i < missileCount; i++) {
            const spreadAngle = data.angle + (Math.random() - 0.5) * Math.PI;
            const speed = 5 + Math.random() * 8;
            localMissiles.push(new MacrossMissile({
                x: shooter.x, y: shooter.y,
                vx: Math.cos(spreadAngle) * speed, vy: Math.sin(spreadAngle) * speed,
                color: '#0af'
            }));
        }
    } else if (data.type === 'THUNDER') {
        let target = null;
        if(gameState.enemies.length > 0) target = gameState.enemies[0];
        localBullets.push(new ThunderBolt({
            x: shooter.x, y: shooter.y, target: target, angle: data.angle, damage: 0
        }, null));
    }
}

// ========== 入力処理 ==========
let lastInputTime = 0;
const INPUT_RATE = 1000 / 30;

function updateInput() {
    if (!myPlayer || !myPlayer.alive) return;
    let moving = false;
    let angle = myPlayer.angle;
    
    if (joystick.active && (Math.abs(joystick.dx) > 0.1 || Math.abs(joystick.dy) > 0.1)) {
        angle = Math.atan2(joystick.dy, joystick.dx); 
        moving = true;
    } else if (input.hasMoved) {
        const mx = input.x + camera.x; 
        const my = input.y + camera.y;
        angle = Math.atan2(my - myPlayer.y, mx - myPlayer.x);
        if (Math.hypot(mx - myPlayer.x, my - myPlayer.y) > 20) moving = true;
    }
    
    if (moving && !myPlayer.dashing) {
        const speed = myPlayer.speed || 6;
        const vx = Math.cos(angle) * speed; 
        const vy = Math.sin(angle) * speed;
        if (!isNaN(vx) && !isNaN(vy)) {
            if (!checkWall(myPlayer.x + vx, myPlayer.y, walls)) myPlayer.x += vx;
            if (!checkWall(myPlayer.x, myPlayer.y + vy, walls)) myPlayer.y += vy;
            myPlayer.x = Math.max(60, Math.min(WORLD_W - 60, myPlayer.x));
            myPlayer.y = Math.max(60, Math.min(WORLD_H - 60, myPlayer.y));
        }
    }
    myPlayer.angle = angle;
    
    const now = Date.now();
    if (now - lastInputTime >= INPUT_RATE) {
        socket.emit('input', { angle: angle, moving: moving, dash: input.dash, x: myPlayer.x, y: myPlayer.y });
        lastInputTime = now;
    }
    input.dash = false;
}

function triggerDash() { input.dash = true; playSound('dash'); }
function cycleFormation() {
    currentFormation = (currentFormation + 1) % FORMATIONS.length;
    socket.emit('formation', { formation: currentFormation });
    ui.formationDisplay.textContent = `FORMATION: ${FORMATIONS[currentFormation]}`;
    showMessage(FORMATIONS[currentFormation]);
    playSound('switch');
}

// ========== 武器処理 ==========
let weaponTimer = 0;
function fireWeapons() {
    if (!myPlayer || !myPlayer.alive || !gameState) return;
    const hits = []; 
    socket.emit('fire', { type: 'PLAZMER', angle: myPlayer.angle, options: myPlayer.options ? myPlayer.options.length : 0 });
    
    if (myPlayer.weaponLevels) {
        firePlazmer(hits);
        if (myPlayer.weaponLevels.HOMING > 0) { fireHoming(); socket.emit('fire', { type: 'HOMING', angle: myPlayer.angle }); }
        if (myPlayer.weaponLevels.LASER > 0 && !activeLaser) fireLaser();
        if (myPlayer.weaponLevels.THUNDER > 0 && myPlayer.thunderEnergy >= 180) {
            fireThunder(hits); myPlayer.thunderEnergy = 0; socket.emit('fire', { type: 'THUNDER', angle: myPlayer.angle });
        }
    } else {
        myPlayer.weaponLevels = { PLAZMER: 1, HOMING: 0, LASER: 0, THUNDER: 0, ALLRANGE: 0 };
        firePlazmer(hits);
    }
    playSound('shoot');
}

function firePlazmer(hits) {
    const lv = myPlayer.weaponLevels.PLAZMER || 1;
    const count = 1 + Math.floor(lv / 1.5);
    const maxSpread = Math.min(Math.PI * 2, lv * (Math.PI / 10));
    const damage = 3 + Math.max(0, lv - 10);
    for (let i = 0; i < count; i++) {
        let angleOffset = 0;
        if (count > 1) {
            const range = maxSpread * (i / (count - 1)) - (maxSpread / 2);
            if (maxSpread >= Math.PI * 2 - 0.1) angleOffset = (Math.PI * 2 / count) * i;
            else angleOffset = range;
        }
        localBullets.push(new PlazmerBullet({ x: myPlayer.x, y: myPlayer.y, angle: myPlayer.angle + angleOffset, damage: damage, color: '#fff' }, hits));
    }
}

function fireHoming() {
    const lv = myPlayer.weaponLevels.HOMING;
    const missileCount = 4 + lv * 2;
    const damage = 4 + Math.floor(lv / 3);
    for (let i = 0; i < missileCount; i++) {
        const spreadAngle = myPlayer.angle + (Math.random() - 0.5) * Math.PI;
        const speed = 5 + Math.random() * 8;
        localMissiles.push(new MacrossMissile({ x: myPlayer.x, y: myPlayer.y, vx: Math.cos(spreadAngle) * speed, vy: Math.sin(spreadAngle) * speed, damage: damage, color: '#a0f' }));
    }
    playSound('missile');
}

function fireLaser() {
    const lv = myPlayer.weaponLevels.LASER;
    const width = Math.min(60, 3 + lv * 3);
    const damage = 3 + Math.max(0, lv - 8) * 2;
    activeLaser = new KamehamehaLaser({ owner: myPlayer, width: width, damage: damage, duration: 60, maxBounces: 5 + Math.floor(lv / 2) });
    playSound('laser');
}

function fireThunder(hits) {
    const lv = myPlayer.weaponLevels.THUNDER;
    let target = null, minDist = 1000;
    if (gameState) {
        gameState.enemies.forEach(e => {
            if (e.hp > 0) {
                const d = Math.hypot(e.x - myPlayer.x, e.y - myPlayer.y);
                if (d < minDist) { minDist = d; target = e; }
            }
        });
    }
    localBullets.push(new ThunderBolt({ x: myPlayer.x, y: myPlayer.y, target: target, angle: myPlayer.angle, damage: 30 + lv * 10 }, hits));
    playSound('thunder'); triggerScreenShake(15);
}

class PlazmerBullet {
    constructor(data, hits) {
        this.x = data.x; this.y = data.y; this.angle = data.angle;
        this.speed = 14; this.vx = Math.cos(this.angle) * this.speed; this.vy = Math.sin(this.angle) * this.speed;
        this.damage = data.damage || 3; this.color = data.color || '#fff';
        this.size = 4; this.life = 60; this.type = 'PLAZMER';
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.life--;
        if (this.life <= 0 || checkWall(this.x, this.y, walls)) this.dead = true;
        this.checkHit();
    }
    checkHit() {
        if (!gameState) return;
        for (const e of gameState.enemies) {
            if (e.hp > 0 && Math.hypot(e.x - this.x, e.y - this.y) < e.size + this.size) {
                socket.emit('hit', { enemyId: e.id, damage: this.damage, weaponType: this.type });
                this.dead = true; createParticle(this.x, this.y, this.color); break;
            }
        }
    }
    draw() {
        if(!ctx) return;
        const sx = this.x - camera.x; const sy = this.y - camera.y;
        ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        ctx.beginPath(); ctx.arc(sx, sy, this.size, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
}

class MacrossMissile {
    constructor(data) {
        this.x = data.x; this.y = data.y; this.vx = data.vx; this.vy = data.vy;
        this.damage = data.damage || 4; this.color = data.color || '#a0f';
        this.life = 200; this.type = 'HOMING'; this.dead = false; this.phase = 0; this.timer = 0; this.waitTime = 10 + Math.random() * 15; this.trail = [];
    }
    update() {
        this.life--; this.timer++; if (this.life <= 0) this.dead = true;
        if (this.phase === 0) {
            this.x += this.vx; this.y += this.vy; this.vx *= 0.92; this.vy *= 0.92;
            if (this.timer > this.waitTime) this.phase = 1;
        } else {
            let target = null, minDist = 1000;
            if (gameState) {
                gameState.enemies.forEach(e => {
                    if (e.hp > 0) {
                        const d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d < minDist) { minDist = d; target = e; }
                    }
                });
            }
            const maxSpeed = 18; const turnSpeed = 0.8;
            if (target) {
                const desiredAngle = Math.atan2(target.y - this.y, target.x - this.x);
                const currentAngle = Math.atan2(this.vy, this.vx);
                let delta = desiredAngle - currentAngle;
                while (delta < -Math.PI) delta += Math.PI * 2; while (delta > Math.PI) delta -= Math.PI * 2;
                const newAngle = currentAngle + Math.max(-turnSpeed, Math.min(turnSpeed, delta));
                const currentSpeed = Math.hypot(this.vx, this.vy);
                const nextSpeed = Math.min(maxSpeed, currentSpeed + 1.5);
                this.vx = Math.cos(newAngle) * nextSpeed; this.vy = Math.sin(newAngle) * nextSpeed;
            }
            this.x += this.vx; this.y += this.vy;
        }
        if (checkWall(this.x, this.y, walls)) { this.dead = true; createParticles(this.x, this.y, '#f80', 5); }
        if (gameState) {
            for (const e of gameState.enemies) {
                if (e.hp > 0 && Math.hypot(e.x - this.x, e.y - this.y) < e.size + 10) {
                    socket.emit('hit', { enemyId: e.id, damage: this.damage, weaponType: this.type });
                    this.dead = true; createParticles(this.x, this.y, '#a0f', 8); break;
                }
            }
        }
        this.trail.unshift({ x: this.x, y: this.y }); if (this.trail.length > 10) this.trail.pop();
    }
    draw() {
        if(!ctx) return;
        if (this.trail.length > 1) {
            ctx.beginPath(); ctx.strokeStyle = `rgba(100, 50, 255, 0.5)`; ctx.lineWidth = 2;
            for (let i = 0; i < this.trail.length; i++) {
                const p = this.trail[i];
                if (i === 0) ctx.moveTo(p.x - camera.x, p.y - camera.y); else ctx.lineTo(p.x - camera.x, p.y - camera.y);
            }
            ctx.stroke();
        }
        ctx.fillStyle = '#fff'; ctx.shadowBlur = 5; ctx.shadowColor = this.color;
        ctx.beginPath(); ctx.arc(this.x - camera.x, this.y - camera.y, 2, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
}

class KamehamehaLaser {
    constructor(data) {
        this.owner = data.owner; this.width = data.width || 20; this.damage = data.damage || 3;
        this.duration = data.duration || 60; this.maxBounces = data.maxBounces || 5;
        this.life = this.duration; this.damageTimer = 0; this.type = 'LASER';
        this.segments = []; this.hitEnemies = new Set(); this.updatePath();
    }
    updatePath() {
        this.segments = [];
        let x = this.owner.x, y = this.owner.y, angle = this.owner.angle;
        let bounces = this.maxBounces, totalLength = 0;
        const maxLength = 2500, step = 20;
        this.segments.push({ x, y });
        while (totalLength < maxLength && bounces >= 0) {
            const nextX = x + Math.cos(angle) * step; const nextY = y + Math.sin(angle) * step;
            const normal = getWallNormal(nextX, nextY);
            if (normal && bounces > 0) {
                this.segments.push({ x, y, bounce: true });
                const dot = Math.cos(angle) * normal.x + Math.sin(angle) * normal.y;
                angle = Math.atan2(Math.sin(angle) - 2 * dot * normal.y, Math.cos(angle) - 2 * dot * normal.x);
                bounces--; createParticle(x, y, '#0ff');
            } else if (normal && bounces <= 0) { this.segments.push({ x, y }); break; }
            x = nextX; y = nextY; totalLength += step;
            if (totalLength % 100 < step) this.segments.push({ x, y });
        }
        this.segments.push({ x, y });
    }
    update() {
        this.life--; if (this.life <= 0) this.dead = true;
        this.updatePath(); this.damageTimer++;
        if (this.damageTimer >= 10 && gameState) {
            this.damageTimer = 0; const hits = [];
            for (let i = 0; i < this.segments.length - 1; i++) {
                const s1 = this.segments[i], s2 = this.segments[i + 1];
                gameState.enemies.forEach(e => {
                    if (e.hp > 0 && !this.hitEnemies.has(e.id)) {
                        if (distToSegment(e.x, e.y, s1.x, s1.y, s2.x, s2.y) < e.size + this.width / 2) {
                            hits.push({ enemyId: e.id, damage: this.damage, weaponType: this.type });
                            this.hitEnemies.add(e.id);
                        }
                    }
                });
            }
            if (hits.length > 0) socket.emit('shoot', { hits });
            if (this.life % 20 === 0) this.hitEnemies.clear();
        }
    }
    draw() {
        if(!ctx || this.segments.length < 2) return;
        const alpha = this.life / this.duration; const pulse = Math.sin(frame * 0.3) * 0.2 + 1; const currentWidth = this.width * pulse * alpha;
        ctx.strokeStyle = `rgba(0,255,255,${alpha * 0.3})`; ctx.lineWidth = currentWidth + 30; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        this.segments.forEach((s, i) => { if (i === 0) ctx.moveTo(s.x - camera.x, s.y - camera.y); else ctx.lineTo(s.x - camera.x, s.y - camera.y); });
        ctx.stroke();
        ctx.strokeStyle = `rgba(0,255,255,${alpha * 0.8})`; ctx.lineWidth = currentWidth; ctx.shadowBlur = 30; ctx.shadowColor = '#0ff'; ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = currentWidth * 0.4; ctx.stroke(); ctx.shadowBlur = 0;
    }
}

class ThunderBolt {
    constructor(data, hits) {
        this.x = data.x; this.y = data.y; this.target = data.target; this.angle = data.angle;
        this.damage = data.damage || 30; this.color = '#ff0'; this.life = 30; this.type = 'THUNDER';
        this.points = [{ x: this.x, y: this.y }];
        this.targetX = this.target ? this.target.x : this.x + Math.cos(this.angle) * 600;
        this.targetY = this.target ? this.target.y : this.y + Math.sin(this.angle) * 600;
        this.hitEnemies = new Set(); this.progress = 0; this.hits = hits;
        this.generatePath();
    }
    generatePath() {
        const segments = 15; const perpAngle = Math.atan2(this.targetY - this.y, this.targetX - this.x) + Math.PI / 2;
        for (let i = 1; i <= segments; i++) {
            const progress = i / segments; const baseX = this.x + (this.targetX - this.x) * progress; const baseY = this.y + (this.targetY - this.y) * progress;
            const zigzag = (i % 2 === 0 ? 1 : -1) * (40 + Math.random() * 30);
            this.points.push({ x: baseX + Math.cos(perpAngle) * zigzag, y: baseY + Math.sin(perpAngle) * zigzag });
        }
    }
    update() {
        this.life--; if (this.life <= 0) this.dead = true;
        this.points.forEach((p, i) => { if (i > 0 && i < this.points.length - 1) { p.x += (Math.random() - 0.5) * 15; p.y += (Math.random() - 0.5) * 15; } });
        this.progress = Math.min(1, this.progress + 0.2);
        if (gameState) {
            const currentSegment = Math.floor(this.progress * (this.points.length - 1));
            for (let i = 0; i <= currentSegment && i < this.points.length - 1; i++) {
                const p1 = this.points[i], p2 = this.points[i + 1];
                gameState.enemies.forEach(e => {
                    if (e.hp > 0 && !this.hitEnemies.has(e.id)) {
                        if (distToSegment(e.x, e.y, p1.x, p1.y, p2.x, p2.y) < e.size + 25) {
                            if (this.hits) { this.hits.push({ enemyId: e.id, damage: this.damage, weaponType: this.type }); }
                            this.hitEnemies.add(e.id); createParticles(e.x, e.y, '#ff0', 15);
                        }
                    }
                });
            }
        }
    }
    draw() {
        if(!ctx) return;
        const alpha = this.life / 30; const currentSegment = Math.floor(this.progress * (this.points.length - 1));
        ctx.strokeStyle = `rgba(255,255,0,${alpha * 0.4})`; ctx.lineWidth = 25; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let i = 0; i <= currentSegment && i < this.points.length; i++) {
            const p = this.points[i];
            if (i === 0) ctx.moveTo(p.x - camera.x, p.y - camera.y); else ctx.lineTo(p.x - camera.x, p.y - camera.y);
        }
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,0,${alpha})`; ctx.lineWidth = 8; ctx.shadowBlur = 35; ctx.shadowColor = '#ff0'; ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = 3; ctx.stroke(); ctx.shadowBlur = 0;
    }
}

// ========== ゲームループ ==========
function gameLoop() {
    frame++;
    if (myPlayer && myPlayer.alive) updateInput();
    updateCamera();
    
    // 武器は自動発射 (押しっぱなし不要)
    weaponTimer++;
    if (weaponTimer >= 15 && myPlayer && myPlayer.alive) { 
        fireWeapons(); 
        weaponTimer = 0; 
    }
    
    localBullets.forEach(b => { if (!b.dead) b.update(); });
    localBullets = localBullets.filter(b => !b.dead);
    localMissiles.forEach(m => { if (!m.dead) m.update(); });
    localMissiles = localMissiles.filter(m => !m.dead);
    if (activeLaser) { activeLaser.update(); if (activeLaser.dead) activeLaser = null; }
    particles.forEach(p => p.update());
    particles = particles.filter(p => p.life > 0);
    texts.forEach(t => t.update());
    texts = texts.filter(t => t.life > 0);
    updateScreenShake();
    draw();
    requestAnimationFrame(gameLoop);
}

function updateCamera() {
    if (myPlayer) {
        camera.x += (myPlayer.x - canvas.width / 2 - camera.x) * 0.1;
        camera.y += (myPlayer.y - canvas.height / 2 - camera.y) * 0.1;
    }
}

function updateScreenShake() {
    if (screenShake.intensity > 20) screenShake.intensity = 20;
    if (screenShake.intensity > 0) {
        screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.intensity *= 0.9;
        if (screenShake.intensity < 0.5) screenShake.intensity = 0;
    } else {
        screenShake.x = 0; screenShake.y = 0;
    }
}

function triggerScreenShake(amount) { screenShake.intensity = amount; }

function draw() {
    if(!ctx) return;
    ctx.fillStyle = '#000810';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.translate(-camera.x + screenShake.x, -camera.y + screenShake.y);

    ctx.strokeStyle = '#004455'; ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
    if (walls) {
        ctx.fillStyle = '#001122';
        walls.forEach(w => {
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeRect(w.x, w.y, w.w, w.h);
        });
    }

    if (gameState && gameState.players) {
        gameState.players.forEach(p => {
            if (!p.alive) return;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color || '#0ff';
            ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-10, -10); ctx.lineTo(-10, 10); ctx.fill();
            ctx.restore();
            ctx.fillStyle = '#fff'; ctx.font = '12px Courier New'; ctx.textAlign = 'center'; ctx.fillText(p.name, p.x, p.y - 25);
        });
    }

    if (gameState && gameState.enemies) {
        gameState.enemies.forEach(e => {
            if (e.hp <= 0) return;
            ctx.fillStyle = e.isBoss ? '#f00' : '#f0f';
            ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2); ctx.fill();
        });
    }

    localBullets.forEach(b => b.draw());
    localMissiles.forEach(m => m.draw());
    if (activeLaser) activeLaser.draw();
    ctx.restore();
}

function checkWall(x, y, walls) {
    if (x < 0 || x > WORLD_W || y < 0 || y > WORLD_H) return true;
    if (walls) {
        for (let w of walls) {
            if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return true;
        }
    }
    return false;
}

function createParticle(x, y, color) {}
function createParticles(x, y, color, count) {}
function getWallNormal(x, y) { return null; }
function distToSegment(x, y, x1, y1, x2, y2) {
    const A = x - x1; const B = y - y1; const C = x2 - x1; const D = y2 - y1;
    const dot = A * C + B * D; const len_sq = C * C + D * D;
    let param = -1; if (len_sq !== 0) param = dot / len_sq;
    let xx, yy;
    if (param < 0) { xx = x1; yy = y1; } else if (param > 1) { xx = x2; yy = y2; } else { xx = x1 + param * C; yy = y1 + param * D; }
    const dx = x - xx; const dy = y - yy; return Math.sqrt(dx * dx + dy * dy);
}
function playSound(name) {}
function showMessage(msg) {
    const el = document.getElementById('message');
    if(el) { el.textContent = msg; el.style.opacity = 1; setTimeout(() => { el.style.opacity = 0; }, 2000); }
}
function updateWeaponUI() {
    if (!myPlayer) return;
    for (let key in ui.weaponSlots) {
        let level = myPlayer.weaponLevels ? myPlayer.weaponLevels[key.toUpperCase()] : 0;
        let el = ui.weaponSlots[key];
        if (el) {
            if (level > 0) {
                el.classList.remove('locked');
                el.textContent = key.toUpperCase() + " Lv." + level;
            }
        }
    }
}

// ========== 安全な開始（ここが重要） ==========
// ページ全体（画像やスクリプト含む）が読み終わってから init を実行
window.addEventListener('load', init);
