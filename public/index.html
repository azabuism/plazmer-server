<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PLAZMERS Ver.1.00</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;display:flex;justify-content:center;align-items:center;min-height:100vh}
#game-container{position:relative;width:400px;height:600px;max-width:100vw;max-height:100vh}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#menu{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#100020 0%,#000510 50%,#100010 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#menu h1{font-size:36px;color:#0ff;text-shadow:0 0 30px #0ff,0 0 60px #08f;margin-bottom:5px;letter-spacing:6px}
.subtitle{font-size:12px;color:#f0f;margin-bottom:20px;letter-spacing:3px}
.menu-section{margin:15px 0;text-align:center}
.menu-section h3{color:#888;font-size:11px;margin-bottom:8px;letter-spacing:2px}
.menu-btn{padding:12px 30px;font-size:14px;background:transparent;border:2px solid #0af;color:#0af;cursor:pointer;margin:5px;transition:all 0.3s;border-radius:6px}
.menu-btn:hover,.menu-btn.selected{background:#0af;color:#000}
.menu-btn.fighter{border-color:#0f0;color:#0f0}.menu-btn.fighter:hover,.menu-btn.fighter.selected{background:#0f0;color:#000}
.menu-btn.invader{border-color:#f00;color:#f00}.menu-btn.invader:hover,.menu-btn.invader.selected{background:#f00;color:#000}
.level-btns{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.level-btn{padding:8px 12px;font-size:11px;background:transparent;border:2px solid #666;color:#666;cursor:pointer;border-radius:4px}
.level-btn:hover,.level-btn.selected{border-color:#ff0;color:#ff0;background:rgba(255,255,0,0.1)}
.start-btn{padding:15px 50px;font-size:18px;background:linear-gradient(180deg,#080,#040);border:2px solid #0f0;color:#0f0;cursor:pointer;margin-top:20px;border-radius:8px;text-shadow:0 0 10px #0f0}
.start-btn:hover{background:linear-gradient(180deg,#0a0,#060);box-shadow:0 0 30px #0f0}
#room-input{width:180px;padding:10px;font-size:16px;background:#111;border:2px solid #0af;color:#fff;text-align:center;margin:10px;border-radius:6px;text-transform:uppercase}
#room-code{color:#0ff;font-size:24px;letter-spacing:4px;margin:10px}
#status{color:#888;font-size:11px;margin-top:10px}
/* HUD */
#hud{position:absolute;top:5px;left:5px;color:#fff;font-size:11px;z-index:10;text-shadow:1px 1px 2px #000}
#boss-bar{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:200px;height:14px;background:#200;border:2px solid #f00;border-radius:3px;z-index:10}
#boss-hp{height:100%;background:linear-gradient(90deg,#f00,#ff0);transition:width 0.2s}
#boss-name{position:absolute;width:100%;text-align:center;color:#fff;font-size:9px;line-height:14px}
#lives{position:absolute;top:5px;right:5px;color:#0f0;font-size:12px;z-index:10}
#resource-bar{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:200px;height:10px;background:#020;border:2px solid #0f0;border-radius:3px;z-index:10;display:none}
#resource-fill{height:100%;background:#0f0;transition:width 0.1s}
/* ユニットカード（インベーダー側） */
#unit-cards{position:absolute;bottom:5px;left:0;width:100%;display:none;justify-content:center;gap:5px;z-index:10;padding:0 5px;flex-wrap:wrap}
.unit-card{width:40px;height:55px;background:rgba(0,0,0,0.8);border:2px solid #666;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s}
.unit-card:hover{border-color:#fff;transform:scale(1.05)}
.unit-card.disabled{opacity:0.4;pointer-events:none}
.unit-card .icon{width:20px;height:20px;border-radius:50%;margin-bottom:2px}
.unit-card .cost{font-size:8px;color:#ff0}
.unit-card .name{font-size:7px;color:#fff}
/* モバイルコントロール（ファイター側） */
#touch-area{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;display:none}
#joystick{position:absolute;bottom:80px;left:30px;width:100px;height:100px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);border-radius:50%;display:none}
#joystick-knob{position:absolute;left:50%;top:50%;width:40px;height:40px;background:rgba(255,255,255,0.5);border-radius:50%;transform:translate(-50%,-50%)}
/* 結果画面 */
#result{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#result h1{font-size:36px;margin-bottom:20px;text-shadow:0 0 30px currentColor}
#result .score{font-size:18px;color:#ff0;margin-bottom:30px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game-container">
<canvas id="canvas" width="400" height="600"></canvas>
<div id="menu">
<h1>PLAZMERS</h1>
<div class="subtitle">◆ Ver.1.00 ◆</div>
<div class="menu-section" id="mode-select">
<h3>GAME MODE</h3>
<button class="menu-btn" data-mode="cpu">VS CPU</button>
<button class="menu-btn" data-mode="pvp">VS PLAYER</button>
</div>
<div class="menu-section hidden" id="role-select">
<h3>SELECT ROLE</h3>
<button class="menu-btn fighter" data-role="fighter">🚀 FIGHTER</button>
<button class="menu-btn invader" data-role="invader">👾 INVADER</button>
</div>
<div class="menu-section hidden" id="level-select">
<h3>CPU LEVEL</h3>
<div class="level-btns">
<button class="level-btn" data-level="1">EASY</button>
<button class="level-btn selected" data-level="2">NORMAL</button>
<button class="level-btn" data-level="3">HARD</button>
<button class="level-btn" data-level="4">EXPERT</button>
<button class="level-btn" data-level="5">HELL</button>
</div>
</div>
<div class="menu-section hidden" id="time-select">
<h3>TIME LIMIT</h3>
<div class="level-btns">
<button class="level-btn" data-time="0">NONE</button>
<button class="level-btn selected" data-time="120">2 MIN</button>
<button class="level-btn" data-time="180">3 MIN</button>
<button class="level-btn" data-time="300">5 MIN</button>
</div>
</div>
<div class="menu-section hidden" id="pvp-host">
<h3>ROOM CODE</h3>
<div id="room-code">----</div>
<div id="status">対戦相手を待っています...</div>
</div>
<div class="menu-section hidden" id="pvp-join">
<input type="text" id="room-input" placeholder="ROOM CODE" maxlength="4">
<button class="menu-btn" id="join-btn">JOIN</button>
</div>
<button class="start-btn hidden" id="start-btn">START</button>
</div>
<!-- HUD -->
<div id="hud" class="hidden">
<div>SCORE: <span id="score">0</span></div>
<div>TIME: <span id="time">0:00</span></div>
</div>
<div id="boss-bar" class="hidden"><div id="boss-hp"></div><div id="boss-name">BOSS UFO</div></div>
<div id="lives" class="hidden">♥♥♥</div>
<div id="resource-bar" class="hidden"><div id="resource-fill"></div></div>
<!-- ユニットカード -->
<div id="unit-cards"></div>
<!-- モバイルコントロール -->
<div id="touch-area"></div>
<div id="joystick"><div id="joystick-knob"></div></div>
<!-- 結果 -->
<div id="result">
<h1 id="result-title">VICTORY!</h1>
<div class="score">SCORE: <span id="result-score">0</span></div>
<button class="menu-btn" onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ゲーム状態
let socket, gameState = null, myRole = null;
let gameMode = null, cpuLevel = 2, timeLimit = 120;
let stars = [];

// 入力
let input = { dx: 0, dy: 0 };
let keys = {};
let joystickActive = false, joystickId = null, joystickStartX = 0, joystickStartY = 0;

// ユニット定義
const UNITS = {
    normal:   { name: 'ノーマル', cost: 10, color: '#0f0' },
    tank:     { name: 'タンク', cost: 25, color: '#088' },
    fast:     { name: 'スピード', cost: 15, color: '#ff0' },
    shooter:  { name: 'シューター', cost: 30, color: '#f80' },
    shield:   { name: 'シールド', cost: 35, color: '#08f' },
    split:    { name: 'スプリット', cost: 30, color: '#f0f' },
    kamikaze: { name: 'カミカゼ', cost: 20, color: '#f00' },
    healer:   { name: 'ヒーラー', cost: 40, color: '#0ff' },
    bomb:     { name: 'ボム', cost: 25, color: '#f60' }
};

// 星背景初期化
for (let i = 0; i < 50; i++) {
    stars.push({ x: Math.random() * 400, y: Math.random() * 600, speed: 1 + Math.random() * 2, size: Math.random() * 2 });
}

// 初期化
function init() {
    socket = io();
    setupMenuEvents();
    setupGameEvents();
    setupControls();
    requestAnimationFrame(gameLoop);
}

// メニューイベント
function setupMenuEvents() {
    // モード選択
    document.querySelectorAll('#mode-select .menu-btn').forEach(btn => {
        btn.onclick = () => {
            gameMode = btn.dataset.mode;
            document.querySelectorAll('#mode-select .menu-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('role-select').classList.remove('hidden');
            document.getElementById('level-select').classList.toggle('hidden', gameMode !== 'cpu');
            document.getElementById('time-select').classList.remove('hidden');
            document.getElementById('start-btn').classList.toggle('hidden', gameMode === 'pvp');
            document.getElementById('pvp-host').classList.add('hidden');
            document.getElementById('pvp-join').classList.add('hidden');
        };
    });

    // 役割選択
    document.querySelectorAll('#role-select .menu-btn').forEach(btn => {
        btn.onclick = () => {
            myRole = btn.dataset.role;
            document.querySelectorAll('#role-select .menu-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            if (gameMode === 'pvp') {
                document.getElementById('pvp-host').classList.remove('hidden');
                document.getElementById('pvp-join').classList.remove('hidden');
                socket.emit('hostPvp', { role: myRole, timeLimit });
            }
        };
    });

    // CPUレベル選択
    document.querySelectorAll('#level-select .level-btn').forEach(btn => {
        btn.onclick = () => {
            cpuLevel = parseInt(btn.dataset.level);
            document.querySelectorAll('#level-select .level-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        };
    });

    // 時間制限選択
    document.querySelectorAll('#time-select .level-btn').forEach(btn => {
        btn.onclick = () => {
            timeLimit = parseInt(btn.dataset.time);
            document.querySelectorAll('#time-select .level-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        };
    });

    // スタートボタン
    document.getElementById('start-btn').onclick = () => {
        if (!myRole) return alert('役割を選んでください');
        socket.emit('startCpuGame', { role: myRole, cpuLevel, timeLimit });
    };

    // PvP参加
    document.getElementById('join-btn').onclick = () => {
        const code = document.getElementById('room-input').value.toUpperCase();
        if (code.length === 4) {
            socket.emit('joinPvp', { roomId: code });
        }
    };
}

// ゲームイベント
function setupGameEvents() {
    socket.on('hosted', (data) => {
        document.getElementById('room-code').textContent = data.roomId;
    });

    socket.on('joined', (data) => {
        myRole = data.role;
        document.getElementById('status').textContent = 'ゲーム開始待ち...';
    });

    socket.on('joinError', (data) => {
        alert(data.message);
    });

    socket.on('gameStart', (data) => {
        gameState = data.gameState;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('boss-bar').classList.remove('hidden');
        
        if (myRole === 'fighter') {
            document.getElementById('lives').classList.remove('hidden');
            document.getElementById('touch-area').style.display = 'block';
            document.getElementById('joystick').style.display = 'block';
        } else {
            document.getElementById('resource-bar').style.display = 'block';
            document.getElementById('unit-cards').style.display = 'flex';
            createUnitCards();
        }
    });

    socket.on('state', (data) => {
        gameState = data;
    });

    socket.on('fighterHit', (data) => {
        // ヒットエフェクト
    });

    socket.on('itemGet', (data) => {
        // アイテム取得エフェクト
    });

    socket.on('spawnResult', (data) => {
        updateUnitCards();
    });

    socket.on('gameEnd', (data) => {
        const result = document.getElementById('result');
        const title = document.getElementById('result-title');
        const isWinner = (data.winner === myRole);
        
        title.textContent = isWinner ? 'VICTORY!' : 'DEFEAT...';
        title.style.color = isWinner ? '#0f0' : '#f00';
        document.getElementById('result-score').textContent = data.score;
        result.style.display = 'flex';
    });
}

// ユニットカード作成
function createUnitCards() {
    const container = document.getElementById('unit-cards');
    container.innerHTML = '';
    Object.entries(UNITS).forEach(([type, unit]) => {
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.dataset.type = type;
        card.innerHTML = `
            <div class="icon" style="background:${unit.color}"></div>
            <div class="cost">${unit.cost}</div>
            <div class="name">${unit.name}</div>
        `;
        card.onclick = () => {
            socket.emit('spawnUnit', { type, count: 5 });
        };
        container.appendChild(card);
    });
}

function updateUnitCards() {
    if (!gameState) return;
    document.querySelectorAll('.unit-card').forEach(card => {
        const type = card.dataset.type;
        const cost = UNITS[type].cost * 5;
        card.classList.toggle('disabled', gameState.resource < cost);
    });
}

// コントロール
function setupControls() {
    // キーボード
    document.addEventListener('keydown', (e) => { keys[e.code] = true; });
    document.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // タッチ（ファイター用ジョイスティック）
    const touchArea = document.getElementById('touch-area');
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');

    touchArea.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        
        // 左半分はジョイスティック
        if (x < rect.width / 2) {
            joystickActive = true;
            joystickId = t.identifier;
            joystickStartX = t.clientX;
            joystickStartY = t.clientY;
        }
    }, { passive: false });

    touchArea.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (const t of e.touches) {
            if (t.identifier === joystickId && joystickActive) {
                const dx = t.clientX - joystickStartX;
                const dy = t.clientY - joystickStartY;
                const dist = Math.hypot(dx, dy);
                const maxDist = 40;
                const clampDist = Math.min(dist, maxDist);
                
                if (dist > 5) {
                    input.dx = (dx / dist) * (clampDist / maxDist);
                    input.dy = (dy / dist) * (clampDist / maxDist);
                    knob.style.left = (50 + dx / maxDist * 30) + '%';
                    knob.style.top = (50 + dy / maxDist * 30) + '%';
                }
            }
        }
    }, { passive: false });

    touchArea.addEventListener('touchend', (e) => {
        for (const t of e.changedTouches) {
            if (t.identifier === joystickId) {
                joystickActive = false;
                joystickId = null;
                input.dx = 0;
                input.dy = 0;
                knob.style.left = '50%';
                knob.style.top = '50%';
            }
        }
    });
}

// ゲームループ
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update() {
    // 星の移動
    stars.forEach(s => {
        s.y += s.speed;
        if (s.y > 600) { s.y = 0; s.x = Math.random() * 400; }
    });

    if (!gameState) return;

    // ファイター入力
    if (myRole === 'fighter') {
        let dx = 0, dy = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
        if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
        if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
        if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
        
        if (dx !== 0 || dy !== 0) {
            const len = Math.hypot(dx, dy);
            input.dx = dx / len;
            input.dy = dy / len;
        } else if (!joystickActive) {
            // input.dx = input.dy = 0; // ジョイスティックがアクティブでなければリセット
        }

        socket.emit('fighterInput', { dx: input.dx, dy: input.dy, shoot: true });
    }

    // UI更新
    updateUI();
}

function updateUI() {
    if (!gameState) return;
    
    document.getElementById('score').textContent = gameState.score;
    
    const totalSec = Math.floor(gameState.time / 60);
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    document.getElementById('time').textContent = min + ':' + sec.toString().padStart(2, '0');
    
    const bossHpPct = (gameState.boss.hp / gameState.boss.maxHp * 100);
    document.getElementById('boss-hp').style.width = bossHpPct + '%';
    
    if (myRole === 'fighter') {
        const lives = gameState.fighter.lives;
        document.getElementById('lives').textContent = '♥'.repeat(lives) + '♡'.repeat(Math.max(0, 3 - lives));
    }
    
    if (myRole === 'invader') {
        const resPct = (gameState.resource / gameState.resourceMax * 100);
        document.getElementById('resource-fill').style.width = resPct + '%';
        updateUnitCards();
    }
}

function draw() {
    // 背景
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 400, 600);
    
    // 星
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
        ctx.globalAlpha = 0.3 + s.speed * 0.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    if (!gameState) return;

    // ボスUFO
    const boss = gameState.boss;
    ctx.fillStyle = '#808';
    ctx.beginPath();
    ctx.ellipse(boss.x, boss.y, 40, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f0f';
    ctx.beginPath();
    ctx.ellipse(boss.x, boss.y - 5, 20, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(boss.x, boss.y - 5, 5, 0, Math.PI * 2);
    ctx.fill();

    // インベーダー
    gameState.invaders.forEach(inv => {
        const unit = UNITS[inv.type];
        ctx.fillStyle = unit?.color || '#0f0';
        
        // シールド効果
        if (inv.shieldActive) {
            ctx.strokeStyle = '#08f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(inv.x, inv.y, 18, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // 本体
        ctx.beginPath();
        ctx.arc(inv.x, inv.y, 12, 0, Math.PI * 2);
        ctx.fill();
        
        // 目
        ctx.fillStyle = '#000';
        ctx.fillRect(inv.x - 6, inv.y - 3, 4, 4);
        ctx.fillRect(inv.x + 2, inv.y - 3, 4, 4);
    });

    // インベーダー弾
    ctx.fillStyle = '#f00';
    gameState.invaderBullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.boss ? 5 : 3, 0, Math.PI * 2);
        ctx.fill();
    });

    // ファイター弾
    ctx.fillStyle = '#0ff';
    gameState.fighterBullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y - 4, 4, 8);
    });

    // ミサイル
    ctx.fillStyle = '#f80';
    gameState.missiles.forEach(m => {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(-4, 8);
        ctx.lineTo(4, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });

    // レーザー
    gameState.lasers.forEach(l => {
        const gradient = ctx.createLinearGradient(l.x - l.width / 2, 0, l.x + l.width / 2, 0);
        gradient.addColorStop(0, 'rgba(0,255,255,0)');
        gradient.addColorStop(0.3, 'rgba(0,255,255,0.8)');
        gradient.addColorStop(0.5, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.7, 'rgba(0,255,255,0.8)');
        gradient.addColorStop(1, 'rgba(0,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(l.x - l.width / 2, 0, l.width, l.y);
    });

    // アイテム
    gameState.items.forEach(item => {
        const colors = { gatling: '#0ff', missile: '#f80', laser: '#f0f', phalanx: '#0f0', life: '#f00' };
        ctx.fillStyle = colors[item.type] || '#fff';
        ctx.beginPath();
        ctx.arc(item.x, item.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 8px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(item.type[0].toUpperCase(), item.x, item.y + 3);
    });

    // ファイター
    const f = gameState.fighter;
    if (f.alive) {
        // 無敵点滅
        if (f.invincible > 0 && Math.floor(f.invincible / 4) % 2 === 0) {
            ctx.globalAlpha = 0.3;
        }
        
        // ファランクス
        const pLv = f.weapons.phalanx;
        if (pLv > 0 && f.phalanxTrail.length > 0) {
            const phalanxCount = pLv >= 3 ? 2 : 1;
            for (let p = 0; p < phalanxCount; p++) {
                const trailIdx = Math.min(10 + p * 10, f.phalanxTrail.length - 1);
                const pos = f.phalanxTrail[trailIdx];
                if (pos) {
                    ctx.fillStyle = '#0f0';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // 機体
        ctx.fillStyle = '#0f0';
        ctx.beginPath();
        ctx.moveTo(f.x, f.y - 15);
        ctx.lineTo(f.x - 12, f.y + 10);
        ctx.lineTo(f.x, f.y + 5);
        ctx.lineTo(f.x + 12, f.y + 10);
        ctx.closePath();
        ctx.fill();
        
        // コックピット
        ctx.fillStyle = '#0ff';
        ctx.beginPath();
        ctx.arc(f.x, f.y - 5, 4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.globalAlpha = 1;
    }
}

window.onload = init;
</script>
