<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLAZMER - INNER SPACE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000810; 
            overflow: hidden; 
            font-family: 'Courier New', monospace;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #canvas { display: block; background: #000810; }
        
        .ui { position: fixed; color: #0ff; font-size: 14px; text-shadow: 0 0 10px #0ff; z-index: 100; }
        
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #001020 0%, #000810 100%);
            z-index: 200;
        }
        #start-screen h1 {
            font-size: 60px; color: #0ff; text-shadow: 0 0 30px #0ff, 0 0 60px #08f;
            letter-spacing: 15px; margin-bottom: 10px;
        }
        #start-screen .subtitle {
            font-size: 16px; color: #f08; margin-bottom: 40px;
            text-shadow: 0 0 10px #f08; letter-spacing: 5px;
        }
        .menu-btn {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 15px 50px; margin: 10px; font-size: 18px; cursor: pointer;
            font-family: 'Courier New', monospace; letter-spacing: 3px;
            transition: all 0.3s; text-shadow: 0 0 10px #0ff;
        }
        .menu-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; }
        .name-input {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 10px 20px; font-size: 16px; text-align: center;
            font-family: 'Courier New', monospace; margin-bottom: 20px; width: 200px;
        }
        .name-input::placeholder { color: #088; }
        
        #hud { position: fixed; top: 10px; left: 10px; }
        #hud-right { position: fixed; top: 10px; right: 10px; text-align: right; }
        .hud-label { font-size: 10px; color: #088; margin-bottom: 2px; }
        .hud-value { font-size: 20px; color: #0ff; margin-bottom: 10px; }
        #hp-bar { width: 150px; height: 8px; background: #001; border: 1px solid #0ff; margin-bottom: 10px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0, #0f0); transition: width 0.2s; }
        
        #boss-container {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            width: 400px; max-width: 80%; display: none; text-align: center;
        }
        #boss-name { font-size: 14px; color: #f00; margin-bottom: 5px; text-shadow: 0 0 10px #f00; }
        #boss-bar { width: 100%; height: 12px; background: #200; border: 1px solid #f00; }
        #boss-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.3s; }
        
        #weapons {
            position: fixed; bottom: 10px; left: 10px;
            display: flex; gap: 8px; flex-wrap: wrap; max-width: 350px;
        }
        .weapon-slot {
            padding: 5px 8px; border: 1px solid #444; background: #001;
            font-size: 9px; color: #888; transition: all 0.3s;
        }
        .weapon-slot.active { border-color: #0ff; color: #0ff; box-shadow: 0 0 10px #0ff; }
        .weapon-slot.locked { opacity: 0.3; }
        
        #formation-display {
            position: fixed; bottom: 80px; left: 10px;
            font-size: 12px; color: #0f0; text-shadow: 0 0 10px #0f0;
        }
        
        #joystick-zone {
            position: fixed; bottom: 20px; left: 20px;
            width: 130px; height: 130px; display: none;
        }
        #joystick-base {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(0,255,255,0.1); border: 2px solid rgba(0,255,255,0.3);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.4); border: 2px solid #0ff;
        }
        #mobile-buttons {
            position: fixed; bottom: 20px; right: 20px;
            display: none; gap: 10px;
        }
        .mobile-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.2); border: 2px solid #0ff;
            color: #0ff; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .mobile-btn:active { background: rgba(0,255,255,0.5); }
        
        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 300;
        }
        #game-over h2 { font-size: 48px; color: #f00; margin-bottom: 20px; text-shadow: 0 0 30px #f00; }
        #final-score { font-size: 24px; color: #0ff; margin-bottom: 30px; }
        
        #message {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: #0ff; text-shadow: 0 0 20px #0ff;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 150;
        }
        
        @media (max-width: 768px) {
            #start-screen h1 { font-size: 36px; letter-spacing: 8px; }
            .menu-btn { padding: 12px 30px; font-size: 14px; }
            #joystick-zone, #mobile-buttons { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="start-screen">
        <h1>PLAZMER</h1>
        <div class="subtitle">◆ INNER SPACE ◆</div>
        <input type="text" id="player-name" class="name-input" placeholder="ENTER NAME" maxlength="12">
        <button class="menu-btn" onclick="startSoloGame()">START</button>
    </div>
    
    <div id="hud" class="ui">
        <div class="hud-label">IMMUNE CELL HP</div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <div class="hud-label">WAVE</div>
        <div class="hud-value" id="wave">0</div>
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="score">0</div>
    </div>
    
    <div id="hud-right" class="ui">
        <div class="hud-label">BOMB</div>
        <div class="hud-value" id="bomb">2</div>
    </div>
    
    <div id="boss-container">
        <div id="boss-name">BOSS</div>
        <div id="boss-bar"><div id="boss-hp"></div></div>
    </div>
    
    <div id="weapons">
        <div class="weapon-slot active" id="w-plazmer">PLAZMER</div>
        <div class="weapon-slot locked" id="w-homing">HOMING</div>
        <div class="weapon-slot locked" id="w-laser">LASER</div>
        <div class="weapon-slot locked" id="w-thunder">THUNDER</div>
        <div class="weapon-slot locked" id="w-allrange">ALL-RANGE</div>
    </div>
    
    <div id="formation-display">FORMATION: FOLLOW</div>
    
    <div id="joystick-zone">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>
    <div id="mobile-buttons">
        <div class="mobile-btn" id="btn-dash">DASH</div>
        <div class="mobile-btn" id="btn-bomb">BOMB</div>
        <div class="mobile-btn" id="btn-form">FORM</div>
    </div>
    
    <div id="game-over">
        <h2>INFECTION SPREAD</h2>
        <div id="final-score">SCORE: 0</div>
        <button class="menu-btn" onclick="location.reload()">RETRY</button>
    </div>
    
    <div id="message"></div>

<script>
// ========== 定数 ==========
const WORLD_W = 3000, WORLD_H = 3000;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ========== グローバル変数 ==========
let player = null;
let enemies = [];
let bullets = [];
let enemyBullets = [];
let particles = [];
let texts = [];
let items = [];
let options = [];
let walls = [];

let wave = 0;
let score = 0;
let frame = 0;
let gameState = 'title';
let currentBoss = null;

// 武器レベル
let weaponLevels = { PLAZMER: 1, HOMING: 0, LASER: 0, THUNDER: 0, ALLRANGE: 0 };

// フォーメーション
const FORMATIONS = ['FOLLOW', 'GO AROUND 1', 'GO AROUND 2', 'HUNT'];
let currentFormation = 0;

// カメラ
let camera = { x: 0, y: 0 };

// 画面揺れ
let screenShake = { x: 0, y: 0, intensity: 0 };

// コンボ
let combo = { count: 0, timer: 0, multiplier: 1 };

// 入力
let input = { x: 0, y: 0, active: false };
let joystick = { active: false, dx: 0, dy: 0 };

// ソロモード用
let soloWaveTimer = 0;
let soloMobTimer = 0;
let enemyIdCounter = 0;

// UI要素
const ui = {
    startScreen: document.getElementById('start-screen'),
    gameOver: document.getElementById('game-over'),
    hp: document.getElementById('hp-fill'),
    wave: document.getElementById('wave'),
    score: document.getElementById('score'),
    bomb: document.getElementById('bomb'),
    bossContainer: document.getElementById('boss-container'),
    bossName: document.getElementById('boss-name'),
    bossHp: document.getElementById('boss-hp'),
    message: document.getElementById('message'),
    formationDisplay: document.getElementById('formation-display'),
    weapons: {
        plazmer: document.getElementById('w-plazmer'),
        homing: document.getElementById('w-homing'),
        laser: document.getElementById('w-laser'),
        thunder: document.getElementById('w-thunder'),
        allrange: document.getElementById('w-allrange')
    }
};

// ========== 初期化 ==========
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('mousemove', e => {
        input.x = e.clientX;
        input.y = e.clientY;
    });
    canvas.addEventListener('mousedown', () => input.active = true);
    canvas.addEventListener('mouseup', () => input.active = false);
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') triggerDash();
        if (e.code === 'KeyB') triggerBomb();
        if (e.code === 'KeyF') cycleFormation();
    });
    
    initMobileControls();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

// ========== ゲーム開始 ==========
function startSoloGame() {
    const nameInput = document.getElementById('player-name');
    
    ui.startScreen.style.display = 'none';
    
    player = new Player();
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    texts = [];
    items = [];
    options = [];
    
    weaponLevels = { PLAZMER: 1, HOMING: 0, LASER: 0, THUNDER: 0, ALLRANGE: 0 };
    currentFormation = 0;
    updateWeaponUI();
    
    wave = 0;
    score = 0;
    soloWaveTimer = 0;
    soloMobTimer = 0;
    enemyIdCounter = 0;
    combo = { count: 0, timer: 0, multiplier: 1 };
    
    walls = generateWalls(0);
    
    gameState = 'playing';
    frame = 0;
    
    initAudio();
    playBGM();
    update();
}

// ========== 壁生成（赤血球/細胞壁）==========
function generateWalls(waveNum) {
    const w = [];
    const thickness = 50;
    
    // 外壁
    w.push({ x: 0, y: 0, w: WORLD_W, h: thickness, type: 'border' });
    w.push({ x: 0, y: WORLD_H - thickness, w: WORLD_W, h: thickness, type: 'border' });
    w.push({ x: 0, y: 0, w: thickness, h: WORLD_H, type: 'border' });
    w.push({ x: WORLD_W - thickness, y: 0, w: thickness, h: WORLD_H, type: 'border' });
    
    // 内部の赤血球（たくさん！）
    const count = 15 + waveNum * 2 + Math.floor(Math.random() * 10);
    for (let i = 0; i < count; i++) {
        const size = 40 + Math.random() * 80;
        const x = 150 + Math.random() * (WORLD_W - 300);
        const y = 150 + Math.random() * (WORLD_H - 300);
        
        // プレイヤー初期位置から離す
        if (Math.hypot(x - WORLD_W/2, y - WORLD_H/2) < 250) continue;
        
        w.push({ 
            x: x - size/2, 
            y: y - size/2, 
            w: size, 
            h: size, 
            type: 'cell',
            cx: x,
            cy: y,
            radius: size / 2
        });
    }
    
    return w;
}

function checkWall(x, y) {
    for (const w of walls) {
        if (w.type === 'cell') {
            // 円形の当たり判定
            if (Math.hypot(x - w.cx, y - w.cy) < w.radius) return true;
        } else {
            if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return true;
        }
    }
    return false;
}

function getWallNormal(x, y) {
    for (const w of walls) {
        if (w.type === 'cell') {
            const dist = Math.hypot(x - w.cx, y - w.cy);
            if (dist < w.radius + 10) {
                return { x: (x - w.cx) / dist, y: (y - w.cy) / dist };
            }
        }
    }
    // 境界壁
    if (x < 60) return { x: 1, y: 0 };
    if (x > WORLD_W - 60) return { x: -1, y: 0 };
    if (y < 60) return { x: 0, y: 1 };
    if (y > WORLD_H - 60) return { x: 0, y: -1 };
    return null;
}

// ========== プレイヤークラス ==========
class Player {
    constructor() {
        this.x = WORLD_W / 2;
        this.y = WORLD_H / 2;
        this.r = 8;
        this.color = '#fff';
        this.maxHp = 100;
        this.hp = 100;
        this.speed = 6;
        this.bombs = 2;
        this.angle = 0;
        this.weaponTimer = 0;
        this.dashing = false;
        this.dashTimer = 0;
        this.invincible = 60;
        this.pulsePhase = 0;
        this.history = [];
    }
    
    update() {
        if (this.invincible > 0) this.invincible--;
        this.pulsePhase += 0.1;
        
        // 壁から脱出
        if (checkWall(this.x, this.y)) {
            for (let dist = 10; dist < 500; dist += 10) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
                    const testX = this.x + Math.cos(a) * dist;
                    const testY = this.y + Math.sin(a) * dist;
                    if (!checkWall(testX, testY)) {
                        this.x = testX;
                        this.y = testY;
                        createParticles(this.x, this.y, '#fff', 10);
                        showMessage('ESCAPED!');
                        return;
                    }
                }
            }
        }
        
        // ダッシュ
        if (this.dashing) {
            this.dashTimer--;
            const vx = Math.cos(this.angle) * 28;
            const vy = Math.sin(this.angle) * 28;
            if (!checkWall(this.x + vx, this.y)) this.x += vx;
            if (!checkWall(this.x, this.y + vy)) this.y += vy;
            if (frame % 2 === 0) particles.push(new Particle(this.x, this.y, '#fff', 5, 5));
            if (this.dashTimer <= 0) this.dashing = false;
        } else {
            if (joystick.active && (Math.abs(joystick.dx) > 0.1 || Math.abs(joystick.dy) > 0.1)) {
                this.angle = Math.atan2(joystick.dy, joystick.dx);
                const mag = Math.min(1, Math.hypot(joystick.dx, joystick.dy));
                const vx = joystick.dx * this.speed * mag;
                const vy = joystick.dy * this.speed * mag;
                if (!checkWall(this.x + vx, this.y)) this.x += vx;
                if (!checkWall(this.x, this.y + vy)) this.y += vy;
            } else if (input.active) {
                const mx = input.x + camera.x;
                const my = input.y + camera.y;
                this.angle = Math.atan2(my - this.y, mx - this.x);
                if (Math.hypot(mx - this.x, my - this.y) > 20) {
                    const vx = Math.cos(this.angle) * this.speed;
                    const vy = Math.sin(this.angle) * this.speed;
                    if (!checkWall(this.x + vx, this.y)) this.x += vx;
                    if (!checkWall(this.x, this.y + vy)) this.y += vy;
                }
            }
        }
        
        // 履歴保存（FOLLOWフォーメーション用）
        this.history.unshift({ x: this.x, y: this.y, angle: this.angle });
        if (this.history.length > 120) this.history.pop();
        
        this.x = Math.max(60, Math.min(WORLD_W - 60, this.x));
        this.y = Math.max(60, Math.min(WORLD_H - 60, this.y));
        
        // 武器発射
        this.weaponTimer++;
        if (this.weaponTimer >= 15) {
            this.fireAllWeapons();
            this.weaponTimer = 0;
        }
        
        // オプション更新
        options.forEach((opt, i) => opt.update(i, options.length));
    }
    
    fireAllWeapons() {
        // PLAZMER（白い放射状弾）
        this.firePlazmer();
        
        // HOMING（整列してから発射）
        if (weaponLevels.HOMING > 0) this.fireHoming();
        
        // LASER（長い反射レーザー）
        if (weaponLevels.LASER > 0) this.fireLaser();
        
        // THUNDER（ギザギザ追尾）
        if (weaponLevels.THUNDER > 0) this.fireThunder();
        
        // ALL-RANGEオプションからも発射
        options.forEach(opt => {
            if (currentFormation !== 3) { // HUNTモード以外
                bullets.push(new PlazmerBullet({
                    x: opt.x, y: opt.y,
                    angle: opt.angle,
                    damage: 3,
                    color: '#0f0'
                }));
            }
        });
        
        playSound('shoot');
    }
    
    firePlazmer() {
        const lv = weaponLevels.PLAZMER;
        // レベルに応じて360度放射状
        const count = Math.min(24, 3 + lv * 3);
        
        for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i + (lv < 3 ? this.angle : 0);
            bullets.push(new PlazmerBullet({
                x: this.x, y: this.y,
                angle: a,
                damage: 3 + Math.floor(lv / 2),
                color: '#fff'
            }));
        }
    }
    
    fireHoming() {
        const lv = weaponLevels.HOMING;
        const count = Math.min(8, 2 + lv);
        
        // プレイヤーの横に整列してから発射
        for (let i = 0; i < count; i++) {
            const offset = (i - (count - 1) / 2) * 15;
            const perpAngle = this.angle + Math.PI / 2;
            const startX = this.x + Math.cos(perpAngle) * offset;
            const startY = this.y + Math.sin(perpAngle) * offset;
            
            bullets.push(new HomingMissile({
                x: startX,
                y: startY,
                angle: this.angle,
                damage: 8 + lv * 2,
                delay: i * 3 // 順番に発射
            }));
        }
        playSound('missile');
    }
    
    fireLaser() {
        const lv = weaponLevels.LASER;
        bullets.push(new ReflectLaser({
            x: this.x, y: this.y,
            angle: this.angle,
            damage: 5 + lv * 2,
            maxBounces: 5 + lv * 2,
            maxLength: 2000 + lv * 500
        }));
        playSound('laser');
    }
    
    fireThunder() {
        const lv = weaponLevels.THUNDER;
        
        // 最も近い敵を探す
        let target = null, minDist = 800;
        enemies.forEach(e => {
            if (e.hp > 0) {
                const d = Math.hypot(e.x - this.x, e.y - this.y);
                if (d < minDist) { minDist = d; target = e; }
            }
        });
        
        bullets.push(new ThunderBolt({
            x: this.x, y: this.y,
            target: target,
            angle: this.angle,
            damage: 12 + lv * 5
        }));
        playSound('thunder');
    }
    
    dash() {
        if (!this.dashing) {
            this.dashing = true;
            this.dashTimer = 10;
            this.invincible = Math.max(this.invincible, 12);
            playSound('dash');
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(this.x, this.y, '#fff', 6, 4));
            }
        }
    }
    
    damage(val) {
        if (this.invincible > 0 || this.dashing) return;
        this.hp -= val;
        ui.hp.style.width = Math.max(0, (this.hp / this.maxHp) * 100) + '%';
        createFloatingText(this.x, this.y, `-${val}`, '#f00');
        playSound('hit');
        triggerScreenShake(10);
        this.invincible = 30;
        
        if (this.hp <= 0) endGame();
    }
    
    heal(val) {
        this.hp = Math.min(this.maxHp, this.hp + val);
        ui.hp.style.width = (this.hp / this.maxHp) * 100 + '%';
        createFloatingText(this.x, this.y, '+HP', '#0f0');
        playSound('heal');
    }
    
    draw() {
        const sx = this.x - camera.x + screenShake.x;
        const sy = this.y - camera.y + screenShake.y;
        
        options.forEach(opt => opt.draw());
        
        if (this.invincible % 4 < 2) {
            const pulse = Math.sin(this.pulsePhase) * 2;
            
            ctx.save();
            ctx.translate(sx, sy);
            
            ctx.shadowBlur = this.dashing ? 30 : 15;
            ctx.shadowColor = this.dashing ? '#fff' : '#0ff';
            
            ctx.fillStyle = this.dashing ? '#fff' : 'rgba(200,240,255,0.9)';
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI * 2 / 8) * i + this.pulsePhase * 0.3;
                const r = this.r + pulse + Math.sin(a * 3 + frame * 0.1) * 2;
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = 'rgba(100,150,200,0.8)';
            ctx.beginPath();
            ctx.arc(0, 0, this.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.rotate(this.angle);
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.moveTo(this.r + 5, 0);
            ctx.lineTo(this.r, -3);
            ctx.lineTo(this.r, 3);
            ctx.fill();
            
            ctx.restore();
        }
    }
}

// ========== オプション（ALL-RANGE）==========
class Option {
    constructor() {
        this.x = player.x;
        this.y = player.y;
        this.angle = 0;
        this.orbitAngle = Math.random() * Math.PI * 2;
        this.target = null;
        this.attackTimer = 0;
    }
    
    update(index, total) {
        const formation = FORMATIONS[currentFormation];
        
        switch (formation) {
            case 'FOLLOW':
                // プレイヤーについてくる
                const histIndex = Math.min((index + 1) * 15, player.history.length - 1);
                if (player.history[histIndex]) {
                    const target = player.history[histIndex];
                    this.x += (target.x - this.x) * 0.2;
                    this.y += (target.y - this.y) * 0.2;
                    this.angle = target.angle;
                }
                break;
                
            case 'GO AROUND 1':
                // 正面を向いて周囲を回る
                this.orbitAngle += 0.04;
                const baseAngle1 = (Math.PI * 2 / total) * index + this.orbitAngle;
                const orbitR1 = 50;
                this.x = player.x + Math.cos(baseAngle1) * orbitR1;
                this.y = player.y + Math.sin(baseAngle1) * orbitR1;
                this.angle = player.angle; // プレイヤーと同じ方向
                break;
                
            case 'GO AROUND 2':
                // 外側を向いて周囲を回る
                this.orbitAngle += 0.04;
                const baseAngle2 = (Math.PI * 2 / total) * index + this.orbitAngle;
                const orbitR2 = 50;
                this.x = player.x + Math.cos(baseAngle2) * orbitR2;
                this.y = player.y + Math.sin(baseAngle2) * orbitR2;
                this.angle = baseAngle2; // 外側を向く
                break;
                
            case 'HUNT':
                // AIで勝手に敵を倒す
                this.attackTimer++;
                
                // ターゲット探索
                if (!this.target || this.target.hp <= 0 || frame % 60 === 0) {
                    let minDist = 500;
                    this.target = null;
                    enemies.forEach(e => {
                        if (e.hp > 0) {
                            const d = Math.hypot(e.x - this.x, e.y - this.y);
                            if (d < minDist) {
                                minDist = d;
                                this.target = e;
                            }
                        }
                    });
                }
                
                if (this.target && this.target.hp > 0) {
                    // ターゲットに向かって移動
                    const toTarget = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                    const dist = Math.hypot(this.target.x - this.x, this.target.y - this.y);
                    
                    if (dist > 100) {
                        const vx = Math.cos(toTarget) * 5;
                        const vy = Math.sin(toTarget) * 5;
                        if (!checkWall(this.x + vx, this.y + vy)) {
                            this.x += vx;
                            this.y += vy;
                        }
                    }
                    
                    this.angle = toTarget;
                    
                    // 攻撃
                    if (this.attackTimer >= 20) {
                        this.attackTimer = 0;
                        bullets.push(new PlazmerBullet({
                            x: this.x, y: this.y,
                            angle: this.angle,
                            damage: 5,
                            color: '#0f0'
                        }));
                    }
                } else {
                    // ターゲットがいない場合はプレイヤーの近くに戻る
                    const toPlayer = Math.atan2(player.y - this.y, player.x - this.x);
                    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
                    
                    if (distToPlayer > 150) {
                        this.x += Math.cos(toPlayer) * 4;
                        this.y += Math.sin(toPlayer) * 4;
                    }
                    this.angle = player.angle;
                }
                break;
        }
    }
    
    draw() {
        const sx = this.x - camera.x + screenShake.x;
        const sy = this.y - camera.y + screenShake.y;
        
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        
        ctx.fillStyle = '#0f0';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0f0';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(4, -3);
        ctx.lineTo(4, 3);
        ctx.fill();
        
        // HUNTモードでターゲットがいる場合、ラインを表示
        if (FORMATIONS[currentFormation] === 'HUNT' && this.target && this.target.hp > 0) {
            ctx.rotate(-this.angle);
            ctx.strokeStyle = 'rgba(0,255,0,0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(this.target.x - this.x, this.target.y - this.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        ctx.restore();
    }
}

// PLAZMER弾（白い弾）
class PlazmerBullet {
    constructor(data) {
        this.x = data.x;
        this.y = data.y;
        this.angle = data.angle;
        this.speed = 12;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.damage = data.damage || 3;
        this.color = data.color || '#fff';
        this.size = 4;
        this.life = 60;
        this.type = 'PLAZMER';
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        if (this.life <= 0 || checkWall(this.x, this.y)) this.dead = true;
        this.checkHit();
    }
    checkHit() {
        for (const e of enemies) {
            if (e.hp > 0 && Math.hypot(e.x - this.x, e.y - this.y) < e.size + this.size) {
                damageEnemy(e, this.damage, this.type);
                this.dead = true;
                createParticle(this.x, this.y, this.color);
                break;
            }
        }
    }
    draw() {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(sx, sy, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// HOMINGミサイル（整列してから発射）
class HomingMissile {
    constructor(data) {
        this.x = data.x;
        this.y = data.y;
        this.angle = data.angle;
        this.speed = 0;
        this.maxSpeed = 12;
        this.damage = data.damage || 8;
        this.color = '#a0f';
        this.life = 180;
        this.type = 'HOMING';
        this.trail = [];
        this.delay = data.delay || 0;
        this.launched = false;
    }
    update() {
        this.life--;
        if (this.life <= 0) this.dead = true;
        
        // 発射遅延
        if (this.delay > 0) {
            this.delay--;
            // プレイヤーについていく
            const perpAngle = player.angle + Math.PI / 2;
            this.x += (player.x - this.x) * 0.3;
            this.y += (player.y - this.y) * 0.3;
            return;
        }
        
        if (!this.launched) {
            this.launched = true;
            this.speed = 3;
        }
        
        // 加速
        if (this.speed < this.maxSpeed) this.speed += 0.5;
        
        // 追尾
        let target = null, minDist = 500;
        enemies.forEach(e => {
            if (e.hp > 0) {
                const d = Math.hypot(e.x - this.x, e.y - this.y);
                if (d < minDist) { minDist = d; target = e; }
            }
        });
        
        if (target) {
            let d = Math.atan2(target.y - this.y, target.x - this.x) - this.angle;
            while (d < -Math.PI) d += Math.PI * 2;
            while (d > Math.PI) d -= Math.PI * 2;
            this.angle += d * 0.12;
        }
        
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        
        this.trail.unshift({ x: this.x, y: this.y });
        if (this.trail.length > 15) this.trail.pop();
        
        if (checkWall(this.x, this.y)) {
            this.dead = true;
            createParticles(this.x, this.y, '#f80', 8);
            playSound('explode');
        }
        
        for (const e of enemies) {
            if (e.hp > 0 && Math.hypot(e.x - this.x, e.y - this.y) < e.size + 6) {
                damageEnemy(e, this.damage, this.type);
                this.dead = true;
                createParticles(this.x, this.y, this.color, 10);
                playSound('explode');
                break;
            }
        }
    }
    draw() {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;
        
        // 軌跡
        this.trail.forEach((p, i) => {
            const alpha = 1 - i / this.trail.length;
            ctx.fillStyle = `rgba(170,0,255,${alpha * 0.6})`;
            ctx.beginPath();
            ctx.arc(p.x - camera.x, p.y - camera.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
        
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-6, 5);
        ctx.lineTo(-3, 0);
        ctx.lineTo(-6, -5);
        ctx.fill();
        ctx.restore();
    }
}

// LASER（長い反射レーザー）
class ReflectLaser {
    constructor(data) {
        this.x = data.x;
        this.y = data.y;
        this.angle = data.angle;
        this.damage = data.damage || 5;
        this.maxBounces = data.maxBounces || 5;
        this.bounces = this.maxBounces;
        this.maxLength = data.maxLength || 2000;
        this.color = '#0ff';
        this.life = 10;
        this.speed = 25;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.trail = [{ x: this.x, y: this.y }];
        this.hitEnemies = new Set();
        this.type = 'LASER';
        this.totalDist = 0;
    }
    update() {
        this.life--;
        if (this.life <= 0 || this.totalDist > this.maxLength) this.dead = true;
        
        const oldX = this.x, oldY = this.y;
        
        // 壁反射
        const normal = getWallNormal(this.x + this.vx, this.y + this.vy);
        if (normal && this.bounces > 0) {
            // 反射ベクトル計算
            const dot = this.vx * normal.x + this.vy * normal.y;
            this.vx = this.vx - 2 * dot * normal.x;
            this.vy = this.vy - 2 * dot * normal.y;
            this.bounces--;
            this.trail.push({ x: this.x, y: this.y });
            createParticle(this.x, this.y, this.color);
            playSound('reflect');
        }
        
        this.x += this.vx;
        this.y += this.vy;
        this.totalDist += Math.hypot(this.x - oldX, this.y - oldY);
        
        // 境界チェック
        if (this.x < 50 || this.x > WORLD_W - 50 || this.y < 50 || this.y > WORLD_H - 50) {
            if (this.bounces <= 0) this.dead = true;
        }
        
        // 敵への貫通ダメージ
        enemies.forEach(e => {
            if (e.hp > 0 && !this.hitEnemies.has(e.id)) {
                if (Math.hypot(e.x - this.x, e.y - this.y) < e.size + 10) {
                    damageEnemy(e, this.damage, this.type);
                    this.hitEnemies.add(e.id);
                    createParticle(e.x, e.y, this.color);
                    // 貫通するので dead = true にしない
                }
            }
        });
    }
    draw() {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 5;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.lineCap = 'round';
        ctx.beginPath();
        this.trail.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x - camera.x, p.y - camera.y);
            else ctx.lineTo(p.x - camera.x, p.y - camera.y);
        });
        ctx.lineTo(this.x - camera.x, this.y - camera.y);
        ctx.stroke();
        
        // 先端の輝き
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// THUNDER（ギザギザ追尾）
class ThunderBolt {
    constructor(data) {
        this.x = data.x;
        this.y = data.y;
        this.target = data.target;
        this.angle = data.angle;
        this.damage = data.damage || 12;
        this.color = '#ff0';
        this.life = 25;
        this.type = 'THUNDER';
        this.points = [{ x: this.x, y: this.y }];
        this.targetX = this.target ? this.target.x : this.x + Math.cos(this.angle) * 500;
        this.targetY = this.target ? this.target.y : this.y + Math.sin(this.angle) * 500;
        this.hitEnemies = new Set();
        this.progress = 0;
        
        // ギザギザパスを生成
        this.generatePath();
    }
    
    generatePath() {
        const segments = 12;
        const perpAngle = Math.atan2(this.targetY - this.y, this.targetX - this.x) + Math.PI / 2;
        
        for (let i = 1; i <= segments; i++) {
            const progress = i / segments;
            const baseX = this.x + (this.targetX - this.x) * progress;
            const baseY = this.y + (this.targetY - this.y) * progress;
            // ギザギザ
            const zigzag = (i % 2 === 0 ? 1 : -1) * (30 + Math.random() * 20);
            this.points.push({
                x: baseX + Math.cos(perpAngle) * zigzag,
                y: baseY + Math.sin(perpAngle) * zigzag
            });
        }
    }
    
    update() {
        this.life--;
        if (this.life <= 0) this.dead = true;
        
        // ターゲットを更新
        if (this.target && this.target.hp > 0) {
            this.targetX = this.target.x;
            this.targetY = this.target.y;
        }
        
        // 雷の揺らぎ
        this.points.forEach((p, i) => {
            if (i > 0 && i < this.points.length - 1) {
                p.x += (Math.random() - 0.5) * 10;
                p.y += (Math.random() - 0.5) * 10;
            }
        });
        
        // 先端を進める
        this.progress = Math.min(1, this.progress + 0.15);
        
        // 当たり判定
        const currentSegment = Math.floor(this.progress * (this.points.length - 1));
        for (let i = 0; i <= currentSegment && i < this.points.length - 1; i++) {
            const p1 = this.points[i];
            const p2 = this.points[i + 1];
            
            enemies.forEach(e => {
                if (e.hp > 0 && !this.hitEnemies.has(e.id)) {
                    if (distToSegment(e.x, e.y, p1.x, p1.y, p2.x, p2.y) < e.size + 20) {
                        damageEnemy(e, this.damage, this.type);
                        this.hitEnemies.add(e.id);
                        createParticles(e.x, e.y, '#ff0', 8);
                    }
                }
            });
        }
    }
    
    draw() {
        const alpha = this.life / 25;
        const currentSegment = Math.floor(this.progress * (this.points.length - 1));
        
        // 外側のグロー
        ctx.strokeStyle = `rgba(255,255,0,${alpha * 0.3})`;
        ctx.lineWidth = 15;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let i = 0; i <= currentSegment && i < this.points.length; i++) {
            const p = this.points[i];
            if (i === 0) ctx.moveTo(p.x - camera.x, p.y - camera.y);
            else ctx.lineTo(p.x - camera.x, p.y - camera.y);
        }
        ctx.stroke();
        
        // メインの雷
        ctx.strokeStyle = `rgba(255,255,0,${alpha})`;
        ctx.lineWidth = 4;
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ff0';
        ctx.stroke();
        
        // コア
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}
