<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLAZMERS - ONLINE MULTIPLAYER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000810; 
            overflow: hidden; 
            font-family: 'Courier New', monospace;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            cursor: crosshair;
        }
        #canvas { display: block; background: #000810; }
        
        .ui { position: fixed; color: #0ff; font-size: 14px; text-shadow: 0 0 10px #0ff; z-index: 100; }
        
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #001020 0%, #000810 100%);
            z-index: 200;
        }
        #start-screen h1 {
            font-size: 60px; color: #0ff; text-shadow: 0 0 30px #0ff, 0 0 60px #08f;
            letter-spacing: 15px; margin-bottom: 10px;
        }
        #start-screen .subtitle {
            font-size: 16px; color: #f08; margin-bottom: 20px;
            text-shadow: 0 0 10px #f08; letter-spacing: 5px;
        }
        #start-screen .online-badge {
            font-size: 14px; color: #0f0; margin-bottom: 30px;
            text-shadow: 0 0 10px #0f0; letter-spacing: 3px;
            padding: 5px 15px; border: 1px solid #0f0; border-radius: 20px;
        }
        .menu-btn {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 15px 50px; margin: 10px; font-size: 18px; cursor: pointer;
            font-family: 'Courier New', monospace; letter-spacing: 3px;
            transition: all 0.3s; text-shadow: 0 0 10px #0ff;
        }
        .menu-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; }
        .name-input, .room-input {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 10px 20px; font-size: 16px; text-align: center;
            font-family: 'Courier New', monospace; margin-bottom: 10px; width: 200px;
        }
        .name-input::placeholder, .room-input::placeholder { color: #088; }
        .room-input { margin-bottom: 20px; }
        .back-btn { border-color: #888; color: #888; text-shadow: 0 0 10px #888; padding: 10px 30px; font-size: 14px; }
        .back-btn:hover { background: #888; color: #000; }
        .start-btn { border-color: #0f0; color: #0f0; text-shadow: 0 0 10px #0f0; }
        .start-btn:hover { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; }
        .ready-btn { border-color: #0f0; color: #0f0; text-shadow: 0 0 10px #0f0; }
        .ready-btn:hover { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; }
        .ready-btn.ready-sent { border-color: #888; color: #888; pointer-events: none; }
        .room-code-display {
            font-size: 32px; color: #ff0; margin: 20px 0;
            text-shadow: 0 0 20px #ff0; letter-spacing: 8px;
            padding: 15px 30px; border: 3px solid #ff0; border-radius: 10px;
            background: rgba(255,255,0,0.1);
        }
        .room-code-display span { font-weight: bold; }
        .waiting-text { color: #0ff; font-size: 14px; margin: 10px 0; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        #lobby-players, #guest-lobby-players {
            background: rgba(0,0,0,0.5); border: 1px solid #0ff; padding: 15px;
            margin: 15px 0; min-width: 250px; border-radius: 5px;
        }
        .lobby-player {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; margin: 5px 0; border-radius: 3px;
            background: rgba(0,255,255,0.1);
        }
        .lobby-player .player-color {
            width: 12px; height: 12px; border-radius: 50%; margin-right: 10px;
            box-shadow: 0 0 10px currentColor;
        }
        .lobby-player .player-name { flex: 1; text-align: left; }
        .lobby-player .player-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .lobby-player .player-status.host { color: #ff0; border: 1px solid #ff0; }
        .lobby-player .player-status.ready { color: #0f0; border: 1px solid #0f0; }
        .lobby-player .player-status.waiting { color: #888; border: 1px solid #888; }
        
        #connection-status {
            font-size: 12px; color: #888; margin-top: 20px;
        }
        #connection-status.connected { color: #0f0; }
        #connection-status.error { color: #f00; }
        
        #hud { position: fixed; top: 10px; left: 10px; }
        .hud-label { font-size: 10px; color: #088; margin-bottom: 2px; }
        .hud-value { font-size: 20px; color: #0ff; margin-bottom: 10px; }
        #hp-bar { width: 150px; height: 8px; background: #001; border: 1px solid #0ff; margin-bottom: 10px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0, #0f0); transition: width 0.2s; }
        
        #players-list {
            position: fixed; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #0ff;
            font-size: 12px; max-width: 200px;
        }
        #players-list h3 { color: #0ff; margin-bottom: 5px; font-size: 12px; }
        .player-entry { margin: 3px 0; display: flex; align-items: center; }
        .player-entry.me { font-weight: bold; }
        .player-entry.dead { opacity: 0.5; text-decoration: line-through; }
        
        #boss-container {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            width: 500px; max-width: 90%; display: none; text-align: center;
        }
        #boss-name { font-size: 14px; color: #f00; margin-bottom: 5px; text-shadow: 0 0 10px #f00; font-weight: bold; }
        #boss-bar { width: 100%; height: 12px; background: #200; border: 1px solid #f00; }
        #boss-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.3s; }
        
        #weapons {
            position: fixed; bottom: 10px; left: 10px;
            display: flex; gap: 8px; flex-wrap: wrap; max-width: 350px;
        }
        .weapon-slot {
            padding: 5px 8px; border: 1px solid #444; background: #001;
            font-size: 9px; color: #888; transition: all 0.3s;
        }
        .weapon-slot.active { border-color: #0ff; color: #0ff; box-shadow: 0 0 10px #0ff; }
        .weapon-slot.locked { opacity: 0.3; }
        
        #formation-display {
            position: fixed; bottom: 80px; left: 10px;
            font-size: 12px; color: #0f0; text-shadow: 0 0 10px #0f0;
        }
        
        #joystick-zone {
            position: fixed; bottom: 20px; left: 20px;
            width: 130px; height: 130px; display: none;
        }
        #joystick-base {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(0,255,255,0.1); border: 2px solid rgba(0,255,255,0.3);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.4); border: 2px solid #0ff;
        }
        #mobile-buttons {
            position: fixed; bottom: 20px; right: 20px;
            display: none; gap: 10px;
        }
        .mobile-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.2); border: 2px solid #0ff;
            color: #0ff; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .mobile-btn:active { background: rgba(0,255,255,0.5); }
        
        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 300;
        }
        #game-over h2 { font-size: 48px; color: #f00; margin-bottom: 20px; text-shadow: 0 0 30px #f00; }
        #final-score { font-size: 24px; color: #0ff; margin-bottom: 10px; }
        #final-wave { font-size: 18px; color: #0ff; margin-bottom: 30px; }
        
        #message {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: #0ff; text-shadow: 0 0 20px #0ff;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 150; width: 100%; text-align: center;
        }
        
        @media (max-width: 768px) {
            #start-screen h1 { font-size: 36px; letter-spacing: 8px; }
            .menu-btn { padding: 12px 30px; font-size: 14px; }
            #joystick-zone, #mobile-buttons { display: flex; }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="start-screen">
        <h1>PLAZMERS</h1>
        <div class="subtitle">◆ INNER SPACE ◆</div>
        <div class="online-badge">🌐 ONLINE CO-OP</div>
        <input type="text" id="player-name" class="name-input" placeholder="YOUR NAME" maxlength="12">
        
        <div id="menu-buttons">
            <button class="menu-btn" onclick="hostGame()">HOST GAME</button>
            <button class="menu-btn" onclick="showJoinForm()">JOIN GAME</button>
        </div>
        
        <div id="join-form" style="display:none;">
            <input type="text" id="room-id" class="room-input" placeholder="4-DIGIT CODE" maxlength="4">
            <button class="menu-btn" onclick="joinGame()">JOIN</button>
            <button class="menu-btn back-btn" onclick="showMainMenu()">BACK</button>
        </div>
        
        <div id="host-info" style="display:none;">
            <div class="room-code-display">ROOM CODE: <span id="generated-code">----</span></div>
            <div class="waiting-text">Share this code with friends!</div>
            <div id="lobby-players"></div>
            <button class="menu-btn start-btn" onclick="startHostedGame()">START GAME</button>
            <button class="menu-btn back-btn" onclick="cancelHost()">CANCEL</button>
        </div>
        
        <div id="guest-waiting" style="display:none;">
            <div class="room-code-display">ROOM: <span id="joined-room-code">----</span></div>
            <div id="guest-lobby-players"></div>
            <button class="menu-btn ready-btn" id="ready-btn" onclick="sendReady()">READY</button>
            <div id="waiting-for-host" class="waiting-text" style="display:none;">Waiting for host to start...</div>
            <button class="menu-btn back-btn" onclick="leaveRoom()">LEAVE</button>
        </div>
        
        <div id="connection-status">Connecting to server...</div>
    </div>
    
    <div id="hud" class="ui" style="display:none;">
        <div class="hud-label">HP</div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <div class="hud-label">WAVE</div>
        <div class="hud-value" id="wave">0</div>
        <div class="hud-label">TEAM SCORE</div>
        <div class="hud-value" id="score">0</div>
    </div>
    
    <div id="players-list" class="ui" style="display:none;">
        <h3>PLAYERS</h3>
        <div id="player-entries"></div>
    </div>
    
    <div id="boss-container">
        <div id="boss-name">BOSS</div>
        <div id="boss-bar"><div id="boss-hp"></div></div>
    </div>
    
    <div id="weapons" style="display:none;">
        <div class="weapon-slot active" id="w-plazmer">PLAZMER</div>
        <div class="weapon-slot locked" id="w-homing">HOMING</div>
        <div class="weapon-slot locked" id="w-laser">LASER</div>
        <div class="weapon-slot locked" id="w-thunder">THUNDER</div>
        <div class="weapon-slot locked" id="w-allrange">ALL-RANGE</div>
    </div>
    
    <div id="formation-display" style="display:none;">FORMATION: FOLLOW</div>
    
    <div id="joystick-zone">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>
    <div id="mobile-buttons">
        <div class="mobile-btn" id="btn-dash">DASH</div>
        <div class="mobile-btn" id="btn-form">FORM</div>
    </div>
    
    <div id="game-over">
        <h2>GAME OVER</h2>
        <div id="final-score">SCORE: 0</div>
        <div id="final-wave">WAVE: 0</div>
        <button class="menu-btn" onclick="location.reload()">RETRY</button>
    </div>
    
    <div id="message"></div>

<script>
// ========== 定数 ==========
const WORLD_W = 3000, WORLD_H = 3000;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ========== グローバル変数 ==========
let socket = null;
let myPlayerId = null;
let myPlayer = null;
let gameState = null;
let walls = [];
let localBullets = [];
let localMissiles = [];
let activeLaser = null;
let particles = [];
let texts = [];
let frame = 0;

// 補間用データ
let remotePlayers = new Map(); // 他プレイヤーの補間データ
let remoteEnemies = new Map(); // 敵の補間データ
let damageTexts = []; // ダメージ数字表示用
let localOptions = []; // オプション（ビット）の位置データ
let dashTrail = []; // ダッシュの軌跡
let dashParticles = []; // ダッシュ時の光粒子
let optionBeams = []; // オプションビーム
let optionFormation = 'FOLLOW'; // FOLLOW or HUNT
let huntTarget = null; // HUNTモードのターゲット
let huntLockOnTimer = 0; // ロックオン演出タイマー
let huntAttacking = false; // 攻撃中フラグ
const FORMATIONS = ['FOLLOW', 'HUNT'];

// 入力
let input = { x: 0, y: 0, angle: 0, moving: false, dash: false, hasMoved: false };
let joystick = { active: false, dx: 0, dy: 0, centerX: 0, centerY: 0 };

// カメラ
let camera = { x: 0, y: 0 };
let screenShake = { x: 0, y: 0, intensity: 0 };

// UI要素
const ui = {
    startScreen: document.getElementById('start-screen'),
    gameOver: document.getElementById('game-over'),
    hud: document.getElementById('hud'),
    playersList: document.getElementById('players-list'),
    weapons: document.getElementById('weapons'),
    formationDisplay: document.getElementById('formation-display'),
    hp: document.getElementById('hp-fill'),
    wave: document.getElementById('wave'),
    score: document.getElementById('score'),
    bossContainer: document.getElementById('boss-container'),
    bossName: document.getElementById('boss-name'),
    bossHp: document.getElementById('boss-hp'),
    message: document.getElementById('message'),
    connectionStatus: document.getElementById('connection-status'),
    weaponSlots: {
        plazmer: document.getElementById('w-plazmer'),
        homing: document.getElementById('w-homing'),
        laser: document.getElementById('w-laser'),
        thunder: document.getElementById('w-thunder'),
        allrange: document.getElementById('w-allrange')
    }
};

// ========== ユーティリティ関数 ==========
function checkWall(x, y, wallList) {
    if (!wallList) wallList = walls;
    for (const w of wallList) {
        if (w.type === 'cell') {
            if (Math.hypot(x - w.cx, y - w.cy) < w.radius + 8) return true;
        } else {
            if (x > w.x - 8 && x < w.x + w.w + 8 && y > w.y - 8 && y < w.y + w.h + 8) return true;
        }
    }
    return false;
}

function getWallNormal(x, y) {
    for (const w of walls) {
        if (w.type === 'cell') {
            const dx = x - w.cx, dy = y - w.cy;
            if (Math.hypot(dx, dy) < w.radius + 10) {
                const len = Math.hypot(dx, dy);
                return { x: dx / len, y: dy / len };
            }
        } else {
            if (x > w.x - 10 && x < w.x + w.w + 10 && y > w.y - 10 && y < w.y + w.h + 10) {
                const cx = w.x + w.w / 2, cy = w.y + w.h / 2;
                const dx = x - cx, dy = y - cy;
                if (Math.abs(dx) / w.w > Math.abs(dy) / w.h) return { x: dx > 0 ? 1 : -1, y: 0 };
                else return { x: 0, y: dy > 0 ? 1 : -1 };
            }
        }
    }
    return null;
}

function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function createParticle(x, y, color) {
    particles.push({
        x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
        color: color || '#fff', life: 30, size: 3 + Math.random() * 3,
        update() { this.x += this.vx; this.y += this.vy; this.vx *= 0.95; this.vy *= 0.95; this.life--; this.size *= 0.95; }
    });
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) createParticle(x, y, color);
}

function updateCamera() {
    if (!myPlayer) return;
    const targetX = myPlayer.x - canvas.width / 2;
    const targetY = myPlayer.y - canvas.height / 2;
    camera.x += (targetX - camera.x) * 0.1;
    camera.y += (targetY - camera.y) * 0.1;
    camera.x = Math.max(0, Math.min(WORLD_W - canvas.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H - canvas.height, camera.y));
}

function triggerScreenShake(intensity) { 
    screenShake.intensity = Math.min(screenShake.intensity + intensity * 0.2, 8); 
}

function updateScreenShake() {
    if (screenShake.intensity > 0.1) {
        screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.intensity *= 0.85;
    } else { 
        screenShake.x = 0; 
        screenShake.y = 0; 
        screenShake.intensity = 0;
    }
}

function updateInterpolation() {
    const lerpFactor = 0.35;
    remotePlayers.forEach(rp => {
        rp.x += (rp.targetX - rp.x) * lerpFactor;
        rp.y += (rp.targetY - rp.y) * lerpFactor;
        let angleDiff = rp.targetAngle - rp.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        rp.angle += angleDiff * lerpFactor;
    });
    remoteEnemies.forEach(re => {
        re.x += (re.targetX - re.x) * lerpFactor;
        re.y += (re.targetY - re.y) * lerpFactor;
    });
    damageTexts.forEach(dt => {
        dt.y -= 1.5;
        dt.life--;
        dt.alpha = dt.life / 40;
    });
    damageTexts = damageTexts.filter(dt => dt.life > 0);
}

function spawnDamageText(x, y, damage, color) {
    damageTexts.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y - 10,
        damage: damage,
        color: color || '#ff0',
        life: 40,
        alpha: 1
    });
}

function updateOptions() {
    if (!myPlayer || !myPlayer.options || !myPlayer.alive) return;
    const optionCount = myPlayer.options.length;
    if (optionCount === 0) return;

    while (localOptions.length < optionCount) {
        const i = localOptions.length;
        localOptions.push({
            x: myPlayer.x,
            y: myPlayer.y,
            targetX: myPlayer.x,
            targetY: myPlayer.y,
            baseAngle: (Math.PI / 2) * i
        });
    }
    while (localOptions.length > optionCount) {
        localOptions.pop();
    }

    const radius = 60;

    if (optionFormation === 'FOLLOW') {
        const positions = [
            { angle: -Math.PI / 2 },
            { angle: Math.PI / 2 },
            { angle: Math.PI },
            { angle: 0 },
            { angle: -Math.PI * 3/4 },
            { angle: -Math.PI / 4 }
        ];

        for (let i = 0; i < localOptions.length; i++) {
            const opt = localOptions[i];
            const pos = positions[i % positions.length];
            opt.targetX = myPlayer.x + Math.cos(pos.angle) * radius;
            opt.targetY = myPlayer.y + Math.sin(pos.angle) * radius;
            opt.x += (opt.targetX - opt.x) * 0.12;
            opt.y += (opt.targetY - opt.y) * 0.12;
        }

        huntTarget = null;
        huntLockOnTimer = 0;
        huntAttacking = false;

    } else if (optionFormation === 'HUNT') {
        if (!huntAttacking && !huntTarget) {
            let bestTarget = null;
            let maxHp = 0;
            if (gameState && gameState.enemies) {
                gameState.enemies.forEach(e => {
                    if (e.hp > 0 && e.hp > maxHp) {
                        const re = remoteEnemies.get(e.id);
                        const ex = re ? re.x : e.x;
                        const ey = re ? re.y : e.y;
                        const dist = Math.hypot(ex - myPlayer.x, ey - myPlayer.y);
                        if (dist < 600) {
                            maxHp = e.hp;
                            bestTarget = { id: e.id, x: ex, y: ey, hp: e.hp, maxHp: e.maxHp, size: e.size };
                        }
                    }
                });
            }
            if (bestTarget) {
                huntTarget = bestTarget;
                huntLockOnTimer = 60;
            }
        }

        if (huntTarget && huntLockOnTimer > 0) {
            huntLockOnTimer--;

            if (gameState && gameState.enemies) {
                const enemy = gameState.enemies.find(e => e.id === huntTarget.id);
                if (enemy && enemy.hp > 0) {
                    const re = remoteEnemies.get(enemy.id);
                    huntTarget.x = re ? re.x : enemy.x;
                    huntTarget.y = re ? re.y : enemy.y;
                    huntTarget.hp = enemy.hp;
                } else {
                    huntTarget = null;
                }
            }

            if (huntLockOnTimer === 0 && huntTarget) {
                huntAttacking = true;
            }

        } else if (huntAttacking && huntTarget) {
            if (gameState && gameState.enemies) {
                const enemy = gameState.enemies.find(e => e.id === huntTarget.id);
                if (enemy && enemy.hp > 0) {
                    const re = remoteEnemies.get(enemy.id);
                    huntTarget.x = re ? re.x : enemy.x;
                    huntTarget.y = re ? re.y : enemy.y;
                    huntTarget.hp = enemy.hp;
                } else {
                    huntTarget = null;
                    huntAttacking = false;
                    setTimeout(() => {
                        if (optionFormation === 'HUNT') {
                        }
                    }, 500);
                }
            }

            if (huntTarget) {
                for (let i = 0; i < localOptions.length; i++) {
                    const opt = localOptions[i];
                    const attackAngle = (Math.PI * 2 / localOptions.length) * i;
                    const attackRadius = huntTarget.size + 20;
                    opt.targetX = huntTarget.x + Math.cos(attackAngle) * attackRadius;
                    opt.targetY = huntTarget.y + Math.sin(attackAngle) * attackRadius;
                    opt.x += (opt.targetX - opt.x) * 0.25;
                    opt.y += (opt.targetY - opt.y) * 0.25;
                }
            }

        } else {
            const positions = [
                { angle: -Math.PI / 2 },
                { angle: Math.PI / 2 },
                { angle: Math.PI },
                { angle: 0 },
                { angle: -Math.PI * 3/4 },
                { angle: -Math.PI / 4 }
            ];

            for (let i = 0; i < localOptions.length; i++) {
                const opt = localOptions[i];
                const pos = positions[i % positions.length];
                opt.targetX = myPlayer.x + Math.cos(pos.angle) * radius;
                opt.targetY = myPlayer.y + Math.sin(pos.angle) * radius;
                opt.x += (opt.targetX - opt.x) * 0.1;
                opt.y += (opt.targetY - opt.y) * 0.1;
            }
        }
    }
}

function drawOptions() {
    if (!myPlayer || !myPlayer.alive) return;

    const glowColor = myPlayer.glowColor || '#0ff';

    if (optionFormation === 'HUNT' && huntTarget && huntLockOnTimer > 0) {
        const tx = huntTarget.x - camera.x + screenShake.x;
        const ty = huntTarget.y - camera.y + screenShake.y;
        const progress = 1 - (huntLockOnTimer / 60);

        ctx.save();

        const lockRadius = 80 * (1 - progress) + 30;
        ctx.strokeStyle = '#f00';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#f00';
        ctx.globalAlpha = 0.8;

        ctx.beginPath();
        ctx.arc(tx, ty, lockRadius, 0, Math.PI * 2);
        ctx.stroke();

        const rotAngle = frame * 0.1;
        for (let i = 0; i < 4; i++) {
            const a = rotAngle + (Math.PI / 2) * i;
            ctx.beginPath();
            ctx.moveTo(tx + Math.cos(a) * (lockRadius - 10), ty + Math.sin(a) * (lockRadius - 10));
            ctx.lineTo(tx + Math.cos(a) * (lockRadius + 15), ty + Math.sin(a) * (lockRadius + 15));
            ctx.stroke();
        }

        if (progress > 0.5) {
            ctx.globalAlpha = (progress - 0.5) * 2;
            ctx.beginPath();
            ctx.moveTo(tx - 20, ty);
            ctx.lineTo(tx + 20, ty);
            ctx.moveTo(tx, ty - 20);
            ctx.lineTo(tx, ty + 20);
            ctx.stroke();

            ctx.fillStyle = '#f00';
            ctx.font = 'bold 14px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('LOCK ON', tx, ty - lockRadius - 10);
        }

        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Courier New';
        ctx.fillText(`HP: ${huntTarget.hp}/${huntTarget.maxHp}`, tx, ty + lockRadius + 20);

        ctx.restore();
    }

    if (huntAttacking && huntTarget) {
        ctx.save();
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.5;
        ctx.shadowBlur = 10;
        ctx.shadowColor = glowColor;

        localOptions.forEach(opt => {
            const sx = opt.x - camera.x + screenShake.x;
            const sy = opt.y - camera.y + screenShake.y;
            const tx = huntTarget.x - camera.x + screenShake.x;
            const ty = huntTarget.y - camera.y + screenShake.y;

            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(tx, ty);
            ctx.stroke();
        });

        ctx.restore();
    }

    localOptions.forEach((opt, i) => {
        const sx = opt.x - camera.x + screenShake.x;
        const sy = opt.y - camera.y + screenShake.y;

        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = glowColor;

        const currentColor = huntAttacking ? '#f44' : glowColor;

        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx, sy, 10, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = currentColor;
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fill();

        if (huntAttacking) {
            ctx.globalAlpha = 0.3;
            for (let t = 1; t <= 5; t++) {
                const trailX = sx - (opt.x - opt.targetX) * 0.1 * t;
                const trailY = sy - (opt.y - opt.targetY) * 0.1 * t;
                ctx.fillStyle = currentColor;
                ctx.beginPath();
                ctx.arc(trailX, trailY, 5 - t, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        ctx.restore();
    });

    if (localOptions.length > 0) {
        ctx.save();
        ctx.fillStyle = optionFormation === 'HUNT' ? '#f44' : '#0ff';
        ctx.font = 'bold 10px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText(`FORMATION: ${optionFormation}`, 10, canvas.height - 60);
        ctx.restore();
    }
}

function updateDashTrail() {
    if (!myPlayer) return;

    if (myPlayer.dashing && myPlayer.alive) {
        dashTrail.unshift({
            x: myPlayer.x,
            y: myPlayer.y,
            angle: myPlayer.angle,
            life: 30,
            maxLife: 30,
            color: myPlayer.glowColor || '#0ff'
        });

        for (let i = 0; i < 8; i++) {
            const spreadAngle = myPlayer.angle + Math.PI + (Math.random() - 0.5) * 1.2;
            const speed = 3 + Math.random() * 8;
            dashParticles.push({
                x: myPlayer.x + (Math.random() - 0.5) * 20,
                y: myPlayer.y + (Math.random() - 0.5) * 20,
                vx: Math.cos(spreadAngle) * speed,
                vy: Math.sin(spreadAngle) * speed,
                size: 1 + Math.random() * 4,
                life: 20 + Math.random() * 15,
                maxLife: 35,
                color: Math.random() > 0.4 ? '#fff' : (myPlayer.glowColor || '#0ff'),
                type: 'star'
            });
        }

        if (Math.random() > 0.3) {
            dashParticles.push({
                x: myPlayer.x + (Math.random() - 0.5) * 30,
                y: myPlayer.y + (Math.random() - 0.5) * 30,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                size: 2 + Math.random() * 3,
                life: 30 + Math.random() * 20,
                maxLife: 50,
                color: '#fff',
                type: 'sparkle'
            });
        }
    }

    dashTrail.forEach(t => t.life--);
    dashTrail = dashTrail.filter(t => t.life > 0);
    if (dashTrail.length > 50) dashTrail.length = 50;

    dashParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life--;
    });
    dashParticles = dashParticles.filter(p => p.life > 0);
}

function drawDashEffects() {
    if (!myPlayer) return;

    const glowColor = myPlayer.glowColor || '#0ff';
    const playerColor = myPlayer.color || '#fff';

    dashParticles.forEach(p => {
        const sx = p.x - camera.x + screenShake.x;
        const sy = p.y - camera.y + screenShake.y;
        const alpha = p.life / (p.maxLife || 35);
        const size = p.size * alpha;

        ctx.save();
        ctx.globalAlpha = alpha;

        if (p.type === 'sparkle') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            const sparkleSize = size * 2;
            ctx.beginPath();
            ctx.moveTo(sx - sparkleSize, sy);
            ctx.lineTo(sx + sparkleSize, sy);
            ctx.moveTo(sx, sy - sparkleSize);
            ctx.lineTo(sx, sy + sparkleSize);
            ctx.stroke();
        } else {
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(sx, sy, size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    });

    if (dashTrail.length > 2) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.shadowBlur = 50;
        ctx.shadowColor = glowColor;
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = 35;
        ctx.globalAlpha = 0.1;
        ctx.beginPath();
        for (let i = 0; i < dashTrail.length; i++) {
            const t = dashTrail[i];
            const sx = t.x - camera.x + screenShake.x;
            const sy = t.y - camera.y + screenShake.y;
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
        ctx.stroke();

        for (let layer = 0; layer < 3; layer++) {
            const layerWidth = 25 - layer * 8;
            const layerAlpha = 0.15 + layer * 0.1;
            ctx.beginPath();
            ctx.strokeStyle = layer === 2 ? '#fff' : glowColor;
            ctx.lineWidth = layerWidth;
            ctx.globalAlpha = layerAlpha;
            ctx.shadowBlur = 20 - layer * 5;

            for (let i = 0; i < dashTrail.length; i++) {
                const t = dashTrail[i];
                const sx = t.x - camera.x + screenShake.x;
                const sy = t.y - camera.y + screenShake.y;
                if (i === 0) ctx.moveTo(sx, sy);
                else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.globalAlpha = 0.8;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#fff';
        for (let i = 0; i < Math.min(dashTrail.length, 15); i++) {
            const t = dashTrail[i];
            const sx = t.x - camera.x + screenShake.x;
            const sy = t.y - camera.y + screenShake.y;
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
        ctx.stroke();

        ctx.restore();
    }

    dashTrail.forEach((t, idx) => {
        if (idx % 3 !== 0) return;
        const sx = t.x - camera.x + screenShake.x;
        const sy = t.y - camera.y + screenShake.y;
        const lifeRatio = t.life / (t.maxLife || 30);
        const alpha = lifeRatio * 0.5;
        const size = 10 * lifeRatio;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(sx, sy);

        ctx.shadowBlur = 20;
        ctx.shadowColor = glowColor;

        ctx.fillStyle = glowColor;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 / 8) * i;
            const r = size + Math.sin(a * 3) * 2;
            if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
            else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });
}

function updateWeaponUI() {

    if (wl.LASER > 0) { ui.weaponSlots.laser.textContent = `LASER Lv${wl.LASER}`; ui.weaponSlots.laser.classList.remove('locked'); ui.weaponSlots.laser.classList.add('active'); }
    if (wl.THUNDER > 0) { ui.weaponSlots.thunder.textContent = `THUNDER Lv${wl.THUNDER}`; ui.weaponSlots.thunder.classList.remove('locked'); ui.weaponSlots.thunder.classList.add('active'); }
    if (wl.ALLRANGE > 0) { ui.weaponSlots.allrange.textContent = `ALL-RANGE Lv${wl.ALLRANGE}`; ui.weaponSlots.allrange.classList.remove('locked'); ui.weaponSlots.allrange.classList.add('active'); }

function updatePlayersList(players) {
    const container = document.getElementById('player-entries');
    container.innerHTML = '';
    players.forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-entry';
        div.style.color = p.color || '#fff';

        if (!p.alive) div.classList.add('dead');
        const colorDot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};margin-right:5px;box-shadow:0 0 5px ${p.color}"></span>`;
        div.innerHTML = `${colorDot}${p.name}: ${p.score}`;
        container.appendChild(div);
    });
}

function showMessage(text) {
    ui.message.textContent = text;
    ui.message.style.opacity = 1;
    setTimeout(() => { ui.message.style.opacity = 0; }, 2000);
}

function playSound(type) { }

function initMobileControls() {
    const zone = document.getElementById('joystick-zone');
    const stick = document.getElementById('joystick-stick');
    const base = document.getElementById('joystick-base');
    
    zone.addEventListener('touchstart', e => {
        e.preventDefault(); joystick.active = true;
        const rect = base.getBoundingClientRect();
        joystick.centerX = rect.left + rect.width / 2;
        joystick.centerY = rect.top + rect.height / 2;
    });
    
    zone.addEventListener('touchmove', e => {
        e.preventDefault(); if (!joystick.active) return;
        const touch = e.touches[0]; const maxDist = 50;
        let dx = touch.clientX - joystick.centerX, dy = touch.clientY - joystick.centerY;
        const dist = Math.hypot(dx, dy);
        if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
        joystick.dx = dx / maxDist; joystick.dy = dy / maxDist;
        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    });
    
    zone.addEventListener('touchend', e => {
        e.preventDefault(); joystick.active = false; joystick.dx = 0; joystick.dy = 0;
        stick.style.transform = 'translate(-50%, -50%)';
    });
    
    document.getElementById('btn-dash').addEventListener('touchstart', e => { e.preventDefault(); triggerDash(); });
    document.getElementById('btn-form').addEventListener('touchstart', e => { e.preventDefault(); cycleFormation(); });
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('mousemove', e => {
        input.x = e.clientX;
        input.y = e.clientY;
        input.hasMoved = true;
    });
    
    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0 && myPlayer && myPlayer.alive) {
            cycleFormation();
        }
    });
    
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') triggerDash();
        if (e.code === 'KeyF') cycleFormation();
    });
    
    initMobileControls();
    connectToServer();
    requestAnimationFrame(gameLoop);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function connectToServer() {
    socket = io();
    
    socket.on('connect', () => {
        console.log('Connected to server');
        ui.connectionStatus.textContent = 'Connected!';
        ui.connectionStatus.className = 'connected';
    });
    
    socket.on('hosted', (data) => {
        myPlayerId = data.playerId;
        myPlayer = data.player;
        myPlayer.alive = true;
        walls = data.walls;
        document.getElementById('menu-buttons').style.display = 'none';
        document.getElementById('host-info').style.display = 'block';
        document.getElementById('generated-code').textContent = data.roomId;
        updateLobbyPlayers(data.players, 'lobby-players');
    });
    
    socket.on('joinError', (data) => { alert(data.message); });
    
    socket.on('playerJoined', (data) => {
        if (document.getElementById('host-info').style.display === 'block') updateLobbyPlayers(data.players, 'lobby-players');
        if (document.getElementById('guest-waiting').style.display === 'block') updateLobbyPlayers(data.players, 'guest-lobby-players');
    });
    
    socket.on('playerReadyUpdate', (data) => {
        if (document.getElementById('host-info').style.display === 'block') updateLobbyPlayers(data.players, 'lobby-players');
        if (document.getElementById('guest-waiting').style.display === 'block') updateLobbyPlayers(data.players, 'guest-lobby-players');
    });
    
    socket.on('gameStarted', (data) => {
        ui.startScreen.style.display = 'none';
        ui.hud.style.display = 'block';
        ui.playersList.style.display = 'block';
        ui.weapons.style.display = 'flex';
        ui.formationDisplay.style.display = 'block';
        if (data.players) {
            const me = data.players.find(p => p.id === myPlayerId);
            if (me) myPlayer = me;
        }
        updateWeaponUI();
        showMessage('◆ GAME START ◆');
    });
    
    socket.on('gameStart', () => { showMessage('◆ GET READY ◆'); });
    
    socket.on('joined', (data) => {
        myPlayerId = data.playerId;
        myPlayer = data.player;
        myPlayer.alive = true;
        walls = data.walls;
        if (data.isGuest && data.state === 'waiting') {
            document.getElementById('menu-buttons').style.display = 'none';
            document.getElementById('join-form').style.display = 'none';
            document.getElementById('guest-waiting').style.display = 'block';
            document.getElementById('joined-room-code').textContent = data.roomId;
            updateLobbyPlayers(data.players, 'guest-lobby-players');
            return;
        }
        ui.startScreen.style.display = 'none';
        ui.hud.style.display = 'block';
        ui.playersList.style.display = 'block';
        ui.weapons.style.display = 'flex';
        ui.formationDisplay.style.display = 'block';
        updateWeaponUI();
        if (data.state === 'playing') showMessage('JOIN THE BATTLE!');
    });
    
    socket.on('respawned', (data) => {
        if (myPlayer) {
            myPlayer.x = data.x; myPlayer.y = data.y; myPlayer.hp = data.hp; myPlayer.alive = true;
            ui.hp.style.width = '100%';
            if (data.weaponLevels) {
                myPlayer.weaponLevels = data.weaponLevels;
                updateWeaponUI();
            }
            if (data.options !== undefined) {
                myPlayer.options = new Array(data.options).fill({});
                while (localOptions.length > data.options) {
                    localOptions.pop();
                }
            }
            optionFormation = 'FOLLOW';
            huntTarget = null;
            huntAttacking = false;
        }
        showMessage('RESPAWN! (Weapons halved)');
    });
    
    socket.on('playerRespawned', (data) => {
        if (data.playerId !== myPlayerId) showMessage(`${data.name} RESPAWNED`);
    });
    
    socket.on('hostCancelled', () => { alert('Host cancelled the game.'); location.reload(); });
    socket.on('playerLeft', () => { showMessage('A player left'); });
    socket.on('waveStart', (data) => { walls = data.walls; showMessage(`◆ WAVE ${data.wave} ◆`); });
    socket.on('bossSpawn', (data) => { showMessage(`◆ ${data.boss.name} APPEARED ◆`); triggerScreenShake(5); });
    socket.on('bossDefeated', () => { showMessage('◆ PATHOGEN ELIMINATED ◆'); triggerScreenShake(8); });
    socket.on('enemyDefeated', (data) => { playSound(data.isBoss ? 'bossDefeat' : 'enemyDefeat'); });
    
    socket.on('playerDamaged', (data) => {
        if (myPlayer) { myPlayer.hp = data.hp; ui.hp.style.width = Math.max(0, (myPlayer.hp / (myPlayer.maxHp || 100)) * 100) + '%'; }
        triggerScreenShake(3);
    });
    
    socket.on('playerDied', (data) => {
        if (data.playerId === myPlayerId) showMessage('YOU DIED'); else showMessage(`${data.name} DIED`);
    });
    
    socket.on('itemCollected', (data) => {
        if (myPlayer) {
            myPlayer.weaponLevels = data.weaponLevels;
            myPlayer.hp = data.hp;
            myPlayer.options = new Array(data.options).fill({});
            ui.hp.style.width = (myPlayer.hp / (myPlayer.maxHp || 100)) * 100 + '%';
            updateWeaponUI();
        }
        playSound('powerup');
    });
    
    socket.on('gameState', (state) => {
        gameState = state;
        
        const me = state.players.find(p => p.id === myPlayerId);
        if (me && myPlayer) {
            myPlayer.hp = me.hp;
            myPlayer.maxHp = me.maxHp;
            myPlayer.invincible = me.invincible;
            myPlayer.dashing = me.dashing;
            myPlayer.alive = me.alive;
            myPlayer.weaponLevels = me.weaponLevels;
            myPlayer.thunderEnergy = me.thunderEnergy;
            myPlayer.options = me.options;
            myPlayer.score = me.score;
            myPlayer.respawnTimer = me.respawnTimer;
            if (!me.alive || me.invincible > 170) {
                myPlayer.x = me.x;
                myPlayer.y = me.y;
            }
        }
        
        state.players.forEach(p => {
            if (p.id !== myPlayerId) {
                const existing = remotePlayers.get(p.id);
                if (existing) {
                    existing.targetX = p.x;
                    existing.targetY = p.y;
                    existing.targetAngle = p.angle;
                    existing.data = p;
                } else {
                    remotePlayers.set(p.id, {
                        x: p.x, y: p.y, angle: p.angle,
                        targetX: p.x, targetY: p.y, targetAngle: p.angle,
                        data: p
                    });
                }
            }
        });
        
        const playerIds = new Set(state.players.map(p => p.id));
        remotePlayers.forEach((_, id) => {
            if (!playerIds.has(id)) remotePlayers.delete(id);
        });
        
        state.enemies.forEach(e => {
            const existing = remoteEnemies.get(e.id);
            if (existing) {
                existing.targetX = e.x;
                existing.targetY = e.y;
                existing.data = e;
            } else {
                remoteEnemies.set(e.id, {
                    x: e.x, y: e.y,
                    targetX: e.x, targetY: e.y,
                    data: e
                });
            }
        });
        
        const enemyIds = new Set(state.enemies.map(e => e.id));
        remoteEnemies.forEach((_, id) => {
            if (!enemyIds.has(id)) remoteEnemies.delete(id);
        });
        
        ui.wave.textContent = state.wave;
        ui.score.textContent = state.score;
        const bosses = state.enemies.filter(e => e.isBoss);
        if (bosses.length > 0) {
            ui.bossContainer.style.display = 'block';
            let totalHp = 0, totalMaxHp = 0;
            bosses.forEach(b => { totalHp += b.hp; totalMaxHp += b.maxHp; });
            ui.bossHp.style.width = (totalHp / totalMaxHp * 100) + '%';
            ui.bossName.textContent = `BOSS DANGER x${bosses.length}`;
        } else { ui.bossContainer.style.display = 'none'; }
        updatePlayersList(state.players);
    });
    
    socket.on('gameOver', (data) => {
        ui.gameOver.style.display = 'flex';
        document.getElementById('final-score').textContent = `SCORE: ${data.score}`;
        document.getElementById('final-wave').textContent = `WAVE: ${data.wave}`;
        playSound('gameOver');
    });

    socket.on('remoteFire', (data) => {
        if(data.playerId !== myPlayerId) spawnRemoteBullets(data);
    });
    
    socket.on('enemyHit', (data) => {
        const re = remoteEnemies.get(data.enemyId);
        if (re) {
            spawnDamageText(re.x, re.y, data.damage, '#ff0');
        }
    });
    
    socket.on('enemyDefeated', (data) => {
        const re = remoteEnemies.get(data.enemyId);
        if (re) {
            createParticles(re.x, re.y, '#f80', 15);
        }
    });
}

function spawnRemoteBullets(data) {
    if (!gameState) return;
    const shooter = gameState.players.find(p => p.id === data.playerId);
    if (!shooter) return;

    if (data.type === 'PLAZMER') {
        const lv = shooter.weaponLevels ? shooter.weaponLevels.PLAZMER : 1;
        const count = 1 + Math.floor(lv / 1.5);
        const maxSpread = Math.min(Math.PI * 2, lv * (Math.PI / 10));
        for (let i = 0; i < count; i++) {
            let angleOffset = 0;
            if (count > 1) {
                const range = maxSpread * (i / (count - 1)) - (maxSpread / 2);
                if (maxSpread >= Math.PI * 2 - 0.1) angleOffset = (Math.PI * 2 / count) * i;
                else angleOffset = range;
            }
            localBullets.push(new PlazmerBullet({
                x: shooter.x, y: shooter.y,
                angle: data.angle + angleOffset,
                color: shooter.color || '#0ff',
                damage: 0
            }, null));
        }
    } else if (data.type === 'HOMING') {
        const lv = shooter.weaponLevels ? shooter.weaponLevels.HOMING : 1;
        const missileCount = 4 + lv * 2;
        for (let i = 0; i < missileCount; i++) {
            const spreadAngle = data.angle + (Math.random() - 0.5) * Math.PI;
            const speed = 5 + Math.random() * 8;
            localMissiles.push(new MacrossMissile({
                x: shooter.x, y: shooter.y,
                vx: Math.cos(spreadAngle) * speed, vy: Math.sin(spreadAngle) * speed,
                color: shooter.color || '#0af',
                damage: 0
            }));
        }
    } else if (data.type === 'THUNDER') {
        let target = null;
        if(gameState.enemies.length > 0) target = gameState.enemies[0];
        localBullets.push(new ThunderBolt({
            x: shooter.x, y: shooter.y, target: target, angle: data.angle, damage: 0
        }, null));
    }
}

function joinGame() {
    const name = document.getElementById('player-name').value || 'Player';
    const roomId = document.getElementById('room-id').value;
    if (!roomId || roomId.length !== 4) { alert('Please enter a 4-digit room code!'); return; }
    socket.emit('joinRoom', { name, roomId });
}
function hostGame() { const name = document.getElementById('player-name').value || 'Host'; socket.emit('hostRoom', { name }); }
function showJoinForm() { document.getElementById('menu-buttons').style.display = 'none'; document.getElementById('join-form').style.display = 'block'; }
function showMainMenu() {
    document.getElementById('menu-buttons').style.display = 'block'; document.getElementById('join-form').style.display = 'none';
    document.getElementById('host-info').style.display = 'none'; document.getElementById('guest-waiting').style.display = 'none';
}
function cancelHost() { socket.emit('cancelHost'); location.reload(); }
function leaveRoom() { location.reload(); }
function startHostedGame() { socket.emit('startGame'); }
function sendReady() {
    socket.emit('playerReady');
    document.getElementById('ready-btn').textContent = 'READY!';
    document.getElementById('ready-btn').classList.add('ready-sent');
    document.getElementById('waiting-for-host').style.display = 'block';
}
function updateLobbyPlayers(players, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    players.forEach(p => {
        const div = document.createElement('div'); div.className = 'lobby-player'; div.style.color = p.color;
        const colorDot = `<span class="player-color" style="background:${p.color};"></span>`;
        const status = p.isHost ? '<span class="player-status host">HOST</span>' : (p.ready ? '<span class="player-status ready">READY</span>' : '<span class="player-status waiting">WAITING</span>');
        div.innerHTML = `${colorDot}<span class="player-name">${p.name}</span>${status}`;
        container.appendChild(div);
    });
}

let lastInputTime = 0;
const INPUT_RATE = 1000 / 30;

function updateInput() {
    if (!myPlayer || !myPlayer.alive) return;
    let moving = false;
    let angle = myPlayer.angle;
    if (joystick.active && (Math.abs(joystick.dx) > 0.1 || Math.abs(joystick.dy) > 0.1)) {
        angle = Math.atan2(joystick.dy, joystick.dx); moving = true;
    } else if (input.hasMoved) {
        const mx = input.x + camera.x; const my = input.y + camera.y;
        angle = Math.atan2(my - myPlayer.y, mx - myPlayer.x);
        if (Math.hypot(mx - myPlayer.x, my - myPlayer.y) > 20) moving = true;
    }
    
    if (myPlayer.dashing) {
        const dashSpeed = 35;
        const vx = Math.cos(myPlayer.angle) * dashSpeed;
        const vy = Math.sin(myPlayer.angle) * dashSpeed;
        myPlayer.x += vx;
        myPlayer.y += vy;
        myPlayer.x = Math.max(60, Math.min(WORLD_W - 60, myPlayer.x));
        myPlayer.y = Math.max(60, Math.min(WORLD_H - 60, myPlayer.y));
    } else if (moving) {
        const speed = myPlayer.speed || 6;
        const vx = Math.cos(angle) * speed; const vy = Math.sin(angle) * speed;
        if (!checkWall(myPlayer.x + vx, myPlayer.y, walls)) myPlayer.x += vx;
        if (!checkWall(myPlayer.x, myPlayer.y + vy, walls)) myPlayer.y += vy;
        myPlayer.x = Math.max(60, Math.min(WORLD_W - 60, myPlayer.x));
        myPlayer.y = Math.max(60, Math.min(WORLD_H - 60, myPlayer.y));
    }
    myPlayer.angle = angle;
    
    const now = Date.now();
    if (now - lastInputTime >= INPUT_RATE) {
        socket.emit('input', { angle: angle, moving: moving, dash: input.dash, x: myPlayer.x, y: myPlayer.y });
        lastInputTime = now;
    }
    input.dash = false;
}

function triggerDash() { 
    input.dash = true; 
    playSound('dash'); 
    
    if (myPlayer && myPlayer.alive) {
        const glowColor = myPlayer.glowColor || '#0ff';
        
        for (let i = 0; i < 30; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 4 + Math.random() * 10;
            dashParticles.push({
                x: myPlayer.x,
                y: myPlayer.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: 2 + Math.random() * 5,
                life: 25 + Math.random() * 20,
                maxLife: 45,
                color: Math.random() > 0.4 ? '#fff' : glowColor,
                type: 'star'
            });
        }
        
        for (let i = 0; i < 15; i++) {
            const spreadAngle = myPlayer.angle + (Math.random() - 0.5) * 0.5;
            const speed = 8 + Math.random() * 12;
            dashParticles.push({
                x: myPlayer.x,
                y: myPlayer.y,
                vx: Math.cos(spreadAngle) * speed,
                vy: Math.sin(spreadAngle) * speed,
                size: 1 + Math.random() * 3,
                life: 15 + Math.random() * 10,
                maxLife: 25,
                color: '#fff',
                type: 'star'
            });
        }
        
        for (let i = 0; i < 8; i++) {
            dashParticles.push({
                x: myPlayer.x + (Math.random() - 0.5) * 40,
                y: myPlayer.y + (Math.random() - 0.5) * 40,
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3,
                size: 3 + Math.random() * 4,
                life: 40 + Math.random() * 20,
                maxLife: 60,
                color: '#fff',
                type: 'sparkle'
            });
        }
        
        triggerScreenShake(8);
    }
}
function cycleFormation() {
    if (localOptions.length > 0) {
        optionFormation = optionFormation === 'FOLLOW' ? 'HUNT' : 'FOLLOW';
        huntTarget = null;
        huntLockOnTimer = 0;
        huntAttacking = false;
        showMessage(`FORMATION: ${optionFormation}`);
        playSound('switch');
    }
}

function fireWeapons() {
    if (!myPlayer || !myPlayer.alive) return;
    if (!myPlayer.weaponLevels) {
        myPlayer.weaponLevels = { PLAZMER: 1, HOMING: 0, LASER: 0, THUNDER: 0, ALLRANGE: 0 };
    }
    const hits = []; 
    socket.emit('fire', { type: 'PLAZMER', angle: myPlayer.angle, options: myPlayer.options ? myPlayer.options.length : 0 });
    firePlazmer(hits);
    if (myPlayer.weaponLevels.HOMING > 0) { fireHoming(); socket.emit('fire', { type: 'HOMING', angle: myPlayer.angle }); }
    if (myPlayer.weaponLevels.LASER > 0 && !activeLaser) fireLaser();
    if (myPlayer.weaponLevels.THUNDER > 0 && (myPlayer.thunderEnergy || 0) >= 180) {
        fireThunder(hits); myPlayer.thunderEnergy = 0; socket.emit('fire', { type: 'THUNDER', angle: myPlayer.angle });
    }
    playSound('shoot');
}
