<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLAZMER - INNER SPACE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000810; 
            overflow: hidden; 
            font-family: 'Courier New', monospace;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #canvas { display: block; background: #000810; }
        
        /* UI共通 */
        .ui { position: fixed; color: #0ff; font-size: 14px; text-shadow: 0 0 10px #0ff; z-index: 100; }
        
        /* スタート画面 */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #001020 0%, #000810 100%);
            z-index: 200;
        }
        #start-screen h1 {
            font-size: 60px; color: #0ff; text-shadow: 0 0 30px #0ff, 0 0 60px #08f;
            letter-spacing: 15px; margin-bottom: 10px;
        }
        #start-screen .subtitle {
            font-size: 16px; color: #f08; margin-bottom: 40px;
            text-shadow: 0 0 10px #f08; letter-spacing: 5px;
        }
        .menu-btn {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 15px 50px; margin: 10px; font-size: 18px; cursor: pointer;
            font-family: 'Courier New', monospace; letter-spacing: 3px;
            transition: all 0.3s; text-shadow: 0 0 10px #0ff;
        }
        .menu-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; }
        .name-input {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 10px 20px; font-size: 16px; text-align: center;
            font-family: 'Courier New', monospace; margin-bottom: 20px; width: 200px;
        }
        .name-input::placeholder { color: #088; }
        
        /* HUD */
        #hud { position: fixed; top: 10px; left: 10px; }
        #hud-right { position: fixed; top: 10px; right: 10px; text-align: right; }
        .hud-label { font-size: 10px; color: #088; margin-bottom: 2px; }
        .hud-value { font-size: 20px; color: #0ff; margin-bottom: 10px; }
        #hp-bar { width: 150px; height: 8px; background: #001; border: 1px solid #0ff; margin-bottom: 10px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0, #0f0); transition: width 0.2s; }
        
        /* ボスHP */
        #boss-container {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            width: 400px; max-width: 80%; display: none; text-align: center;
        }
        #boss-name { font-size: 14px; color: #f00; margin-bottom: 5px; text-shadow: 0 0 10px #f00; }
        #boss-bar { width: 100%; height: 12px; background: #200; border: 1px solid #f00; }
        #boss-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.3s; }
        
        /* 武器表示 */
        #weapons {
            position: fixed; bottom: 10px; left: 10px;
            display: flex; gap: 8px; flex-wrap: wrap; max-width: 300px;
        }
        .weapon-slot {
            padding: 5px 10px; border: 1px solid #444; background: #001;
            font-size: 10px; color: #888; transition: all 0.3s;
        }
        .weapon-slot.active { border-color: #0ff; color: #0ff; box-shadow: 0 0 10px #0ff; }
        .weapon-slot.locked { opacity: 0.3; }
        
        /* モバイルコントロール */
        #joystick-zone {
            position: fixed; bottom: 20px; left: 20px;
            width: 130px; height: 130px; display: none;
        }
        #joystick-base {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(0,255,255,0.1); border: 2px solid rgba(0,255,255,0.3);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.4); border: 2px solid #0ff;
        }
        #mobile-buttons {
            position: fixed; bottom: 20px; right: 20px;
            display: none; gap: 10px;
        }
        .mobile-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(0,255,255,0.2); border: 2px solid #0ff;
            color: #0ff; font-size: 12px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .mobile-btn:active { background: rgba(0,255,255,0.5); }
        
        /* ゲームオーバー */
        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 300;
        }
        #game-over h2 { font-size: 48px; color: #f00; margin-bottom: 20px; text-shadow: 0 0 30px #f00; }
        #final-score { font-size: 24px; color: #0ff; margin-bottom: 30px; }
        
        /* メッセージ */
        #message {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: #0ff; text-shadow: 0 0 20px #0ff;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 150;
        }
        
        /* レスポンシブ */
        @media (max-width: 768px) {
            #start-screen h1 { font-size: 36px; letter-spacing: 8px; }
            .menu-btn { padding: 12px 30px; font-size: 14px; }
            #joystick-zone, #mobile-buttons { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <!-- スタート画面 -->
    <div id="start-screen">
        <h1>PLAZMER</h1>
        <div class="subtitle">◆ INNER SPACE ◆</div>
        <input type="text" id="player-name" class="name-input" placeholder="ENTER NAME" maxlength="12">
        <button class="menu-btn" onclick="startSoloGame()">START</button>
    </div>
    
    <!-- HUD -->
    <div id="hud" class="ui">
        <div class="hud-label">IMMUNE CELL HP</div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <div class="hud-label">WAVE</div>
        <div class="hud-value" id="wave">0</div>
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="score">0</div>
    </div>
    
    <div id="hud-right" class="ui">
        <div class="hud-label">BOMB</div>
        <div class="hud-value" id="bomb">2</div>
    </div>
    
    <!-- ボスHP -->
    <div id="boss-container">
        <div id="boss-name">BOSS</div>
        <div id="boss-bar"><div id="boss-hp"></div></div>
    </div>
    
    <!-- 武器表示 -->
    <div id="weapons">
        <div class="weapon-slot active" id="w-normal">NORMAL</div>
        <div class="weapon-slot locked" id="w-homing">HOMING</div>
        <div class="weapon-slot locked" id="w-laser">LASER</div>
        <div class="weapon-slot locked" id="w-thunder">THUNDER</div>
        <div class="weapon-slot locked" id="w-allrange">ALL-RANGE</div>
    </div>
    
    <!-- モバイルコントロール -->
    <div id="joystick-zone">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>
    <div id="mobile-buttons">
        <div class="mobile-btn" id="btn-dash">DASH</div>
        <div class="mobile-btn" id="btn-bomb">BOMB</div>
    </div>
    
    <!-- ゲームオーバー -->
    <div id="game-over">
        <h2>INFECTION SPREAD</h2>
        <div id="final-score">SCORE: 0</div>
        <button class="menu-btn" onclick="location.reload()">RETRY</button>
    </div>
    
    <!-- メッセージ -->
    <div id="message"></div>

<script>
// ========== 定数 ==========
const WORLD_W = 3000, WORLD_H = 3000;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ========== グローバル変数 ==========
let player = null;
let enemies = [];
let bullets = [];
let enemyBullets = [];
let particles = [];
let texts = [];
let items = [];
let options = []; // ALL-RANGE用
let walls = [];

let wave = 0;
let score = 0;
let frame = 0;
let gameState = 'title';
let currentBoss = null;

// 武器レベル
let weaponLevels = { NORMAL: 1, HOMING: 0, LASER: 0, THUNDER: 0, ALLRANGE: 0 };

// カメラ
let camera = { x: 0, y: 0 };

// 画面揺れ
let screenShake = { x: 0, y: 0, intensity: 0 };

// コンボ
let combo = { count: 0, timer: 0, multiplier: 1 };

// 入力
let input = { x: 0, y: 0, active: false };
let joystick = { active: false, dx: 0, dy: 0 };

// ソロモード用
let soloWaveTimer = 0;
let soloMobTimer = 0;
let enemyIdCounter = 0;

// UI要素
const ui = {
    startScreen: document.getElementById('start-screen'),
    gameOver: document.getElementById('game-over'),
    hp: document.getElementById('hp-fill'),
    wave: document.getElementById('wave'),
    score: document.getElementById('score'),
    bomb: document.getElementById('bomb'),
    bossContainer: document.getElementById('boss-container'),
    bossName: document.getElementById('boss-name'),
    bossHp: document.getElementById('boss-hp'),
    message: document.getElementById('message'),
    weapons: {
        normal: document.getElementById('w-normal'),
        homing: document.getElementById('w-homing'),
        laser: document.getElementById('w-laser'),
        thunder: document.getElementById('w-thunder'),
        allrange: document.getElementById('w-allrange')
    }
};

// ========== 初期化 ==========
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // PC入力
    canvas.addEventListener('mousemove', e => {
        input.x = e.clientX;
        input.y = e.clientY;
    });
    canvas.addEventListener('mousedown', () => input.active = true);
    canvas.addEventListener('mouseup', () => input.active = false);
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') triggerDash();
        if (e.code === 'KeyB') triggerBomb();
    });
    
    // モバイル入力
    initMobileControls();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

// ========== ゲーム開始 ==========
function startSoloGame() {
    const nameInput = document.getElementById('player-name');
    const playerName = nameInput.value || 'IMMUNE-01';
    
    ui.startScreen.style.display = 'none';
    
    player = new Player();
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    texts = [];
    items = [];
    options = [];
    
    weaponLevels = { NORMAL: 1, HOMING: 0, LASER: 0, THUNDER: 0, ALLRANGE: 0 };
    updateWeaponUI();
    
    wave = 0;
    score = 0;
    soloWaveTimer = 0;
    soloMobTimer = 0;
    enemyIdCounter = 0;
    combo = { count: 0, timer: 0, multiplier: 1 };
    
    walls = generateWalls(0);
    
    gameState = 'playing';
    frame = 0;
    
    update();
}

// ========== 壁生成 ==========
function generateWalls(waveNum) {
    const w = [];
    const thickness = 50;
    
    // 外壁（血管壁）
    w.push({ x: 0, y: 0, w: WORLD_W, h: thickness });
    w.push({ x: 0, y: WORLD_H - thickness, w: WORLD_W, h: thickness });
    w.push({ x: 0, y: 0, w: thickness, h: WORLD_H });
    w.push({ x: WORLD_W - thickness, y: 0, w: thickness, h: WORLD_H });
    
    // 内部の障害物（細胞構造）
    const count = 5 + Math.floor(waveNum / 2);
    for (let i = 0; i < count; i++) {
        const size = 60 + Math.random() * 100;
        const x = 200 + Math.random() * (WORLD_W - 400);
        const y = 200 + Math.random() * (WORLD_H - 400);
        
        // プレイヤーの初期位置から離す
        if (Math.hypot(x - WORLD_W/2, y - WORLD_H/2) < 300) continue;
        
        w.push({ x: x - size/2, y: y - size/2, w: size, h: size, organic: true });
    }
    
    return w;
}

function checkWall(x, y) {
    for (const w of walls) {
        if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return true;
    }
    return false;
}

// ========== プレイヤークラス（白血球/免疫細胞）==========
class Player {
    constructor() {
        this.x = WORLD_W / 2;
        this.y = WORLD_H / 2;
        this.r = 8; // 小さいサイズ
        this.color = '#fff';
        this.maxHp = 100;
        this.hp = 100;
        this.speed = 6;
        this.bombs = 2;
        this.angle = 0;
        this.weaponTimer = 0;
        this.dashing = false;
        this.dashTimer = 0;
        this.invincible = 60;
        this.pulsePhase = 0;
    }
    
    update() {
        if (this.invincible > 0) this.invincible--;
        this.pulsePhase += 0.1;
        
        // 壁の中から脱出
        if (checkWall(this.x, this.y)) {
            for (let dist = 10; dist < 500; dist += 10) {
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
                    const testX = this.x + Math.cos(a) * dist;
                    const testY = this.y + Math.sin(a) * dist;
                    if (!checkWall(testX, testY)) {
                        this.x = testX;
                        this.y = testY;
                        createParticles(this.x, this.y, '#fff', 10);
                        showMessage('ESCAPED!');
                        return;
                    }
                }
            }
        }
        
        // ダッシュ
        if (this.dashing) {
            this.dashTimer--;
            const vx = Math.cos(this.angle) * 28;
            const vy = Math.sin(this.angle) * 28;
            if (!checkWall(this.x + vx, this.y)) this.x += vx;
            if (!checkWall(this.x, this.y + vy)) this.y += vy;
            if (frame % 2 === 0) particles.push(new Particle(this.x, this.y, '#fff', 5, 5));
            if (this.dashTimer <= 0) this.dashing = false;
        } else {
            // 通常移動
            if (joystick.active && (Math.abs(joystick.dx) > 0.1 || Math.abs(joystick.dy) > 0.1)) {
                this.angle = Math.atan2(joystick.dy, joystick.dx);
                const mag = Math.min(1, Math.hypot(joystick.dx, joystick.dy));
                const vx = joystick.dx * this.speed * mag;
                const vy = joystick.dy * this.speed * mag;
                if (!checkWall(this.x + vx, this.y)) this.x += vx;
                if (!checkWall(this.x, this.y + vy)) this.y += vy;
            } else if (input.active) {
                const mx = input.x + camera.x;
                const my = input.y + camera.y;
                this.angle = Math.atan2(my - this.y, mx - this.x);
                if (Math.hypot(mx - this.x, my - this.y) > 20) {
                    const vx = Math.cos(this.angle) * this.speed;
                    const vy = Math.sin(this.angle) * this.speed;
                    if (!checkWall(this.x + vx, this.y)) this.x += vx;
                    if (!checkWall(this.x, this.y + vy)) this.y += vy;
                }
            }
        }
        
        // 境界
        this.x = Math.max(60, Math.min(WORLD_W - 60, this.x));
        this.y = Math.max(60, Math.min(WORLD_H - 60, this.y));
        
        // 全武器同時発射
        this.weaponTimer++;
        if (this.weaponTimer >= 12) {
            this.fireAllWeapons();
            this.weaponTimer = 0;
        }
        
        // オプション更新
        options.forEach((opt, i) => opt.update(i, options.length));
    }
    
    fireAllWeapons() {
        // NORMAL - 常に発射
        this.fireNormal();
        
        // HOMING
        if (weaponLevels.HOMING > 0) this.fireHoming();
        
        // LASER
        if (weaponLevels.LASER > 0) this.fireLaser();
        
        // THUNDER
        if (weaponLevels.THUNDER > 0) this.fireThunder();
        
        // ALL-RANGE オプションからも発射
        options.forEach(opt => {
            bullets.push(new NormalBullet({
                x: opt.x, y: opt.y,
                vx: Math.cos(opt.angle) * 14,
                vy: Math.sin(opt.angle) * 14,
                damage: 3, color: '#0f0', size: 3
            }));
        });
        
        playSound('shoot');
    }
    
    fireNormal() {
        const lv = weaponLevels.NORMAL;
        const count = Math.min(7, 1 + Math.floor(lv / 2));
        const spread = count > 1 ? Math.PI / 6 : 0;
        
        for (let i = 0; i < count; i++) {
            const a = count === 1 ? this.angle : this.angle - spread/2 + spread * (i / (count - 1));
            bullets.push(new NormalBullet({
                x: this.x, y: this.y,
                vx: Math.cos(a) * 14,
                vy: Math.sin(a) * 14,
                damage: 3 + Math.floor(lv / 2),
                color: '#ff0',
                size: 3
            }));
        }
    }
    
    fireHoming() {
        const lv = weaponLevels.HOMING;
        const count = Math.min(5, 1 + Math.floor(lv / 2));
        
        for (let i = 0; i < count; i++) {
            const offsetAngle = this.angle + (Math.random() - 0.5) * 0.8;
            bullets.push(new HomingMissile({
                x: this.x + (Math.random() - 0.5) * 15,
                y: this.y + (Math.random() - 0.5) * 15,
                angle: offsetAngle,
                damage: 6 + lv * 2,
                color: '#a0f'
            }));
        }
    }
    
    fireLaser() {
        const lv = weaponLevels.LASER;
        bullets.push(new ReflectLaser({
            x: this.x, y: this.y,
            angle: this.angle,
            damage: 4 + lv * 2,
            bounces: 3 + lv,
            color: '#0ff'
        }));
    }
    
    fireThunder() {
        const lv = weaponLevels.THUNDER;
        bullets.push(new ThunderBeam({
            x: this.x, y: this.y,
            angle: this.angle,
            damage: 15 + lv * 8,
            length: 600 + lv * 100,
            color: '#ff0'
        }));
    }
    
    dash() {
        if (!this.dashing) {
            this.dashing = true;
            this.dashTimer = 10;
            this.invincible = Math.max(this.invincible, 12);
            playSound('dash');
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(this.x, this.y, '#fff', 6, 4));
            }
        }
    }
    
    damage(val) {
        if (this.invincible > 0 || this.dashing) return;
        this.hp -= val;
        ui.hp.style.width = Math.max(0, (this.hp / this.maxHp) * 100) + '%';
        createFloatingText(this.x, this.y, `-${val}`, '#f00');
        playSound('hit');
        triggerScreenShake(10);
        this.invincible = 30;
        
        if (this.hp <= 0) endGame();
    }
    
    heal(val) {
        this.hp = Math.min(this.maxHp, this.hp + val);
        ui.hp.style.width = (this.hp / this.maxHp) * 100 + '%';
        createFloatingText(this.x, this.y, '+HP', '#0f0');
    }
    
    draw() {
        const sx = this.x - camera.x + screenShake.x;
        const sy = this.y - camera.y + screenShake.y;
        
        // オプション描画
        options.forEach(opt => opt.draw());
        
        if (this.invincible % 4 < 2) {
            const pulse = Math.sin(this.pulsePhase) * 2;
            
            // 外膜（アメーバっぽく）
            ctx.save();
            ctx.translate(sx, sy);
            
            // グロー
            ctx.shadowBlur = this.dashing ? 30 : 15;
            ctx.shadowColor = this.dashing ? '#fff' : '#0ff';
            
            // 本体（白血球）
            ctx.fillStyle = this.dashing ? '#fff' : 'rgba(200,240,255,0.9)';
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI * 2 / 8) * i + this.pulsePhase * 0.3;
                const r = this.r + pulse + Math.sin(a * 3 + frame * 0.1) * 2;
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            
            // 核
            ctx.fillStyle = 'rgba(100,150,200,0.8)';
            ctx.beginPath();
            ctx.arc(0, 0, this.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            
            // 進行方向
            ctx.rotate(this.angle);
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.moveTo(this.r + 5, 0);
            ctx.lineTo(this.r, -3);
            ctx.lineTo(this.r, 3);
            ctx.fill();
            
            ctx.restore();
        }
    }
}

// ========== オプション（ALL-RANGE）==========
class Option {
    constructor() {
        this.x = player.x;
        this.y = player.y;
        this.angle = 0;
        this.orbitAngle = 0;
    }
    
    update(index, total) {
        this.orbitAngle += 0.05;
        const baseAngle = (Math.PI * 2 / total) * index + this.orbitAngle;
        const orbitR = 60;
        
        this.x = player.x + Math.cos(baseAngle) * orbitR;
        this.y = player.y + Math.sin(baseAngle) * orbitR;
        
        // 最も近い敵を向く
        let target = null, minDist = 400;
        enemies.forEach(e => {
            if (e.hp > 0) {
                const d = Math.hypot(e.x - this.x, e.y - this.y);
                if (d < minDist) { minDist = d; target = e; }
            }
        });
        
        if (target) {
            this.angle = Math.atan2(target.y - this.y, target.x - this.x);
        } else {
            this.angle = player.angle;
        }
    }
    
    draw() {
        const sx = this.x - camera.x + screenShake.x;
        const sy = this.y - camera.y + screenShake.y;
        
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        
        ctx.fillStyle = '#0f0';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0f0';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        
        // 方向
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(4, -3);
        ctx.lineTo(4, 3);
        ctx.fill();
        
        ctx.restore();
    }
}

// ========== 弾クラス ==========
class NormalBullet {
    constructor(data) {
        this.x = data.x; this.y = data.y;
        this.vx = data.vx; this.vy = data.vy;
        this.damage = data.damage || 3;
        this.color = data.color || '#ff0';
        this.size = data.size || 3;
        this.life = 60;
        this.type = 'NORMAL';
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.life--;
        if (this.life <= 0 || checkWall(this.x, this.y)) this.dead = true;
        this.checkHit();
    }
    checkHit() {
        for (const e of enemies) {
            if (e.hp > 0 && Math.hypot(e.x - this.x, e.y - this.y) < e.size + this.size) {
                damageEnemy(e, this.damage, this.type);
                this.dead = true;
                createParticle(this.x, this.y, this.color);
                break;
            }
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class HomingMissile {
    constructor(data) {
        this.x = data.x; this.y = data.y;
        this.angle = data.angle;
        this.speed = 10;
        this.damage = data.damage || 8;
        this.color = data.color || '#a0f';
        this.life = 120;
        this.type = 'HOMING';
        this.trail = [];
    }
    update() {
        this.life--;
        if (this.life <= 0) this.dead = true;
        
        let target = null, minDist = 400;
        enemies.forEach(e => {
            if (e.hp > 0) {
                const d = Math.hypot(e.x - this.x, e.y - this.y);
                if (d < minDist) { minDist = d; target = e; }
            }
        });
        
        if (target) {
            let d = Math.atan2(target.y - this.y, target.x - this.x) - this.angle;
            while (d < -Math.PI) d += Math.PI * 2;
            while (d > Math.PI) d -= Math.PI * 2;
            this.angle += d * 0.15;
        }
        
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        
        this.trail.unshift({ x: this.x, y: this.y });
        if (this.trail.length > 12) this.trail.pop();
        
        if (checkWall(this.x, this.y)) {
            this.dead = true;
            createParticles(this.x, this.y, '#f80', 5);
        }
        
        for (const e of enemies) {
            if (e.hp > 0 && Math.hypot(e.x - this.x, e.y - this.y) < e.size + 5) {
                damageEnemy(e, this.damage, this.type);
                this.dead = true;
                createParticles(this.x, this.y, this.color, 8);
                break;
            }
        }
    }
    draw() {
        this.trail.forEach((p, i) => {
            const alpha = 1 - i / this.trail.length;
            ctx.fillStyle = `rgba(170,0,255,${alpha * 0.5})`;
            ctx.beginPath();
            ctx.arc(p.x - camera.x, p.y - camera.y, 2, 0, Math.PI * 2);
            ctx.fill();
        });
        
        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(-5, 4);
        ctx.lineTo(-5, -4);
        ctx.fill();
        ctx.restore();
    }
}

class ReflectLaser {
    constructor(data) {
        this.x = data.x; this.y = data.y;
        this.angle = data.angle;
        this.damage = data.damage || 4;
        this.bounces = data.bounces || 3;
        this.color = data.color || '#0ff';
        this.life = 8;
        this.speed = 20;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.trail = [{ x: this.x, y: this.y }];
        this.hitEnemies = new Set();
        this.type = 'LASER';
        this.totalDist = 0;
        this.maxDist = 600;
    }
    update() {
        this.life--;
        if (this.life <= 0 || this.totalDist > this.maxDist) this.dead = true;
        
        const nextX = this.x + this.vx;
        const nextY = this.y + this.vy;
        
        if (checkWall(nextX, this.y) && this.bounces > 0) {
            this.vx *= -1;
            this.bounces--;
            createParticle(this.x, this.y, this.color);
            this.trail.push({ x: this.x, y: this.y });
        }
        if (checkWall(this.x, nextY) && this.bounces > 0) {
            this.vy *= -1;
            this.bounces--;
            createParticle(this.x, this.y, this.color);
            this.trail.push({ x: this.x, y: this.y });
        }
        
        const oldX = this.x, oldY = this.y;
        this.x += this.vx;
        this.y += this.vy;
        this.totalDist += Math.hypot(this.x - oldX, this.y - oldY);
        
        if (checkWall(this.x, this.y) && this.bounces <= 0) this.dead = true;
        
        enemies.forEach(e => {
            if (e.hp > 0 && !this.hitEnemies.has(e.id) && Math.hypot(e.x - this.x, e.y - this.y) < e.size + 8) {
                damageEnemy(e, this.damage, this.type);
                this.hitEnemies.add(e.id);
                createParticle(this.x, this.y, this.color);
            }
        });
    }
    draw() {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        this.trail.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x - camera.x, p.y - camera.y);
            else ctx.lineTo(p.x - camera.x, p.y - camera.y);
        });
        ctx.lineTo(this.x - camera.x, this.y - camera.y);
        ctx.stroke();
        
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class ThunderBeam {
    constructor(data) {
        this.sx = data.x; this.sy = data.y;
        this.angle = data.angle;
        this.damage = data.damage || 15;
        this.length = data.length || 600;
        this.color = data.color || '#ff0';
        this.life = 10;
        this.hit = false;
        this.type = 'THUNDER';
        
        this.ex = this.sx + Math.cos(this.angle) * this.length;
        this.ey = this.sy + Math.sin(this.angle) * this.length;
        
        this.points = [{ x: this.sx, y: this.sy }];
        const segments = 20;
        for (let i = 1; i <= segments; i++) {
            const progress = i / segments;
            const baseX = this.sx + (this.ex - this.sx) * progress;
            const baseY = this.sy + (this.ey - this.sy) * progress;
            const perpAngle = this.angle + Math.PI / 2;
            const offset = (Math.random() - 0.5) * 40;
            this.points.push({
                x: baseX + Math.cos(perpAngle) * offset,
                y: baseY + Math.sin(perpAngle) * offset
            });
        }
    }
    update() {
        this.life--;
        if (this.life <= 0) this.dead = true;
        
        this.points.forEach((p, i) => {
            if (i > 0 && i < this.points.length - 1) {
                p.x += (Math.random() - 0.5) * 6;
                p.y += (Math.random() - 0.5) * 6;
            }
        });
        
        if (!this.hit) {
            this.hit = true;
            enemies.forEach(e => {
                if (e.hp > 0 && distToSegment(e.x, e.y, this.sx, this.sy, this.ex, this.ey) < e.size + 15) {
                    damageEnemy(e, this.damage, this.type);
                    createParticles(e.x, e.y, '#ff0', 10);
                }
            });
            triggerScreenShake(6);
        }
    }
    draw() {
        const alpha = this.life / 10;
        
        ctx.strokeStyle = `rgba(255,255,0,${alpha * 0.3})`;
        ctx.lineWidth = 20;
        ctx.beginPath();
        this.points.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x - camera.x, p.y - camera.y);
            else ctx.lineTo(p.x - camera.x, p.y - camera.y);
        });
        ctx.stroke();
        
        ctx.strokeStyle = `rgba(255,255,0,${alpha})`;
        ctx.lineWidth = 6;
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ff0';
        ctx.stroke();
        
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

// ========== 敵テンプレート（ウイルス/病原体）==========

    bacteria: { hp: 8, speed: 1.5, size: 14, color: '#0a0', score: 60, name: 'BACTERIA' },
    
    // 感染細胞
    infected: { hp: 15, speed: 1.8, size: 18, color: '#ff0', score: 100, name: 'INFECTED', shoots: true },
    mutant: { hp: 25, speed: 2.2, size: 16, color: '#f80', score: 150, name: 'MUTANT' },
    
    // 有害細胞
    toxin: { hp: 12, speed: 2.5, size: 12, color: '#f0f', score: 120, name: 'TOXIN', trail: true },
    parasite: { hp: 35, speed: 1.2, size: 22, color: '#88f', score: 200, name: 'PARASITE', armor: true },
    
    // 癌細胞
    cancer: { hp: 50, speed: 1, size: 30, color: '#800', score: 300, name: 'CANCER', divides: true },

    // 高レベル
    plague: { hp: 60, speed: 2, size: 25, color: '#0ff', score: 350, name: 'PLAGUE', shoots: true, spread: true },
    necrosis: { hp: 100, speed: 0.8, size: 35, color: '#444', score: 500, name: 'NECROSIS', armor: true }
};

// ========== ボステンプレート ==========
const BOSS_TYPES = [
    { name: 'VIRUS-α', color: '#0f0', baseHp: 300, size: 50, pattern: 'radial' },
    { name: 'BACTERIA-β', color: '#08f', baseHp: 450, size: 55, pattern: 'spiral' },
    { name: 'INFECTION-γ', color: '#f80', baseHp: 600, size: 60, pattern: 'burst' },
    { name: 'CANCER-δ', color: '#f00', baseHp: 800, size: 70, pattern: 'divide' },
    { name: 'PLAGUE-ε', color: '#f0f', baseHp: 1000, size: 75, pattern: 'swarm' },
    { name: 'NECROSIS-ζ', color: '#888', baseHp: 1200, size: 80, pattern: 'laser' },
    { name: 'PANDEMIC-η', color: '#ff0', baseHp: 1500, size: 85, pattern: 'chaos' },
    { name: 'OMEGA-CELL', color: '#fff', baseHp: 2000, size: 100, pattern: 'all' }
];

// ========== 敵生成 ==========
function spawnEnemy(type, x, y) {
    const template = ENEMY_TYPES[type];
    if (!template) return null;
    
    const waveScale = 1 + wave * 0.08;
    
    const enemy = {
        id: 'e_' + (enemyIdCounter++),
        type,
        x, y,
        hp: Math.floor(template.hp * waveScale),
        maxHp: Math.floor(template.hp * waveScale),
        speed: template.speed + wave * 0.05,
        size: template.size,
        color: template.color,
        score: template.score,
        name: template.name,
        shoots: template.shoots || false,
        armor: template.armor || false,
        divides: template.divides || false,
        spawns: template.spawns || false,
        trail: template.trail || false,
        spread: template.spread || false,
        isBoss: false,
        timer: Math.floor(Math.random() * 60),
        phase: Math.random() * Math.PI * 2
    };
    
    enemies.push(enemy);
    return enemy;
}

function spawnBoss() {
    const bossIndex = Math.min((wave - 1) % BOSS_TYPES.length, BOSS_TYPES.length - 1);
    const template = BOSS_TYPES[bossIndex];
    const waveScale = 1 + Math.floor(wave / 8) * 0.3;
    
    const pos = findSafeSpawnPosition(500);
    
    const boss = {
        id: 'boss_' + (enemyIdCounter++),
        type: 'boss',
        bossType: bossIndex,
        pattern: template.pattern,
        x: pos.x,
        y: pos.y,
        hp: Math.floor(template.baseHp * waveScale),
        maxHp: Math.floor(template.baseHp * waveScale),
        speed: 1.5 - bossIndex * 0.05,
        size: template.size + Math.floor(wave / 3) * 2,
        color: template.color,
        score: 3000 + wave * 500,
        name: template.name,
        isBoss: true,
        timer: 0,
        attackTimer: 0,
        phase: 0
    };
    
    enemies.push(boss);
    currentBoss = boss;
    
    ui.bossContainer.style.display = 'block';
    ui.bossName.textContent = `◆ WAVE ${wave} - ${boss.name} ◆`;
    showMessage(`◆ ${boss.name} ◆`);
    triggerScreenShake(20);
    
    return boss;
}

function findSafeSpawnPosition(minDist) {
    for (let i = 0; i < 50; i++) {
        const x = 150 + Math.random() * (WORLD_W - 300);
        const y = 150 + Math.random() * (WORLD_H - 300);
        if (checkWall(x, y)) continue;
        if (player && Math.hypot(player.x - x, player.y - y) < minDist) continue;
        return { x, y };
    }
    return { x: WORLD_W - 300, y: WORLD_H - 300 };
}

// ========== 敵更新 ==========
function updateEnemies() {
    enemies.forEach(enemy => {
        if (enemy.hp <= 0) return;
        enemy.timer++;
        
        // 移動
        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        const vx = Math.cos(angle) * enemy.speed;
        const vy = Math.sin(angle) * enemy.speed;
        
        if (!checkWall(enemy.x + vx, enemy.y + vy)) {
            enemy.x += vx;
            enemy.y += vy;
        }
        
        // プレイヤーとの衝突
        if (player && Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.r + enemy.size) {
            if (!player.dashing && player.invincible <= 0) {
                player.damage(enemy.isBoss ? 20 : 10);
            }
        }
        
        // 特殊行動
        if (enemy.shoots && enemy.timer % 90 === 0) {
            const a = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemyBullets.push({ x: enemy.x, y: enemy.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 5, color: enemy.color });
        }
        
        if (enemy.trail && enemy.timer % 10 === 0) {
            particles.push(new Particle(enemy.x, enemy.y, enemy.color, enemy.size * 0.5, 15));
        }
        
        // ボス攻撃
        if (enemy.isBoss) {
            enemy.attackTimer++;
            bossAttack(enemy);
        }
    });
}

// ========== ボス攻撃パターン ==========
function bossAttack(boss) {
    const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
    
    switch (boss.pattern) {
        case 'radial': // 放射状
            if (boss.attackTimer % 60 === 0) {
                for (let i = 0; i < 16; i++) {
                    const a = (Math.PI * 2 / 16) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 150, size: 6, color: boss.color });
                }
                boss.phase += 0.2;
            }
            break;
            
        case 'spiral': // 螺旋
            if (boss.attackTimer % 8 === 0) {
                const a = boss.timer * 0.15;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 5, color: boss.color });
            }
            break;
            
        case 'burst': // バースト（炎っぽく）
            if (boss.attackTimer % 40 === 0) {
                for (let i = 0; i < 8; i++) {
                    const a = angle + (Math.random() - 0.5) * 0.8;
                    const speed = 4 + Math.random() * 3;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 60, size: 8, color: '#f80', flame: true });
                }
            }
            break;
            
        case 'divide': // 分裂弾
            if (boss.attackTimer % 90 === 0) {
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI * 2 / 6) * i;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 90, size: 10, color: boss.color, splits: true });
                }
            }
            break;
            
        case 'swarm': // 小型弾の群れ
            if (boss.attackTimer % 5 === 0) {
                const a = angle + (Math.random() - 0.5) * 1.5;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, life: 80, size: 4, color: boss.color });
            }
            break;
            
        case 'laser': // レーザー（反射）
            if (boss.attackTimer % 120 === 0) {
                for (let i = 0; i < 4; i++) {
                    const a = (Math.PI * 2 / 4) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, life: 150, size: 6, color: '#0ff', bounces: 3, isLaser: true });
                }
                boss.phase += 0.3;
                triggerScreenShake(15);
            }
            break;
            
        case 'chaos': // カオス（複合）
            if (boss.attackTimer % 30 === 0) {
                const pattern = Math.floor(boss.attackTimer / 30) % 4;
                switch (pattern) {
                    case 0: // 放射
                        for (let i = 0; i < 12; i++) {
                            const a = (Math.PI * 2 / 12) * i;
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 120, size: 6, color: '#f00' });
                        }
                        break;
                    case 1: // 追尾弾
                        for (let i = 0; i < 3; i++) {
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3, life: 180, size: 8, color: '#a0f', homing: true });
                        }
                        break;
                    case 2: // 拡散
                        for (let i = 0; i < 20; i++) {
                            const a = Math.random() * Math.PI * 2;
                            const speed = 2 + Math.random() * 4;
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 100, size: 5, color: '#ff0' });
                        }
                        break;
                    case 3: // 螺旋二重
                        for (let i = 0; i < 8; i++) {
                            const a1 = boss.timer * 0.1 + (Math.PI * 2 / 8) * i;
                            const a2 = -boss.timer * 0.1 + (Math.PI * 2 / 8) * i;
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a1) * 5, vy: Math.sin(a1) * 5, life: 100, size: 5, color: '#0f0' });
                            enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a2) * 5, vy: Math.sin(a2) * 5, life: 100, size: 5, color: '#f0f' });
                        }
                        break;
                }
            }
            break;
            
        case 'all': // 最終ボス：全パターン
            if (boss.attackTimer % 20 === 0) {
                // 常時螺旋
                const a = boss.timer * 0.12;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 150, size: 5, color: '#fff' });
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a + Math.PI) * 4, vy: Math.sin(a + Math.PI) * 4, life: 150, size: 5, color: '#fff' });
            }
            if (boss.attackTimer % 60 === 0) {
                // 放射
                for (let i = 0; i < 24; i++) {
                    const a = (Math.PI * 2 / 24) * i;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 6, color: '#f00' });
                }
                triggerScreenShake(20);
            }
            if (boss.attackTimer % 120 === 0) {
                // 雑魚召喚
                for (let i = 0; i < 4; i++) {
                    const types = Object.keys(ENEMY_TYPES);
                    const type = types[Math.floor(Math.random() * types.length)];
                    const a = (Math.PI * 2 / 4) * i;
                    spawnEnemy(type, boss.x + Math.cos(a) * 100, boss.y + Math.sin(a) * 100);
                }
            }
            break;
    }
}

// ========== ダメージ処理 ==========
function damageEnemy(enemy, damage, weaponType) {
    if (enemy.hp <= 0) return;
    
    // 装甲持ちは半減
    if (enemy.armor && weaponType !== 'THUNDER') {
        damage = Math.floor(damage / 2);
    }
    
    enemy.hp -= damage;
    createFloatingText(enemy.x, enemy.y - enemy.size, `-${damage}`, '#fff');
    
    if (enemy.hp <= 0) {
        defeatEnemy(enemy);
    }
}

function defeatEnemy(enemy) {
    createParticles(enemy.x, enemy.y, enemy.color, enemy.isBoss ? 50 : 15);
    playSound('boom');
    addCombo();
    
    score += Math.floor(enemy.score * combo.multiplier);
    ui.score.textContent = score;
    
    // アイテムドロップ
    dropItems(enemy.x, enemy.y, enemy.isBoss);
    
    // 分裂特性
    if (enemy.divides && !enemy.isBoss) {
        for (let i = 0; i < 2; i++) {
            const a = Math.random() * Math.PI * 2;
            spawnEnemy('virus', enemy.x + Math.cos(a) * 30, enemy.y + Math.sin(a) * 30);
        }
    }
    
    if (enemy.isBoss) {
        currentBoss = null;
        ui.bossContainer.style.display = 'none';
        showMessage('◆ PATHOGEN ELIMINATED ◆');
        triggerScreenShake(40);
        
        // 残りの雑魚を掃討
        enemies.forEach(e => {
            if (!e.isBoss && e.hp > 0) {
                e.hp = 0;
                score += 50;
            }
        });
        ui.score.textContent = score;
        
        // 次のWAVEへ
        setTimeout(() => {
            if (gameState === 'playing') startWave();
        }, 3000);
    }
}

// ========== アイテム ==========
function dropItems(x, y, isBoss) {
    if (isBoss) {
        const count = 4 + Math.floor(Math.random() * 3);
        const types = ['NORMAL', 'HOMING', 'LASER', 'THUNDER', 'ALLRANGE', 'H'];
        for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i;
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({
                x: x + Math.cos(a) * 50,
                y: y + Math.sin(a) * 50,
                type,
                color: getItemColor(type)
            });
        }
    } else {
        // 通常ドロップ
        if (Math.random() < 0.08) {
            const types = ['NORMAL', 'HOMING', 'LASER', 'THUNDER'];
            items.push({ x, y, type: types[Math.floor(Math.random() * types.length)], color: '#ff0' });
        }
        if (Math.random() < 0.03) {
            items.push({ x, y, type: 'H', color: '#f06' });
        }
        if (Math.random() < 0.02) {
            items.push({ x, y, type: 'ALLRANGE', color: '#0f0' });
        }
    }
}

function getItemColor(type) {
    const colors = { NORMAL: '#ff0', HOMING: '#a0f', LASER: '#0ff', THUNDER: '#ff0', ALLRANGE: '#0f0', H: '#f06' };
    return colors[type] || '#fff';
}

function updateItems() {
    items = items.filter(item => {
        // プレイヤーに引き寄せ
        if (player && Math.hypot(player.x - item.x, player.y - item.y) < 150) {
            item.x += (player.x - item.x) * 0.1;
            item.y += (player.y - item.y) * 0.1;
        }
        
        // 回収
        if (player && Math.hypot(player.x - item.x, player.y - item.y) < player.r + 12) {
            collectItem(item.type);
            createFloatingText(item.x, item.y, item.type + '!', item.color);
            playSound('powerup');
            return false;
        }
        return true;
    });
}

function collectItem(type) {
    if (type === 'H') {
        player.heal(30);
    } else if (type === 'ALLRANGE') {
        if (options.length < 4) {
            options.push(new Option());
        }
        weaponLevels.ALLRANGE++;
    } else {
        weaponLevels[type] = (weaponLevels[type] || 0) + 1;
    }
    updateWeaponUI();
}

function updateWeaponUI() {
    ui.weapons.normal.classList.toggle('locked', weaponLevels.NORMAL <= 0);
    ui.weapons.normal.classList.add('active');
    ui.weapons.normal.textContent = `NORMAL ${weaponLevels.NORMAL > 1 ? 'Lv' + weaponLevels.NORMAL : ''}`;
    
    ui.weapons.homing.classList.toggle('locked', weaponLevels.HOMING <= 0);
    ui.weapons.homing.classList.toggle('active', weaponLevels.HOMING > 0);
    ui.weapons.homing.textContent = weaponLevels.HOMING > 0 ? `HOMING Lv${weaponLevels.HOMING}` : 'HOMING';
    
    ui.weapons.laser.classList.toggle('locked', weaponLevels.LASER <= 0);
    ui.weapons.laser.classList.toggle('active', weaponLevels.LASER > 0);
    ui.weapons.laser.textContent = weaponLevels.LASER > 0 ? `LASER Lv${weaponLevels.LASER}` : 'LASER';
    
    ui.weapons.thunder.classList.toggle('locked', weaponLevels.THUNDER <= 0);
    ui.weapons.thunder.classList.toggle('active', weaponLevels.THUNDER > 0);
    ui.weapons.thunder.textContent = weaponLevels.THUNDER > 0 ? `THUNDER Lv${weaponLevels.THUNDER}` : 'THUNDER';
    
    ui.weapons.allrange.classList.toggle('locked', weaponLevels.ALLRANGE <= 0);
    ui.weapons.allrange.classList.toggle('active', weaponLevels.ALLRANGE > 0);
    ui.weapons.allrange.textContent = weaponLevels.ALLRANGE > 0 ? `ALL-RANGE x${options.length}` : 'ALL-RANGE';
}

// ========== WAVE管理 ==========
function startWave() {
    wave++;
    walls = generateWalls(wave);
    
    // プレイヤーが壁に埋まっていたら脱出
    if (player && checkWall(player.x, player.y)) {
        player.update(); // 脱出処理を実行
    }
    
    ui.wave.textContent = wave;
    showMessage(`◆ WAVE ${wave} ◆`);
    
    setTimeout(() => {
        if (gameState === 'playing') spawnBoss();
    }, 1500);
}

function spawnMobs() {
    if (!currentBoss || currentBoss.hp <= 0) return;
    
    const mobCount = enemies.filter(e => !e.isBoss && e.hp > 0).length;
    if (mobCount >= 25) return;
    
    const pos = findSafeSpawnPosition(250);
    
    // WAVEに応じた敵タイプ
    const types = ['virus', 'bacteria'];
    if (wave >= 2) types.push('infected', 'toxin');
    if (wave >= 4) types.push('mutant', 'parasite');
    if (wave >= 6) types.push('cancer');
    if (wave >= 8) types.push('tumor', 'plague');
    if (wave >= 10) types.push('necrosis');
    
    const type = types[Math.floor(Math.random() * types.length)];
    spawnEnemy(type, pos.x, pos.y);
}

// ========== 敵弾更新 ==========
function updateEnemyBullets() {
    enemyBullets.forEach(b => {
        // 追尾弾
        if (b.homing && player) {
            const a = Math.atan2(player.y - b.y, player.x - b.x);
            let d = a - Math.atan2(b.vy, b.vx);
            while (d < -Math.PI) d += Math.PI * 2;
            while (d > Math.PI) d -= Math.PI * 2;
            const speed = Math.hypot(b.vx, b.vy);
            const newAngle = Math.atan2(b.vy, b.vx) + d * 0.05;
            b.vx = Math.cos(newAngle) * speed;
            b.vy = Math.sin(newAngle) * speed;
        }
        
        // 反射弾
        if (b.bounces && b.bounces > 0) {
            if (checkWall(b.x + b.vx, b.y)) { b.vx *= -1; b.bounces--; }
            if (checkWall(b.x, b.y + b.vy)) { b.vy *= -1; b.bounces--; }
        }
        
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        
        // 炎弾は縮小
        if (b.flame) b.size *= 0.98;
        
        // 分裂弾
        if (b.splits && b.life === 45) {
            for (let i = 0; i < 4; i++) {
                const a = (Math.PI * 2 / 4) * i;
                enemyBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 60, size: 5, color: b.color });
            }
        }
        
        if (b.life <= 0 || (checkWall(b.x, b.y) && !b.bounces)) b.dead = true;
        
        // プレイヤーに当たり
        if (player && Math.hypot(player.x - b.x, player.y - b.y) < player.r + b.size) {
            player.damage(8);
            b.dead = true;
        }
    });
    
    enemyBullets = enemyBullets.filter(b => !b.dead);
}

// ========== ユーティリティ ==========
function distToSegment(px, py, x1, y1, x2, y2) {
    const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let t = lenSq !== 0 ? Math.max(0, Math.min(1, dot / lenSq)) : 0;
    return Math.hypot(px - (x1 + t * C), py - (y1 + t * D));
}

class Particle {
    constructor(x, y, color, size, life) {
        this.x = x; this.y = y;
        this.color = color;
        this.size = size || 3;
        this.life = life || 20;
        this.maxLife = this.life;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;
        this.life--;
    }
    draw() {
        const alpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function createParticle(x, y, color) {
    particles.push(new Particle(x, y, color, 4, 15));
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, 3 + Math.random() * 4, 15 + Math.random() * 15));
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x; this.y = y;
        this.text = text;
        this.color = color;
        this.life = 40;
        this.vy = -2;
    }
    update() {
        this.y += this.vy;
        this.vy *= 0.95;
        this.life--;
    }
    draw() {
        const alpha = this.life / 40;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x - camera.x, this.y - camera.y);
        ctx.globalAlpha = 1;
    }
}

function createFloatingText(x, y, text, color) {
    texts.push(new FloatingText(x, y, text, color));
}

function showMessage(text) {
    ui.message.textContent = text;
    ui.message.style.opacity = 1;
    setTimeout(() => ui.message.style.opacity = 0, 2000);
}

function triggerScreenShake(intensity) {
    screenShake.intensity = Math.max(screenShake.intensity, intensity);
}

function updateScreenShake() {
    if (screenShake.intensity > 0) {
        screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.intensity *= 0.9;
        if (screenShake.intensity < 0.5) screenShake.intensity = 0;
    } else {
        screenShake.x = 0;
        screenShake.y = 0;
    }
}

function addCombo() {
    combo.count++;
    combo.timer = 120;
    combo.multiplier = 1 + Math.floor(combo.count / 5) * 0.5;
    if (combo.multiplier > 5) combo.multiplier = 5;
}

function updateCombo() {
    if (combo.timer > 0) {
        combo.timer--;
        if (combo.timer === 0) {
            combo.count = 0;
            combo.multiplier = 1;
        }
    }
}

function triggerDash() {
    if (player && gameState === 'playing') player.dash();
}

function triggerBomb() {
    if (!player || gameState !== 'playing' || player.bombs <= 0) return;
    player.bombs--;
    ui.bomb.textContent = player.bombs;
    
    // 全敵にダメージ
    enemies.forEach(e => {
        if (e.hp > 0 && Math.hypot(e.x - player.x, e.y - player.y) < 600) {
            damageEnemy(e, 80, 'BOMB');
        }
    });
    enemyBullets = [];
    
    playSound('boom');
    triggerScreenShake(30);
    
    // 画面フラッシュ
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function endGame() {
    gameState = 'over';
    ui.gameOver.style.display = 'flex';
    document.getElementById('final-score').textContent = `SCORE: ${score}`;
}

// ========== カメラ ==========
function updateCamera() {
    if (!player) return;
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;
    camera.x = Math.max(0, Math.min(WORLD_W - canvas.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H - canvas.height, camera.y));
}

// ========== 描画 ==========
function draw() {
    ctx.fillStyle = '#000810';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // グリッド（血管の内壁っぽく）
    ctx.strokeStyle = 'rgba(100,20,30,0.3)';
    ctx.lineWidth = 1;
    const gridSize = 80;
    for (let x = -camera.x % gridSize; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = -camera.y % gridSize; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
    
    // 壁（細胞組織/血管壁）
    walls.forEach(w => {
        const sx = w.x - camera.x + screenShake.x;
        const sy = w.y - camera.y + screenShake.y;
        
        if (w.organic) {
            // 有機的な形状
            ctx.fillStyle = 'rgba(80,20,40,0.8)';
            ctx.strokeStyle = '#f44';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f00';
            ctx.beginPath();
            ctx.ellipse(sx + w.w/2, sy + w.h/2, w.w/2, w.h/2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else {
            // 外壁
            ctx.fillStyle = 'rgba(100,30,50,0.9)';
            ctx.strokeStyle = '#f88';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f44';
            ctx.fillRect(sx, sy, w.w, w.h);
            ctx.strokeRect(sx, sy, w.w, w.h);
        }
        ctx.shadowBlur = 0;
    });
    
    // アイテム
    items.forEach(item => {
        const sx = item.x - camera.x + screenShake.x;
        const sy = item.y - camera.y + screenShake.y;
        
        ctx.fillStyle = item.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = item.color;
        
        if (item.type === 'H') {
            // ハート
            ctx.beginPath();
            ctx.moveTo(sx, sy - 3);
            ctx.bezierCurveTo(sx - 8, sy - 10, sx - 15, sy, sx, sy + 10);
            ctx.bezierCurveTo(sx + 15, sy, sx + 8, sy - 10, sx, sy - 3);
            ctx.fill();
        } else {
            // 円形
            ctx.beginPath();
            ctx.arc(sx, sy, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 8px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(item.type[0], sx, sy + 3);
        }
        ctx.shadowBlur = 0;
    });
    
    // 敵
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        const sx = e.x - camera.x + screenShake.x;
        const sy = e.y - camera.y + screenShake.y;
        
        if (e.isBoss) {
            drawBoss(e, sx, sy);
        } else {
            drawEnemy(e, sx, sy);
        }
    });
    
    // 敵弾
    enemyBullets.forEach(b => {
        const sx = b.x - camera.x + screenShake.x;
        const sy = b.y - camera.y + screenShake.y;
        
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.beginPath();
        ctx.arc(sx, sy, b.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });
    
    // 弾
    bullets.forEach(b => { if (!b.dead) b.draw(); });
    
    // パーティクル
    particles.forEach(p => p.draw());
    
    // テキスト
    texts.forEach(t => t.draw());
    
    // プレイヤー
    if (player) player.draw();
    
    // コンボ表示
    if (combo.count > 0) {
        ctx.fillStyle = combo.multiplier >= 3 ? '#f00' : '#0ff';
        ctx.font = 'bold 20px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(`${combo.count} CHAIN x${combo.multiplier.toFixed(1)}`, canvas.width - 20, canvas.height - 80);
    }
    
    // ミニマップ
    drawMinimap();
}

function drawEnemy(e, sx, sy) {
    ctx.save();
    ctx.translate(sx, sy);
    
    const pulse = Math.sin(frame * 0.1 + e.phase) * 2;
    
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = e.color;
    
    // ウイルス/細菌の形状
    if (e.type === 'virus' || e.type === 'bacteria') {
        // スパイク付き球体
        ctx.beginPath();
        for (let i = 0; i < 12; i++) {
            const a = (Math.PI * 2 / 12) * i + frame * 0.02;
            const r = e.size + (i % 2 === 0 ? 4 + pulse : 0);
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
    } else if (e.type === 'cancer' || e.type === 'tumor') {
        // 不規則な形状
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 / 8) * i;
            const r = e.size + Math.sin(a * 3 + frame * 0.05) * 5 + pulse;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
    } else {
        // 通常の円形
        ctx.beginPath();
        ctx.arc(0, 0, e.size + pulse, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // 核/中心
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.arc(0, 0, e.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
    
    // HPバー
    const hpRatio = e.hp / e.maxHp;
    ctx.fillStyle = '#300';
    ctx.fillRect(sx - e.size, sy - e.size - 10, e.size * 2, 4);
    ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : hpRatio > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(sx - e.size, sy - e.size - 10, e.size * 2 * hpRatio, 4);
    
    // HP数値
    ctx.fillStyle = '#fff';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(e.hp, sx, sy - e.size - 14);
}

function drawBoss(boss, sx, sy) {
    ctx.save();
    ctx.translate(sx, sy);
    
    const pulse = Math.sin(frame * 0.05) * 5;
    
    // 外側のオーラ
    ctx.strokeStyle = boss.color;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 30;
    ctx.shadowColor = boss.color;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(0, 0, boss.size + 20 + pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    
    // 回転する六角形
    ctx.rotate(frame * 0.02);
    ctx.strokeStyle = boss.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i;
        const r = boss.size + 10;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    
    // 本体
    ctx.rotate(-frame * 0.02);
    ctx.fillStyle = boss.color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
        const a = (Math.PI * 2 / 16) * i + frame * 0.01;
        const r = boss.size + (i % 2 === 0 ? 8 + pulse : 0);
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    
    // 核
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 0, boss.size * 0.4, 0, Math.PI * 2);
    ctx.fill();
    
    // 目のような光
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, boss.size * 0.15, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function drawMinimap() {
    const mapW = 120, mapH = 120;
    const mapX = canvas.width - mapW - 10;
    const mapY = canvas.height - mapH - 10;
    const scale = mapW / WORLD_W;
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(mapX, mapY, mapW, mapH);
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 1;
    ctx.strokeRect(mapX, mapY, mapW, mapH);
    
    // 壁
    ctx.fillStyle = 'rgba(255,100,100,0.5)';
    walls.forEach(w => {
        ctx.fillRect(mapX + w.x * scale, mapY + w.y * scale, w.w * scale, w.h * scale);
    });
    
    // 敵
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        ctx.fillStyle = e.isBoss ? '#ff0' : e.color;
        ctx.beginPath();
        ctx.arc(mapX + e.x * scale, mapY + e.y * scale, e.isBoss ? 4 : 2, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // プレイヤー
    if (player) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(mapX + player.x * scale, mapY + player.y * scale, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ========== サウンド ==========
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    switch (type) {
        case 'shoot':
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
        case 'boom':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            break;
        case 'powerup':
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
        case 'dash':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
        case 'hit':
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
    }
}

// ========== モバイルコントロール ==========
function initMobileControls() {
    const joystickZone = document.getElementById('joystick-zone');
    const stick = document.getElementById('joystick-stick');
    
    let startX, startY;
    
    joystickZone.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = joystickZone.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
        joystick.active = true;
    });
    
    joystickZone.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!joystick.active) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 45;
        
        const clampedDist = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        
        joystick.dx = (clampedDist / maxDist) * Math.cos(angle);
        joystick.dy = (clampedDist / maxDist) * Math.sin(angle);
        
        stick.style.transform = `translate(calc(-50% + ${joystick.dx * maxDist}px), calc(-50% + ${joystick.dy * maxDist}px))`;
    });
    
    joystickZone.addEventListener('touchend', () => {
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        stick.style.transform = 'translate(-50%, -50%)';
    });
    
    document.getElementById('btn-dash').addEventListener('touchstart', e => {
        e.preventDefault();
        triggerDash();
    });
    
    document.getElementById('btn-bomb').addEventListener('touchstart', e => {
        e.preventDefault();
        triggerBomb();
    });
}

// ========== メインループ ==========
function update() {
    if (gameState !== 'playing') return;
    
    try {
        frame++;
        
        // プレイヤー更新
        if (player) {
            player.update();
            updateCamera();
        }
        
        // WAVE管理
        soloWaveTimer++;
        soloMobTimer++;
        
        if (wave === 0 && soloWaveTimer > 60) {
            startWave();
        }
        
        if (currentBoss && currentBoss.hp > 0 && soloMobTimer >= 60) {
            soloMobTimer = 0;
            spawnMobs();
        }
        
        // 敵更新
        updateEnemies();
        enemies = enemies.filter(e => e.hp > 0);
        
        // ボスHPバー更新
        if (currentBoss && currentBoss.hp > 0) {
            ui.bossHp.style.width = (currentBoss.hp / currentBoss.maxHp * 100) + '%';
        }
        
        // 弾更新
        bullets.forEach(b => { if (!b.dead) b.update(); });
        bullets = bullets.filter(b => !b.dead);
        
        // 敵弾更新
        updateEnemyBullets();
        
        // アイテム更新
        updateItems();
        
        // パーティクル/テキスト更新
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);
        texts.forEach(t => t.update());
        texts = texts.filter(t => t.life > 0);
        
        // その他
        updateCombo();
        updateScreenShake();
        
        // 描画
        draw();
        
        requestAnimationFrame(update);
    } catch (e) {
        console.error(e);
        requestAnimationFrame(update);
    }
}

// ========== 開始 ==========
init();
</script>
