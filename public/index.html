<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLAZMERS - INNER SPACE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000810; 
            overflow: hidden; 
            font-family: 'Courier New', monospace;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            cursor: crosshair; /* マウスカーソルを照準に変更 */
        }
        #canvas { display: block; background: #000810; }
        
        .ui { position: fixed; color: #0ff; font-size: 14px; text-shadow: 0 0 10px #0ff; z-index: 100; }
        
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #001020 0%, #000810 100%);
            z-index: 200;
        }
        #start-screen h1 {
            font-size: 60px; color: #0ff; text-shadow: 0 0 30px #0ff, 0 0 60px #08f;
            letter-spacing: 15px; margin-bottom: 10px;
        }
        #start-screen .subtitle {
            font-size: 16px; color: #f08; margin-bottom: 40px;
            text-shadow: 0 0 10px #f08; letter-spacing: 5px;
        }
        .menu-btn {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 15px 50px; margin: 10px; font-size: 18px; cursor: pointer;
            font-family: 'Courier New', monospace; letter-spacing: 3px;
            transition: all 0.3s; text-shadow: 0 0 10px #0ff;
        }
        .menu-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; }
        .name-input {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            padding: 10px 20px; font-size: 16px; text-align: center;
            font-family: 'Courier New', monospace; margin-bottom: 20px; width: 200px;
        }
        .name-input::placeholder { color: #088; }
        
        #hud { position: fixed; top: 10px; left: 10px; }
        .hud-label { font-size: 10px; color: #088; margin-bottom: 2px; }
        .hud-value { font-size: 20px; color: #0ff; margin-bottom: 10px; }
        #hp-bar { width: 150px; height: 8px; background: #001; border: 1px solid #0ff; margin-bottom: 10px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0, #0f0); transition: width 0.2s; }
        
        #boss-container {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            width: 500px; max-width: 90%; display: none; text-align: center;
        }
        #boss-name { font-size: 14px; color: #f00; margin-bottom: 5px; text-shadow: 0 0 10px #f00; font-weight: bold; }
        #boss-bar { width: 100%; height: 12px; background: #200; border: 1px solid #f00; }
        #boss-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.3s; }
        
        #weapons {
            position: fixed; bottom: 10px; left: 10px;
            display: flex; gap: 8px; flex-wrap: wrap; max-width: 350px;
        }
        .weapon-slot {
            padding: 5px 8px; border: 1px solid #444; background: #001;
            font-size: 9px; color: #888; transition: all 0.3s;
        }
        .weapon-slot.active { border-color: #0ff; color: #0ff; box-shadow: 0 0 10px #0ff; }
        .weapon-slot.locked { opacity: 0.3; }
        
        #formation-display {
            position: fixed; bottom: 80px; left: 10px;
            font-size: 12px; color: #0f0; text-shadow: 0 0 10px #0f0;
        }
        
        #joystick-zone {
            position: fixed; bottom: 20px; left: 20px;
            width: 130px; height: 130px; display: none;
        }
        #joystick-base {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(0,255,255,0.1); border: 2px solid rgba(0,255,255,0.3);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.4); border: 2px solid #0ff;
        }
        #mobile-buttons {
            position: fixed; bottom: 20px; right: 20px;
            display: none; gap: 10px;
        }
        .mobile-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0,255,255,0.2); border: 2px solid #0ff;
            color: #0ff; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .mobile-btn:active { background: rgba(0,255,255,0.5); }
        
        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 300;
        }
        #game-over h2 { font-size: 48px; color: #f00; margin-bottom: 20px; text-shadow: 0 0 30px #f00; }
        #final-score { font-size: 24px; color: #0ff; margin-bottom: 30px; }
        
        #message {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; color: #0ff; text-shadow: 0 0 20px #0ff;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 150; width: 100%; text-align: center;
        }
        
        @media (max-width: 768px) {
            #start-screen h1 { font-size: 36px; letter-spacing: 8px; }
            .menu-btn { padding: 12px 30px; font-size: 14px; }
            #joystick-zone, #mobile-buttons { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="start-screen">
        <h1>PLAZMERS</h1>
        <div class="subtitle">◆ INNER SPACE ◆</div>
        <input type="text" id="player-name" class="name-input" placeholder="ENTER NAME" maxlength="12">
        <button class="menu-btn" onclick="startSoloGame()">START</button>
    </div>
    
    <div id="hud" class="ui">
        <div class="hud-label">IMMUNE CELL HP</div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <div class="hud-label">WAVE</div>
        <div class="hud-value" id="wave">0</div>
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="score">0</div>
    </div>
    
    <div id="boss-container">
        <div id="boss-name">BOSS</div>
        <div id="boss-bar"><div id="boss-hp"></div></div>
    </div>
    
    <div id="weapons">
        <div class="weapon-slot active" id="w-plazmer">PLAZMER</div>
        <div class="weapon-slot locked" id="w-homing">HOMING</div>
        <div class="weapon-slot locked" id="w-laser">LASER</div>
        <div class="weapon-slot locked" id="w-thunder">THUNDER</div>
        <div class="weapon-slot locked" id="w-allrange">ALL-RANGE</div>
    </div>
    
    <div id="formation-display">FORMATION: FOLLOW</div>
    
    <div id="joystick-zone">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>
    <div id="mobile-buttons">
        <div class="mobile-btn" id="btn-dash">DASH</div>
        <div class="mobile-btn" id="btn-form">FORM</div>
    </div>
    
    <div id="game-over">
        <h2>INFECTION SPREAD</h2>
        <div id="final-score">SCORE: 0</div>
        <button class="menu-btn" onclick="location.reload()">RETRY</button>
    </div>
    
    <div id="message"></div>

<script>
// ========== 定数 ==========
const WORLD_W = 3000, WORLD_H = 3000;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ========== グローバル変数 ==========
let player = null;
let enemies = [];
let bullets = [];
let enemyBullets = [];
let particles = [];
let texts = [];
let items = [];
let options = [];
let walls = [];
let activeLaser = null;
let missiles = []; 

let wave = 0;
let score = 0;
let frame = 0;
let gameState = 'title';
let currentBoss = null;

// 武器レベル
let weaponLevels = { PLAZMER: 1, HOMING: 0, LASER: 0, THUNDER: 0, ALLRANGE: 0 };

// サンダーエネルギー
let thunderEnergy = 0;
const THUNDER_MAX_ENERGY = 180;

// フォーメーション
const FORMATIONS = ['FOLLOW', 'GO AROUND 1', 'GO AROUND 2', 'HUNT'];
let currentFormation = 0;

// カメラ
let camera = { x: 0, y: 0 };

// 画面揺れ
let screenShake = { x: 0, y: 0, intensity: 0 };

// コンボ
let combo = { count: 0, timer: 0, multiplier: 1 };

// 入力
// active: false はクリック判定用ではなくなったが、スマホ操作用に残す
// hasMoved: マウスが動いたかどうかの判定用
let input = { x: 0, y: 0, active: false, hasMoved: false };
let joystick = { active: false, dx: 0, dy: 0 };

// ソロモード用
let soloWaveTimer = 0;
let soloMobTimer = 0;
let enemyIdCounter = 0;

// UI要素
const ui = {
    startScreen: document.getElementById('start-screen'),
    gameOver: document.getElementById('game-over'),
    hp: document.getElementById('hp-fill'),
    wave: document.getElementById('wave'),
    score: document.getElementById('score'),
    bossContainer: document.getElementById('boss-container'),
    bossName: document.getElementById('boss-name'),
    bossHp: document.getElementById('boss-hp'),
    message: document.getElementById('message'),
    formationDisplay: document.getElementById('formation-display'),
    weapons: {
        plazmer: document.getElementById('w-plazmer'),
        homing: document.getElementById('w-homing'),
        laser: document.getElementById('w-laser'),
        thunder: document.getElementById('w-thunder'),
        allrange: document.getElementById('w-allrange')
    }
};

// ========== 初期化 ==========
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // マウス移動: 座標を更新し、入力があったことを記録
    canvas.addEventListener('mousemove', e => {
        input.x = e.clientX;
        input.y = e.clientY;
        input.hasMoved = true;
    });
    
    // マウスクリック: 左クリックでフォーメーション変更
    canvas.addEventListener('mousedown', (e) => {
        // e.button === 0 は左クリック
        if (e.button === 0 && gameState === 'playing') {
            cycleFormation();
        }
    });
    
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') triggerDash();
        if (e.code === 'KeyF') cycleFormation();
    });
    
    initMobileControls();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

// ========== ゲーム開始 ==========
function startSoloGame() {
    ui.startScreen.style.display = 'none';
    
    player = new Player();
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    texts = [];
    items = [];
    options = [];
    missiles = [];
    activeLaser = null;
    
    weaponLevels = { PLAZMER: 1, HOMING: 0, LASER: 0, THUNDER: 0, ALLRANGE: 0 };
    thunderEnergy = 0;
    currentFormation = 0;
    updateWeaponUI();
    
    wave = 0;
    score = 0;
    soloWaveTimer = 0;
    soloMobTimer = 0;
    enemyIdCounter = 0;
    combo = { count: 0, timer: 0, multiplier: 1 };
    
    walls = generateMazeWalls(0);
    
    gameState = 'playing';
    frame = 0;
    
    initAudio();
    playBGM();
    update();
}

// ========== 迷路風壁生成 ==========
function generateMazeWalls(waveNum) {
    const w = [];
    const thickness = 50;
    
    w.push({ x: 0, y: 0, w: WORLD_W, h: thickness, type: 'border' });
    w.push({ x: 0, y: WORLD_H - thickness, w: WORLD_W, h: thickness, type: 'border' });
    w.push({ x: 0, y: 0, w: thickness, h: WORLD_H, type: 'border' });
    w.push({ x: WORLD_W - thickness, y: 0, w: thickness, h: WORLD_H, type: 'border' });
    
    const gridSize = 300;
    const cellsX = Math.floor(WORLD_W / gridSize);
    const cellsY = Math.floor(WORLD_H / gridSize);
    
    for (let gx = 1; gx < cellsX - 1; gx++) {
        for (let gy = 1; gy < cellsY - 1; gy++) {
            if (gx >= cellsX/2 - 1 && gx <= cellsX/2 + 1 && gy >= cellsY/2 - 1 && gy <= cellsY/2 + 1) continue;
            
            if (Math.random() < 0.4 + waveNum * 0.02) {
                const cx = gx * gridSize + gridSize / 2;
                const cy = gy * gridSize + gridSize / 2;
                const size = 40 + Math.random() * 60;
                
                w.push({
                    x: cx - size/2, y: cy - size/2,
                    w: size, h: size,
                    type: 'cell',
                    cx: cx, cy: cy, radius: size / 2
                });
            }
        }
    }
    
    const extraCount = 20 + waveNum * 3;
    for (let i = 0; i < extraCount; i++) {
        const size = 30 + Math.random() * 50;
        const x = 150 + Math.random() * (WORLD_W - 300);
        const y = 150 + Math.random() * (WORLD_H - 300);
        
        if (Math.hypot(x - WORLD_W/2, y - WORLD_H/2) < 300) continue;
        
        let overlap = false;
        for (const wall of w) {
            if (wall.type === 'cell') {
                if (Math.hypot(x - wall.cx, y - wall.cy) < wall.radius + size/2 + 20) {
                    overlap = true; break;
                }
            }
        }
        if (overlap) continue;
        
        w.push({
            x: x - size/2, y: y - size/2, w: size, h: size,
            type: 'cell', cx: x, cy: y, radius: size / 2
        });
    }
    
    return w;
}

function checkWall(x, y) {
    for (const w of walls) {
        if (w.type === 'cell') {
            if (Math.hypot(x - w.cx, y - w.cy) < w.radius) return true;
        } else {
            if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return true;
        }
    }
    return false;
}

function getWallNormal(x, y) {
    for (const w of walls) {
        if (w.type === 'cell') {
            const dist = Math.hypot(x - w.cx, y - w.cy);
            if (dist < w.radius + 10) {
                return { x: (x - w.cx) / dist, y: (y - w.cy) / dist };
            }
        }
    }
    if (x < 60) return { x: 1, y: 0 };
    if (x > WORLD_W - 60) return { x: -1, y: 0 };
    if (y < 60) return { x: 0, y: 1 };
    if (y > WORLD_H - 60) return { x: 0, y: -1 };
    return null;
}

function escapeFromWall(entity) {
    if (!checkWall(entity.x, entity.y)) return false;
    for (let dist = 10; dist < 500; dist += 10) {
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 16) {
            const testX = entity.x + Math.cos(a) * dist;
            const testY = entity.y + Math.sin(a) * dist;
            if (!checkWall(testX, testY) && testX > 60 && testX < WORLD_W - 60 && testY > 60 && testY < WORLD_H - 60) {
                entity.x = testX;
                entity.y = testY;
                return true;
            }
        }
    }
    return false;
}

// ========== プレイヤークラス ==========
class Player {
    constructor() {
        this.x = WORLD_W / 2;
        this.y = WORLD_H / 2;
        this.r = 8;
        this.color = '#fff';
        this.maxHp = 100;
        this.hp = 100;
        this.speed = 6;
        this.angle = 0;
        this.weaponTimer = 0;
        this.dashing = false;
        this.dashTimer = 0;
        this.invincible = 60;
        this.pulsePhase = 0;
        this.history = [];
    }
    
    update() {
        if (this.invincible > 0) this.invincible--;
        this.pulsePhase += 0.1;
        
        if (checkWall(this.x, this.y) && !this.dashing) {
            if (escapeFromWall(this)) {
                createParticles(this.x, this.y, '#fff', 10);
            }
        }
        
        // ダッシュ (壁抜け実装)
        if (this.dashing) {
            this.dashTimer--;
            const vx = Math.cos(this.angle) * 28;
            const vy = Math.sin(this.angle) * 28;
            this.x += vx;
            this.y += vy;
            this.x = Math.max(60, Math.min(WORLD_W - 60, this.x));
            this.y = Math.max(60, Math.min(WORLD_H - 60, this.y));

            if (frame % 2 === 0) particles.push(new Particle(this.x, this.y, '#fff', 5, 5));
            if (this.dashTimer <= 0) this.dashing = false;
        } else {
            // モバイル操作（ジョイスティック）
            if (joystick.active && (Math.abs(joystick.dx) > 0.1 || Math.abs(joystick.dy) > 0.1)) {
                this.angle = Math.atan2(joystick.dy, joystick.dx);
                const mag = Math.min(1, Math.hypot(joystick.dx, joystick.dy));
                const vx = joystick.dx * this.speed * mag;
                const vy = joystick.dy * this.speed * mag;
                if (!checkWall(this.x + vx, this.y)) this.x += vx;
                if (!checkWall(this.x, this.y + vy)) this.y += vy;
            } 
            // PC操作（マウス追従）: クリック不要で常に追従
            else if (input.hasMoved) {
                const mx = input.x + camera.x;
                const my = input.y + camera.y;
                this.angle = Math.atan2(my - this.y, mx - this.x);
                if (Math.hypot(mx - this.x, my - this.y) > 20) {
                    const vx = Math.cos(this.angle) * this.speed;
                    const vy = Math.sin(this.angle) * this.speed;
                    if (!checkWall(this.x + vx, this.y)) this.x += vx;
                    if (!checkWall(this.x, this.y + vy)) this.y += vy;
                }
            }
        }
        
        this.history.unshift({ x: this.x, y: this.y, angle: this.angle });
        if (this.history.length > 120) this.history.pop();
        
        this.x = Math.max(60, Math.min(WORLD_W - 60, this.x));
        this.y = Math.max(60, Math.min(WORLD_H - 60, this.y));
        
        this.weaponTimer++;
        if (this.weaponTimer >= 15) {
            this.fireWeapons();
            this.weaponTimer = 0;
        }
        
        if (weaponLevels.THUNDER > 0) {
            thunderEnergy++;
            if (thunderEnergy >= THUNDER_MAX_ENERGY) {
                this.fireThunder();
                thunderEnergy = 0;
            }
        }
        
        if (activeLaser) {
            activeLaser.update();
            if (activeLaser.dead) activeLaser = null;
        }
        
        missiles.forEach(m => m.update());
        missiles = missiles.filter(m => !m.dead);
        
        options.forEach((opt, i) => opt.update(i, options.length));
    }
    
    fireWeapons() {
        this.firePlazmer();
        if (weaponLevels.HOMING > 0) this.fireHoming();
        if (weaponLevels.LASER > 0 && !activeLaser) this.fireLaser();
        
        options.forEach(opt => {
            if (currentFormation !== 3) {
                bullets.push(new PlazmerBullet({
                    x: opt.x, y: opt.y,
                    angle: opt.angle,
                    damage: 3,
                    color: '#0f0'
                }));
            }
        });
        playSound('shoot');
    }
    
    firePlazmer() {
        const lv = weaponLevels.PLAZMER;
        const count = 1 + Math.floor(lv / 1.5); 
        const maxSpread = Math.min(Math.PI * 2, lv * (Math.PI / 10)); 
        const damageBonus = Math.max(0, lv - 10);

        for (let i = 0; i < count; i++) {
            let angleOffset = 0;
            if (count > 1) {
                const range = maxSpread * (i / (count - 1)) - (maxSpread / 2);
                if (maxSpread >= Math.PI * 2 - 0.1) {
                     angleOffset = (Math.PI * 2 / count) * i;
                } else {
                    angleOffset = range;
                }
            }
            bullets.push(new PlazmerBullet({
                x: this.x, y: this.y,
                angle: this.angle + angleOffset,
                damage: 3 + damageBonus,
                color: '#fff'
            }));
        }
    }
    
    fireHoming() {
        const lv = weaponLevels.HOMING;
        const missileCount = 4 + lv * 2; 
        const damage = 4 + Math.floor(lv / 3); 
        
        for (let i = 0; i < missileCount; i++) {
            const spreadAngle = this.angle + (Math.random() - 0.5) * Math.PI; 
            const speed = 5 + Math.random() * 8;
            
            missiles.push(new MacrossMissile({
                x: this.x, y: this.y,
                vx: Math.cos(spreadAngle) * speed,
                vy: Math.sin(spreadAngle) * speed,
                damage: damage,
                color: '#a0f'
            }));
        }
        playSound('missile');
    }
    
    fireLaser() {
        const lv = weaponLevels.LASER;
        const width = Math.min(60, 3 + lv * 3); 
        const damageBonus = Math.max(0, lv - 8) * 2;
        
        activeLaser = new KamehamehaLaser({
            owner: this,
            width: width,
            damage: 3 + damageBonus,
            duration: 60,
            maxBounces: 5 + Math.floor(lv / 2)
        });
        playSound('laser');
    }
    
    fireThunder() {
        const lv = weaponLevels.THUNDER;
        let target = null, minDist = 1000;
        enemies.forEach(e => {
            if (e.hp > 0) {
                const d = Math.hypot(e.x - this.x, e.y - this.y);
                if (d < minDist) { minDist = d; target = e; }
            }
        });
        bullets.push(new ThunderBolt({
            x: this.x, y: this.y,
            target: target, angle: this.angle,
            damage: 30 + lv * 10
        }));
        playSound('thunder');
        triggerScreenShake(15);
    }
    
    dash() {
        if (!this.dashing) {
            this.dashing = true;
            this.dashTimer = 10;
            this.invincible = Math.max(this.invincible, 12);
            playSound('dash');
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(this.x, this.y, '#fff', 6, 4));
            }
        }
    }
    
    damage(val) {
        if (this.invincible > 0 || this.dashing) return;
        this.hp -= val;
        ui.hp.style.width = Math.max(0, (this.hp / this.maxHp) * 100) + '%';
        createFloatingText(this.x, this.y, `-${val}`, '#f00');
        playSound('hit');
        triggerScreenShake(10);
        this.invincible = 30;
        if (this.hp <= 0) endGame();
    }
    
    heal(val) {
        this.hp = Math.min(this.maxHp, this.hp + val);
        ui.hp.style.width = (this.hp / this.maxHp) * 100 + '%';
        createFloatingText(this.x, this.y, '+HP', '#0f0');
        playSound('heal');
    }
    
    draw() {
        const sx = this.x - camera.x + screenShake.x;
        const sy = this.y - camera.y + screenShake.y;
        
        if (weaponLevels.THUNDER > 0) {
            const gaugeWidth = 40;
            const gaugeHeight = 6;
            const gaugeX = sx - gaugeWidth / 2;
            const gaugeY = sy + this.r + 15;
            const fillRatio = thunderEnergy / THUNDER_MAX_ENERGY;
            
            ctx.fillStyle = '#220';
            ctx.fillRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);
            
            const gradient = ctx.createLinearGradient(gaugeX, gaugeY, gaugeX + gaugeWidth * fillRatio, gaugeY);
            gradient.addColorStop(0, '#880');
            gradient.addColorStop(1, '#ff0');
            ctx.fillStyle = gradient;
            ctx.fillRect(gaugeX, gaugeY, gaugeWidth * fillRatio, gaugeHeight);
            
            ctx.strokeStyle = fillRatio >= 1 ? '#ff0' : '#880';
            ctx.lineWidth = 1;
            ctx.strokeRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);
            
            if (fillRatio >= 0.8) {
                ctx.fillStyle = '#ff0';
                ctx.font = 'bold 8px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('THUNDER', sx, gaugeY + gaugeHeight + 10);
            }
        }
        
        options.forEach(opt => opt.draw());
        
        if (this.invincible % 4 < 2) {
            const pulse = Math.sin(this.pulsePhase) * 2;
            ctx.save();
            ctx.translate(sx, sy);
            ctx.shadowBlur = this.dashing ? 30 : 15;
            ctx.shadowColor = this.dashing ? '#fff' : '#0ff';
            ctx.fillStyle = this.dashing ? '#fff' : 'rgba(200,240,255,0.9)';
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI * 2 / 8) * i + this.pulsePhase * 0.3;
                const r = this.r + pulse + Math.sin(a * 3 + frame * 0.1) * 2;
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = 'rgba(100,150,200,0.8)';
            ctx.beginPath();
            ctx.arc(0, 0, this.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.rotate(this.angle);
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.moveTo(this.r + 5, 0);
            ctx.lineTo(this.r, -3);
            ctx.lineTo(this.r, 3);
            ctx.fill();
            ctx.restore();
        }
    }
}

// ========== オプション ==========
class Option {
    constructor() {
        this.x = player.x; this.y = player.y;
        this.angle = 0;
        this.orbitAngle = Math.random() * Math.PI * 2;
        this.target = null;
        this.attackTimer = 0;
    }
    
    update(index, total) {
        const formation = FORMATIONS[currentFormation];
        switch (formation) {
            case 'FOLLOW':
                const histIndex = Math.min((index + 1) * 15, player.history.length - 1);
                if (player.history[histIndex]) {
                    const target = player.history[histIndex];
                    this.x += (target.x - this.x) * 0.2;
                    this.y += (target.y - this.y) * 0.2;
                    this.angle = target.angle;
                }
                break;
            case 'GO AROUND 1':
                this.orbitAngle += 0.04;
                const baseAngle1 = (Math.PI * 2 / total) * index + this.orbitAngle;
                this.x = player.x + Math.cos(baseAngle1) * 50;
                this.y = player.y + Math.sin(baseAngle1) * 50;
                this.angle = player.angle;
                break;
            case 'GO AROUND 2':
                this.orbitAngle += 0.04;
                const baseAngle2 = (Math.PI * 2 / total) * index + this.orbitAngle;
                this.x = player.x + Math.cos(baseAngle2) * 50;
                this.y = player.y + Math.sin(baseAngle2) * 50;
                this.angle = baseAngle2;
                break;
            case 'HUNT':
                this.attackTimer++;
                if (!this.target || this.target.hp <= 0 || frame % 60 === 0) {
                    let minDist = 800;
                    this.target = null;
                    enemies.forEach(e => {
                        if (e.hp > 0) {
                            const d = Math.hypot(e.x - this.x, e.y - this.y);
                            if (d < minDist) { minDist = d; this.target = e; }
                        }
                    });
                }
                
                if (this.target && this.target.hp > 0) {
                    const toTarget = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                    const dist = Math.hypot(this.target.x - this.x, this.target.y - this.y);
                    if (dist > 60) {
                        const vx = Math.cos(toTarget) * 25;
                        const vy = Math.sin(toTarget) * 25;
                        if (!checkWall(this.x + vx, this.y + vy)) {
                            this.x += vx; this.y += vy;
                        }
                    }
                    this.angle = toTarget;
                    if (this.attackTimer >= 10) { 
                        this.attackTimer = 0;
                        bullets.push(new PlazmerBullet({
                            x: this.x, y: this.y,
                            angle: this.angle + (Math.random() - 0.5) * 0.5,
                            damage: 5, color: '#0f0'
                        }));
                    }
                } else {
                    const toPlayer = Math.atan2(player.y - this.y, player.x - this.x);
                    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
                    if (distToPlayer > 100) {
                        this.x += Math.cos(toPlayer) * 20;
                        this.y += Math.sin(toPlayer) * 20;
                    }
                    this.angle = player.angle;
                }
                break;
        }
    }
    
    draw() {
        const sx = this.x - camera.x + screenShake.x;
        const sy = this.y - camera.y + screenShake.y;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);
        ctx.fillStyle = '#0f0';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0f0';
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3); ctx.fill();
        ctx.restore();
    }
}

// ========== 弾クラス ==========

class PlazmerBullet {
    constructor(data) {
        this.x = data.x; this.y = data.y;
        this.angle = data.angle;
        this.speed = 14;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.damage = data.damage || 3;
        this.color = data.color || '#fff';
        this.size = 4;
        this.life = 60;
        this.type = 'PLAZMER';
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.life--;
        if (this.life <= 0 || checkWall(this.x, this.y)) this.dead = true;
        this.checkHit();
    }
    checkHit() {
        for (const e of enemies) {
            if (e.hp > 0 && Math.hypot(e.x - this.x, e.y - this.y) < e.size + this.size) {
                damageEnemy(e, this.damage, this.type);
                this.dead = true;
                createParticle(this.x, this.y, this.color);
                break;
            }
        }
    }
    draw() {
        const sx = this.x - camera.x; const sy = this.y - camera.y;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        ctx.beginPath(); ctx.arc(sx, sy, this.size, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class MacrossMissile {
    constructor(data) {
        this.x = data.x; this.y = data.y;
        this.vx = data.vx;
        this.vy = data.vy;
        this.damage = data.damage || 4;
        this.color = data.color || '#a0f';
        this.life = 200;
        this.type = 'HOMING';
        this.dead = false;
        this.phase = 0;
        this.timer = 0;
        this.waitTime = 10 + Math.random() * 15;
        this.trail = [];
    }
    update() {
        this.life--; this.timer++;
        if (this.life <= 0) this.dead = true;

        if (this.phase === 0) {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.92; this.vy *= 0.92;
            if (this.timer > this.waitTime) this.phase = 1;
        } else {
            let target = null, minDist = 1000;
            enemies.forEach(e => {
                if (e.hp > 0) {
                    const d = Math.hypot(e.x - this.x, e.y - this.y);
                    if (d < minDist) { minDist = d; target = e; }
                }
            });

            const maxSpeed = 18;
            const turnSpeed = 0.8;

            if (target) {
                const desiredAngle = Math.atan2(target.y - this.y, target.x - this.x);
                const currentAngle = Math.atan2(this.vy, this.vx);
                let delta = desiredAngle - currentAngle;
                while (delta < -Math.PI) delta += Math.PI * 2;
                while (delta > Math.PI) delta -= Math.PI * 2;
                const newAngle = currentAngle + Math.max(-turnSpeed, Math.min(turnSpeed, delta));
                const currentSpeed = Math.hypot(this.vx, this.vy);
                const nextSpeed = Math.min(maxSpeed, currentSpeed + 1.5);
                this.vx = Math.cos(newAngle) * nextSpeed;
                this.vy = Math.sin(newAngle) * nextSpeed;
            } else {
                this.vx *= 1.1; this.vy *= 1.1;
            }
            this.x += this.vx; this.y += this.vy;
        }

        if (checkWall(this.x, this.y)) {
            this.dead = true;
            createParticles(this.x, this.y, '#f80', 5);
        }

        for (const e of enemies) {
            if (e.hp > 0 && Math.hypot(e.x - this.x, e.y - this.y) < e.size + 10) {
                damageEnemy(e, this.damage, this.type);
                this.dead = true;
                createParticles(this.x, this.y, '#a0f', 8);
                break;
            }
        }

        this.trail.unshift({ x: this.x, y: this.y });
        if (this.trail.length > 10) this.trail.pop();
    }
    draw() {
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(100, 50, 255, 0.5)`;
            ctx.lineWidth = 2;
            for (let i = 0; i < this.trail.length; i++) {
                const p = this.trail[i];
                if (i === 0) ctx.moveTo(p.x - camera.x, p.y - camera.y);
                else ctx.lineTo(p.x - camera.x, p.y - camera.y);
            }
            ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 5; ctx.shadowColor = this.color;
        ctx.beginPath(); ctx.arc(this.x - camera.x, this.y - camera.y, 2, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class KamehamehaLaser {
    constructor(data) {
        this.owner = data.owner;
        this.width = data.width || 20;
        this.damage = data.damage || 3;
        this.duration = data.duration || 60;
        this.maxBounces = data.maxBounces || 5;
        this.life = this.duration;
        this.damageTimer = 0;
        this.type = 'LASER';
        this.segments = [];
        this.updatePath();
    }
    updatePath() {
        this.segments = [];
        let x = this.owner.x, y = this.owner.y, angle = this.owner.angle;
        let bounces = this.maxBounces, totalLength = 0;
        const maxLength = 2500, step = 20;
        this.segments.push({ x, y });
        while (totalLength < maxLength && bounces >= 0) {
            const nextX = x + Math.cos(angle) * step;
            const nextY = y + Math.sin(angle) * step;
            const normal = getWallNormal(nextX, nextY);
            if (normal && bounces > 0) {
                this.segments.push({ x, y, bounce: true });
                const dot = Math.cos(angle) * normal.x + Math.sin(angle) * normal.y;
                angle = Math.atan2(Math.sin(angle) - 2 * dot * normal.y, Math.cos(angle) - 2 * dot * normal.x);
                bounces--;
                createParticle(x, y, '#0ff');
            } else if (normal && bounces <= 0) {
                this.segments.push({ x, y }); break;
            }
            x = nextX; y = nextY; totalLength += step;
            if (totalLength % 100 < step) this.segments.push({ x, y });
        }
        this.segments.push({ x, y });
    }
    update() {
        this.life--;
        if (this.life <= 0) this.dead = true;
        this.updatePath();
        this.damageTimer++;
        if (this.damageTimer >= 3) {
            this.damageTimer = 0;
            for (let i = 0; i < this.segments.length - 1; i++) {
                const s1 = this.segments[i], s2 = this.segments[i + 1];
                enemies.forEach(e => {
                    if (e.hp > 0 && distToSegment(e.x, e.y, s1.x, s1.y, s2.x, s2.y) < e.size + this.width / 2) {
                        damageEnemy(e, this.damage, this.type);
                    }
                });
            }
        }
    }
    draw() {
        if (this.segments.length < 2) return;
        const alpha = this.life / this.duration;
        const pulse = Math.sin(frame * 0.3) * 0.2 + 1;
        const currentWidth = this.width * pulse * alpha;
        
        ctx.strokeStyle = `rgba(0,255,255,${alpha * 0.3})`;
        ctx.lineWidth = currentWidth + 30;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        this.segments.forEach((s, i) => {
            if (i === 0) ctx.moveTo(s.x - camera.x, s.y - camera.y);
            else ctx.lineTo(s.x - camera.x, s.y - camera.y);
        });
        ctx.stroke();
        
        ctx.strokeStyle = `rgba(0,255,255,${alpha * 0.8})`;
        ctx.lineWidth = currentWidth;
        ctx.shadowBlur = 30; ctx.shadowColor = '#0ff';
        ctx.stroke();
        
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = currentWidth * 0.4;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

class ThunderBolt {
    constructor(data) {
        this.x = data.x; this.y = data.y;
        this.target = data.target;
        this.angle = data.angle;
        this.damage = data.damage || 30;
        this.color = '#ff0';
        this.life = 30;
        this.type = 'THUNDER';
        this.points = [{ x: this.x, y: this.y }];
        this.targetX = this.target ? this.target.x : this.x + Math.cos(this.angle) * 600;
        this.targetY = this.target ? this.target.y : this.y + Math.sin(this.angle) * 600;
        this.hitEnemies = new Set();
        this.progress = 0;
        this.generatePath();
    }
    generatePath() {
        const segments = 15;
        const perpAngle = Math.atan2(this.targetY - this.y, this.targetX - this.x) + Math.PI / 2;
        for (let i = 1; i <= segments; i++) {
            const progress = i / segments;
            const baseX = this.x + (this.targetX - this.x) * progress;
            const baseY = this.y + (this.targetY - this.y) * progress;
            const zigzag = (i % 2 === 0 ? 1 : -1) * (40 + Math.random() * 30);
            this.points.push({ x: baseX + Math.cos(perpAngle) * zigzag, y: baseY + Math.sin(perpAngle) * zigzag });
        }
    }
    update() {
        this.life--; if (this.life <= 0) this.dead = true;
        if (this.target && this.target.hp > 0) {
            this.targetX = this.target.x; this.targetY = this.target.y;
        }
        this.points.forEach((p, i) => {
            if (i > 0 && i < this.points.length - 1) {
                p.x += (Math.random() - 0.5) * 15;
                p.y += (Math.random() - 0.5) * 15;
            }
        });
        this.progress = Math.min(1, this.progress + 0.2);
        const currentSegment = Math.floor(this.progress * (this.points.length - 1));
        for (let i = 0; i <= currentSegment && i < this.points.length - 1; i++) {
            const p1 = this.points[i], p2 = this.points[i + 1];
            enemies.forEach(e => {
                if (e.hp > 0 && !this.hitEnemies.has(e.id)) {
                    if (distToSegment(e.x, e.y, p1.x, p1.y, p2.x, p2.y) < e.size + 25) {
                        damageEnemy(e, this.damage, this.type);
                        this.hitEnemies.add(e.id);
                        createParticles(e.x, e.y, '#ff0', 15);
                    }
                }
            });
        }
    }
    draw() {
        const alpha = this.life / 30;
        const currentSegment = Math.floor(this.progress * (this.points.length - 1));
        ctx.strokeStyle = `rgba(255,255,0,${alpha * 0.4})`;
        ctx.lineWidth = 25; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let i = 0; i <= currentSegment && i < this.points.length; i++) {
            const p = this.points[i];
            if (i === 0) ctx.moveTo(p.x - camera.x, p.y - camera.y);
            else ctx.lineTo(p.x - camera.x, p.y - camera.y);
        }
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,0,${alpha})`;
        ctx.lineWidth = 8; ctx.shadowBlur = 35; ctx.shadowColor = '#ff0'; ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 3; ctx.stroke(); ctx.shadowBlur = 0;
    }
}

// ========== 敵生成 (難易度調整) ==========
function spawnEnemy(type, x, y) {
    const template = ENEMY_TYPES[type];
    if (!template) return null;
    
    let waveScale = 1 + wave * 0.1;
    let speedMult = 1;

    // WAVE 20以降: 急激な難易度上昇
    if (wave > 20) {
        // HP倍率: (wave-20)の二乗で増加
        const hardModeFactor = 1 + Math.pow((wave - 20) * 0.1, 2);
        waveScale *= hardModeFactor;
        // スピード倍率
        speedMult = 1.3 + Math.min(0.5, (wave - 20) * 0.02);
    }
    
    const enemy = {
        id: 'e_' + (enemyIdCounter++),
        type, x, y,
        hp: Math.floor(template.hp * waveScale),
        maxHp: Math.floor(template.hp * waveScale),
        speed: Math.min(template.speed * 2.5 * speedMult, (template.speed + wave * 0.05) * speedMult),
        size: template.size,
        color: template.color,
        score: template.score,
        name: template.name,
        shoots: template.shoots || false,
        armor: template.armor || false,
        divides: template.divides || false,
        isBoss: false,
        timer: Math.floor(Math.random() * 60),
        phase: Math.random() * Math.PI * 2
    };
    enemies.push(enemy);
    return enemy;
}

function spawnBoss() {
    let template, bossIndex;
    if (wave >= 100) {
        bossIndex = (Math.floor((wave - 100) / 10)) % MEGA_BOSS_TYPES.length;
        template = MEGA_BOSS_TYPES[bossIndex];
    } else {
        bossIndex = (wave - 1) % BOSS_TYPES.length;
        template = BOSS_TYPES[bossIndex];
    }
    
    let waveScale = 1 + Math.floor(wave / 5) * 0.5;
    // WAVE 20以降のボス強化
    if (wave > 20) {
        waveScale *= (1 + (wave - 20) * 0.3); 
    }
    
    const pos = findSafeSpawnPosition(500);
    
    const boss = {
        id: 'boss_' + (enemyIdCounter++),
        type: 'boss',
        bossType: bossIndex,
        pattern: template.pattern,
        x: pos.x, y: pos.y,
        hp: Math.floor(template.baseHp * waveScale),
        maxHp: Math.floor(template.baseHp * waveScale),
        speed: 1.5,
        size: template.size + Math.floor(wave / 5) * 2,
        color: template.color,
        score: 3000 + wave * 500,
        name: template.name,
        isBoss: true,
        timer: 0, attackTimer: 0, phase: 0,
        isMega: wave >= 100
    };
    
    enemies.push(boss);
    currentBoss = boss;
    
    ui.bossContainer.style.display = 'block';
    showMessage(`◆ ${boss.name} APPEARED ◆`);
    triggerScreenShake(wave >= 100 ? 40 : 20);
    playSound('bossAppear');
    return boss;
}

function findSafeSpawnPosition(minDist) {
    for (let i = 0; i < 50; i++) {
        const x = 150 + Math.random() * (WORLD_W - 300);
        const y = 150 + Math.random() * (WORLD_H - 300);
        if (checkWall(x, y)) continue;
        if (player && Math.hypot(player.x - x, player.y - y) < minDist) continue;
        return { x, y };
    }
    return { x: WORLD_W - 300, y: WORLD_H - 300 };
}

function updateEnemies() {
    enemies.forEach(enemy => {
        if (enemy.hp <= 0) return;
        enemy.timer++;
        
        if (checkWall(enemy.x, enemy.y)) escapeFromWall(enemy);
        
        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        const vx = Math.cos(angle) * enemy.speed;
        const vy = Math.sin(angle) * enemy.speed;
        
        if (!checkWall(enemy.x + vx, enemy.y + vy)) {
            enemy.x += vx; enemy.y += vy;
        } else {
            if (!checkWall(enemy.x + vx, enemy.y)) enemy.x += vx;
            else if (!checkWall(enemy.x, enemy.y + vy)) enemy.y += vy;
        }
        
        if (player && Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.r + enemy.size) {
            if (!player.dashing && player.invincible <= 0) {
                player.damage(enemy.isBoss ? 20 : 10);
            }
        }
        
        if (enemy.shoots && enemy.timer % 90 === 0) {
            const a = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemyBullets.push({ x: enemy.x, y: enemy.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 5, color: enemy.color });
            playSound('enemyShoot');
        }
        
        if (enemy.isBoss) {
            enemy.attackTimer++;
            bossAttack(enemy);
        }
    });
}

// ========== ボス攻撃パターン ==========
function bossAttack(boss) {
    const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
    switch (boss.pattern) {
        case 'radial':
            if (boss.attackTimer % 60 === 0) {
                for (let i = 0; i < 16; i++) {
                    const a = (Math.PI * 2 / 16) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 150, size: 6, color: boss.color });
                }
                boss.phase += 0.2; playSound('bossAttack');
            }
            break;
        case 'spiral':
            if (boss.attackTimer % 8 === 0) {
                const a = boss.timer * 0.15;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 5, color: boss.color });
            }
            break;
        case 'burst':
            if (boss.attackTimer % 40 === 0) {
                for (let i = 0; i < 8; i++) {
                    const a = angle + (Math.random() - 0.5) * 0.8;
                    const speed = 4 + Math.random() * 3;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 60, size: 8, color: '#f80' });
                }
                playSound('bossAttack');
            }
            break;
        case 'divide':
            if (boss.attackTimer % 90 === 0) {
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI * 2 / 6) * i;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 90, size: 10, color: boss.color, splits: true, splitTimer: 45 });
                }
                playSound('bossAttack');
            }
            break;
        case 'swarm':
            if (boss.attackTimer % 5 === 0) {
                const a = angle + (Math.random() - 0.5) * 1.5;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, life: 80, size: 4, color: boss.color });
            }
            break;
        case 'laser':
            if (boss.attackTimer % 120 === 0) {
                for (let i = 0; i < 4; i++) {
                    const a = (Math.PI * 2 / 4) * i + boss.phase;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, life: 150, size: 6, color: '#0ff', bounces: 3, isLaser: true });
                }
                boss.phase += 0.3; triggerScreenShake(15); playSound('bossLaser');
            }
            break;
        case 'chaos':
            if (boss.attackTimer % 30 === 0) {
                const pattern = Math.floor(boss.attackTimer / 30) % 4;
                if(pattern===0) for(let i=0;i<12;i++) { const a=(Math.PI*2/12)*i; enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:120,size:6,color:'#f00'}); }
                else if(pattern===1) for(let i=0;i<3;i++) enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(angle)*3,vy:Math.sin(angle)*3,life:180,size:8,color:'#a0f',homing:true});
                else if(pattern===2) for(let i=0;i<20;i++) { const a=Math.random()*Math.PI*2; const s=2+Math.random()*4; enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:100,size:5,color:'#ff0'}); }
                else for(let i=0;i<8;i++) { const a1=boss.timer*0.1+(Math.PI*2/8)*i; enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a1)*5,vy:Math.sin(a1)*5,life:100,size:5,color:'#0f0'}); }
                playSound('bossAttack');
            }
            break;
        case 'all':
            if (boss.attackTimer % 20 === 0) {
                const a = boss.timer * 0.12;
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 150, size: 5, color: '#fff' });
                enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a + Math.PI) * 4, vy: Math.sin(a + Math.PI) * 4, life: 150, size: 5, color: '#fff' });
            }
            if (boss.attackTimer % 60 === 0) {
                for (let i = 0; i < 24; i++) {
                    const a = (Math.PI * 2 / 24) * i;
                    enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 120, size: 6, color: '#f00' });
                }
                triggerScreenShake(20); playSound('bossAttack');
            }
            if (boss.attackTimer % 120 === 0) {
                for (let i = 0; i < 4; i++) {
                    const types = Object.keys(ENEMY_TYPES);
                    const type = types[Math.floor(Math.random() * types.length)];
                    const a = (Math.PI * 2 / 4) * i;
                    spawnEnemy(type, boss.x + Math.cos(a) * 100, boss.y + Math.sin(a) * 100);
                }
            }
            break;
        case 'mega1':
        case 'mega2':
        case 'mega3':
        case 'final':
            // 簡易実装としてオールレンジ攻撃を混ぜる
             if (boss.attackTimer % 20 === 0) {
                for(let i=0;i<16;i++){
                    const a=(Math.PI*2/16)*i + boss.phase;
                    enemyBullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,life:150,size:7,color:'#f00'});
                }
                boss.phase+=0.1;
            }
            break;
    }
}

function damageEnemy(enemy, damage, weaponType) {
    if (enemy.hp <= 0) return;
    if (enemy.armor && weaponType !== 'THUNDER' && weaponType !== 'LASER') damage = Math.floor(damage / 2);
    enemy.hp -= damage;
    createFloatingText(enemy.x, enemy.y - enemy.size, `-${damage}`, '#fff');
    if (enemy.hp <= 0) defeatEnemy(enemy);
}

function defeatEnemy(enemy) {
    createParticles(enemy.x, enemy.y, enemy.color, enemy.isBoss ? 50 : 15);
    playSound(enemy.isBoss ? 'bossDefeat' : 'enemyDefeat');
    addCombo();
    score += Math.floor(enemy.score * combo.multiplier);
    ui.score.textContent = score;
    dropItems(enemy.x, enemy.y, enemy.isBoss);
    
    if (enemy.divides && !enemy.isBoss) {
        for (let i = 0; i < 2; i++) {
            const a = Math.random() * Math.PI * 2;
            spawnEnemy('virus', enemy.x + Math.cos(a) * 30, enemy.y + Math.sin(a) * 30);
        }
    }
    
    if (enemy.isBoss) {
        // ボス撃破時の処理（全ボス撃破判定は update() で行う）
    }
}

function dropItems(x, y, isBoss) {
    const itemColors = { PLAZMER: '#fff', HOMING: '#a0f', LASER: '#0ff', THUNDER: '#ff0', ALLRANGE: '#0f0', H: '#f06' };
    if (isBoss) {
        const count = 5 + Math.floor(Math.random() * 3);
        const types = ['PLAZMER', 'HOMING', 'LASER', 'THUNDER', 'ALLRANGE', 'H'];
        for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i;
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({ x: x + Math.cos(a) * 60, y: y + Math.sin(a) * 60, type, color: itemColors[type] });
        }
    } else {
        if (Math.random() < 0.10) {
            const types = ['PLAZMER', 'HOMING', 'LASER', 'THUNDER'];
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({ x, y, type, color: itemColors[type] });
        }
        if (Math.random() < 0.04) items.push({ x, y, type: 'H', color: '#f06' });
        if (Math.random() < 0.03) items.push({ x, y, type: 'ALLRANGE', color: '#0f0' });
    }
}

function updateItems() {
    items = items.filter(item => {
        if (player && Math.hypot(player.x - item.x, player.y - item.y) < 150) {
            item.x += (player.x - item.x) * 0.1;
            item.y += (player.y - item.y) * 0.1;
        }
        if (player && Math.hypot(player.x - item.x, player.y - item.y) < player.r + 12) {
            collectItem(item.type);
            createFloatingText(item.x, item.y, item.type + '!', item.color);
            playSound('powerup');
            return false;
        }
        return true;
    });
}

function collectItem(type) {
    if (type === 'H') player.heal(30);
    else if (type === 'ALLRANGE') {
        if (options.length < 6) options.push(new Option());
        weaponLevels.ALLRANGE++;
    } else {
        weaponLevels[type] = (weaponLevels[type] || 0) + 1;
    }
    updateWeaponUI();
}

function updateWeaponUI() {
    const lv = weaponLevels.PLAZMER;
    const dirs = Math.min(10, lv);
    ui.weapons.plazmer.classList.add('active');
    ui.weapons.plazmer.textContent = dirs >= 10 ? `PLAZMER 360° Lv${lv}` : `PLAZMER ${dirs}way`;
    
    ui.weapons.homing.classList.toggle('locked', weaponLevels.HOMING <= 0);
    ui.weapons.homing.classList.toggle('active', weaponLevels.HOMING > 0);
    const missileCount = 4 + weaponLevels.HOMING * 2;
    ui.weapons.homing.textContent = weaponLevels.HOMING > 0 ? `HOMING x${missileCount}` : 'HOMING';
    
    ui.weapons.laser.classList.toggle('locked', weaponLevels.LASER <= 0);
    ui.weapons.laser.classList.toggle('active', weaponLevels.LASER > 0);
    const laserWidth = Math.min(8, weaponLevels.LASER);
    // 名称変更: KAMEHAMEHA -> LASER (MAX)
    ui.weapons.laser.textContent = weaponLevels.LASER > 0 ? (laserWidth >= 8 ? `LASER (MAX)` : `LASER W${laserWidth}`) : 'LASER';
    
    ui.weapons.thunder.classList.toggle('locked', weaponLevels.THUNDER <= 0);
    ui.weapons.thunder.classList.toggle('active', weaponLevels.THUNDER > 0);
    ui.weapons.thunder.textContent = weaponLevels.THUNDER > 0 ? `THUNDER Lv${weaponLevels.THUNDER}` : 'THUNDER';
    
    ui.weapons.allrange.classList.toggle('locked', weaponLevels.ALLRANGE <= 0);
    ui.weapons.allrange.classList.toggle('active', weaponLevels.ALLRANGE > 0);
    ui.weapons.allrange.textContent = weaponLevels.ALLRANGE > 0 ? `ALL-RANGE x${options.length}` : 'ALL-RANGE';
    
    ui.formationDisplay.textContent = `FORMATION: ${FORMATIONS[currentFormation]}`;
}

// ========== WAVE管理 ==========
function startWave() {
    wave++;
    walls = generateMazeWalls(wave);
    if (player && checkWall(player.x, player.y)) {
        escapeFromWall(player);
        createParticles(player.x, player.y, '#fff', 10);
    }
    ui.wave.textContent = wave;
    showMessage(`◆ WAVE ${wave} ◆`);
    
    let bossCount = 1;
    if (wave >= 50) bossCount = 3;
    else if (wave >= 20) bossCount = 2;
    if (wave % 10 === 0) bossCount += 1;

    if (wave >= 100 && wave % 10 === 0) showMessage(`◆ MEGA BOSS INCOMING (x${bossCount}) ◆`);
    
    setTimeout(() => {
        if (gameState === 'playing') {
            for(let i = 0; i < bossCount; i++) {
                spawnBoss();
            }
        }
    }, 1500);
}

function spawnMobs() {
    const activeBosses = enemies.filter(e => e.isBoss && e.hp > 0);
    if (activeBosses.length === 0) return;
    
    const maxMobs = Math.min(150, 30 + wave * 2); 
    const mobCount = enemies.filter(e => !e.isBoss && e.hp > 0).length;
    if (mobCount >= maxMobs) return;
    
    const batchSize = 1 + Math.floor(wave / 10); 
    for(let i = 0; i < batchSize; i++) {
        const pos = findSafeSpawnPosition(250);
        const types = ['virus', 'bacteria'];
        if (wave >= 2) types.push('infected', 'toxin');
        if (wave >= 4) types.push('mutant', 'parasite');
        if (wave >= 6) types.push('cancer');
        if (wave >= 8) types.push('tumor', 'plague');
        if (wave >= 10) types.push('necrosis');
        const type = types[Math.floor(Math.random() * types.length)];
        spawnEnemy(type, pos.x, pos.y);
    }
}

function updateEnemyBullets() {
    enemyBullets.forEach(b => {
        if (b.homing && player) {
            const a = Math.atan2(player.y - b.y, player.x - b.x);
            let d = a - Math.atan2(b.vy, b.vx);
            while (d < -Math.PI) d += Math.PI * 2;
            while (d > Math.PI) d -= Math.PI * 2;
            const speed = Math.hypot(b.vx, b.vy);
            const newAngle = Math.atan2(b.vy, b.vx) + d * 0.04;
            b.vx = Math.cos(newAngle) * speed;
            b.vy = Math.sin(newAngle) * speed;
        }
        if (b.bounces && b.bounces > 0) {
            const normal = getWallNormal(b.x + b.vx, b.y + b.vy);
            if (normal) {
                const dot = b.vx * normal.x + b.vy * normal.y;
                b.vx = b.vx - 2 * dot * normal.x;
                b.vy = b.vy - 2 * dot * normal.y;
                b.bounces--;
            }
        }
        b.x += b.vx; b.y += b.vy; b.life--;
        if (b.splits && b.splitTimer) {
            b.splitTimer--;
            if (b.splitTimer <= 0) {
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI * 2 / 6) * i;
                    enemyBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, life: 60, size: 5, color: b.color });
                }
                b.dead = true;
            }
        }
        if (b.life <= 0 || (checkWall(b.x, b.y) && !b.bounces)) b.dead = true;
        if (player && Math.hypot(player.x - b.x, player.y - b.y) < player.r + b.size) {
            player.damage(8);
            b.dead = true;
        }
    });
    enemyBullets = enemyBullets.filter(b => !b.dead);
}

function cycleFormation() {
    currentFormation = (currentFormation + 1) % FORMATIONS.length;
    ui.formationDisplay.textContent = `FORMATION: ${FORMATIONS[currentFormation]}`;
    showMessage(FORMATIONS[currentFormation]);
    playSound('switch');
}

function distToSegment(px, py, x1, y1, x2, y2) {
    const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let t = lenSq !== 0 ? Math.max(0, Math.min(1, dot / lenSq)) : 0;
    return Math.hypot(px - (x1 + t * C), py - (y1 + t * D));
}

class Particle {
    constructor(x, y, color, size, life) {
        this.x = x; this.y = y; this.color = color;
        this.size = size || 3; this.life = life || 20; this.maxLife = this.life;
        this.vx = (Math.random() - 0.5) * 6; this.vy = (Math.random() - 0.5) * 6;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vx *= 0.95; this.vy *= 0.95; this.life--;
    }
    draw() {
        const alpha = this.life / this.maxLife;
        ctx.fillStyle = this.color; ctx.globalAlpha = alpha;
        ctx.beginPath(); ctx.arc(this.x - camera.x, this.y - camera.y, this.size * alpha, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function createParticle(x, y, color) { particles.push(new Particle(x, y, color, 4, 15)); }
function createParticles(x, y, color, count) { for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, 3 + Math.random() * 4, 15 + Math.random() * 15)); }

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x; this.y = y; this.text = text; this.color = color;
        this.life = 40; this.vy = -2;
    }
    update() { this.y += this.vy; this.vy *= 0.95; this.life--; }
    draw() {
        const alpha = this.life / 40;
        ctx.fillStyle = this.color; ctx.globalAlpha = alpha;
        ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x - camera.x, this.y - camera.y);
        ctx.globalAlpha = 1;
    }
}
function createFloatingText(x, y, text, color) { texts.push(new FloatingText(x, y, text, color)); }

function showMessage(text) {
    ui.message.textContent = text;
    ui.message.style.opacity = 1;
    setTimeout(() => ui.message.style.opacity = 0, 2000);
}
function triggerScreenShake(intensity) { screenShake.intensity = Math.max(screenShake.intensity, intensity); }
function updateScreenShake() {
    if (screenShake.intensity > 0) {
        screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.intensity *= 0.9;
        if (screenShake.intensity < 0.5) screenShake.intensity = 0;
    } else { screenShake.x = 0; screenShake.y = 0; }
}
function addCombo() {
    combo.count++; combo.timer = 120;
    combo.multiplier = 1 + Math.floor(combo.count / 5) * 0.5;
    if (combo.multiplier > 5) combo.multiplier = 5;
}
function updateCombo() {
    if (combo.timer > 0) {
        combo.timer--;
        if (combo.timer === 0) { combo.count = 0; combo.multiplier = 1; }
    }
}
function triggerDash() { if (player && gameState === 'playing') player.dash(); }

function endGame() {
    gameState = 'over'; stopBGM();
    ui.gameOver.style.display = 'flex';
    document.getElementById('final-score').textContent = `SCORE: ${score}`;
    playSound('gameOver');
}
function updateCamera() {
    if (!player) return;
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;
    camera.x = Math.max(0, Math.min(WORLD_W - canvas.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H - canvas.height, camera.y));
}
function drawEnemyIndicators() {
    const margin = 50;
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        const sx = e.x - camera.x; const sy = e.y - camera.y;
        if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) {
            const angle = Math.atan2(e.y - player.y, e.x - player.x);
            const dist = Math.hypot(e.x - player.x, e.y - player.y);
            let indicatorX = canvas.width / 2 + Math.cos(angle) * (canvas.width / 2 - margin);
            let indicatorY = canvas.height / 2 + Math.sin(angle) * (canvas.height / 2 - margin);
            indicatorX = Math.max(margin, Math.min(canvas.width - margin, indicatorX));
            indicatorY = Math.max(margin, Math.min(canvas.height - margin, indicatorY));
            ctx.save(); ctx.translate(indicatorX, indicatorY); ctx.rotate(angle);
            ctx.fillStyle = e.isBoss ? '#ff0' : '#f00';
            ctx.shadowBlur = 10; ctx.shadowColor = e.isBoss ? '#ff0' : '#f00';
            ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-8, 10); ctx.lineTo(-3, 0); ctx.lineTo(-8, -10); ctx.fill();
            ctx.restore();
            if (e.isBoss) {
                ctx.fillStyle = '#ff0'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
                ctx.fillText('BOSS', indicatorX, indicatorY + 25);
                ctx.fillText(Math.floor(dist) + 'm', indicatorX, indicatorY + 38);
            }
        }
    });
}
function draw() {
    ctx.fillStyle = '#000810'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(100,20,30,0.3)'; ctx.lineWidth = 1;
    const gridSize = 80;
    for (let x = -camera.x % gridSize; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
    for (let y = -camera.y % gridSize; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
    walls.forEach(w => {
        const sx = w.x - camera.x + screenShake.x; const sy = w.y - camera.y + screenShake.y;
        if (w.type === 'cell') {
            ctx.fillStyle = 'rgba(150,30,50,0.8)'; ctx.strokeStyle = '#f66'; ctx.lineWidth = 3;
            ctx.shadowBlur = 15; ctx.shadowColor = '#f00';
            ctx.beginPath(); ctx.arc(w.cx - camera.x + screenShake.x, w.cy - camera.y + screenShake.y, w.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = 'rgba(100,20,30,0.5)'; ctx.beginPath(); ctx.arc(w.cx - camera.x + screenShake.x, w.cy - camera.y + screenShake.y, w.radius * 0.4, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = 'rgba(100,30,50,0.9)'; ctx.strokeStyle = '#f88'; ctx.lineWidth = 3;
            ctx.shadowBlur = 15; ctx.shadowColor = '#f44';
            ctx.fillRect(sx, sy, w.w, w.h); ctx.strokeRect(sx, sy, w.w, w.h);
        }
        ctx.shadowBlur = 0;
    });
    items.forEach(item => {
        const sx = item.x - camera.x + screenShake.x; const sy = item.y - camera.y + screenShake.y;
        ctx.fillStyle = item.color; ctx.shadowBlur = 15; ctx.shadowColor = item.color;
        if (item.type === 'H') {
            ctx.beginPath(); ctx.moveTo(sx, sy - 3); ctx.bezierCurveTo(sx - 8, sy - 10, sx - 15, sy, sx, sy + 10); ctx.bezierCurveTo(sx + 15, sy, sx + 8, sy - 10, sx, sy - 3); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(sx, sy, 10 + Math.sin(frame * 0.1) * 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.font = 'bold 9px Courier New'; ctx.textAlign = 'center'; ctx.fillText(item.type[0], sx, sy + 3);
        }
        ctx.shadowBlur = 0;
    });
    if (activeLaser) activeLaser.draw();
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        const sx = e.x - camera.x + screenShake.x; const sy = e.y - camera.y + screenShake.y;
        if (e.isBoss) drawBoss(e, sx, sy); else drawEnemy(e, sx, sy);
    });
    enemyBullets.forEach(b => {
        const sx = b.x - camera.x + screenShake.x; const sy = b.y - camera.y + screenShake.y;
        ctx.fillStyle = b.color; ctx.shadowBlur = 10; ctx.shadowColor = b.color;
        ctx.beginPath(); ctx.arc(sx, sy, b.size, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    });
    bullets.forEach(b => { if (!b.dead) b.draw(); });
    missiles.forEach(m => { if (!m.dead) m.draw(); });
    particles.forEach(p => p.draw());
    texts.forEach(t => t.draw());
    if (player) player.draw();
    drawEnemyIndicators();
    if (combo.count > 0) {
        ctx.fillStyle = combo.multiplier >= 3 ? '#f00' : '#0ff';
        ctx.font = 'bold 20px Courier New'; ctx.textAlign = 'right';
        ctx.fillText(`${combo.count} CHAIN x${combo.multiplier.toFixed(1)}`, canvas.width - 20, canvas.height - 80);
    }
    drawMinimap();
}
function drawEnemy(e, sx, sy) {
    ctx.save(); ctx.translate(sx, sy);
    const pulse = Math.sin(frame * 0.1 + e.phase) * 2;
    ctx.fillStyle = e.color; ctx.shadowBlur = 10; ctx.shadowColor = e.color;
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
        const a = (Math.PI * 2 / 12) * i + frame * 0.02; const r = e.size + (i % 2 === 0 ? 4 + pulse : 0);
        const px = Math.cos(a) * r; const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(0, 0, e.size * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const hpRatio = e.hp / e.maxHp;
    ctx.fillStyle = '#300'; ctx.fillRect(sx - e.size, sy - e.size - 10, e.size * 2, 4);
    ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : hpRatio > 0.25 ? '#ff0' : '#f00';
    ctx.fillRect(sx - e.size, sy - e.size - 10, e.size * 2 * hpRatio, 4);
    ctx.fillStyle = '#fff'; ctx.font = '10px Courier New'; ctx.textAlign = 'center'; ctx.fillText(e.hp, sx, sy - e.size - 14);
}
function drawBoss(boss, sx, sy) {
    ctx.save(); ctx.translate(sx, sy);
    const pulse = Math.sin(frame * 0.05) * 5;
    ctx.strokeStyle = boss.color; ctx.lineWidth = 3; ctx.shadowBlur = 30; ctx.shadowColor = boss.color;
    ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(0, 0, boss.size + 20 + pulse, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.rotate(frame * 0.02); ctx.strokeStyle = boss.color; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i; const r = boss.size + 10;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.stroke();
    ctx.rotate(-frame * 0.02); ctx.fillStyle = boss.color; ctx.shadowBlur = 20; ctx.beginPath();
    for (let i = 0; i < 16; i++) {
        const a = (Math.PI * 2 / 16) * i + frame * 0.01; const r = boss.size + (i % 2 === 0 ? 8 + pulse : 0);
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, boss.size * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, boss.size * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}
function drawMinimap() {
    const mapW = 120, mapH = 120;
    const mapX = canvas.width - mapW - 10; const mapY = canvas.height - mapH - 10; const scale = mapW / WORLD_W;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(mapX, mapY, mapW, mapH);
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.strokeRect(mapX, mapY, mapW, mapH);
    ctx.fillStyle = 'rgba(255,100,100,0.5)';
    walls.forEach(w => {
        if (w.type === 'cell') {
            ctx.beginPath(); ctx.arc(mapX + w.cx * scale, mapY + w.cy * scale, w.radius * scale, 0, Math.PI * 2); ctx.fill();
        } else { ctx.fillRect(mapX + w.x * scale, mapY + w.y * scale, w.w * scale, w.h * scale); }
    });
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        ctx.fillStyle = e.isBoss ? '#ff0' : e.color;
        ctx.beginPath(); ctx.arc(mapX + e.x * scale, mapY + e.y * scale, e.isBoss ? 4 : 2, 0, Math.PI * 2); ctx.fill();
    });
    if (player) {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mapX + player.x * scale, mapY + player.y * scale, 3, 0, Math.PI * 2); ctx.fill();
    }
}
let audioCtx = null;
let bgmOsc = null;
let bgmGain = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playBGM() {
    if (!audioCtx) return;
    bgmGain = audioCtx.createGain(); bgmGain.gain.setValueAtTime(0.05, audioCtx.currentTime); bgmGain.connect(audioCtx.destination);
    bgmOsc = audioCtx.createOscillator(); bgmOsc.type = 'sine'; bgmOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
    bgmOsc.connect(bgmGain); bgmOsc.start();
}
function stopBGM() { if (bgmOsc) { bgmOsc.stop(); bgmOsc = null; } }
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    switch (type) {
        case 'shoot': osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08); break;
        case 'laser': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); break;
        case 'missile': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); break;
        case 'thunder': osc.type = 'square'; osc.frequency.setValueAtTime(80, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); break;
        case 'explode': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); break;
        case 'powerup': osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); break;
        case 'dash': osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); break;
        case 'hit': osc.type = 'square'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); break;
        case 'heal': osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); break;
        case 'bomb': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); break;
        case 'switch': osc.frequency.setValueAtTime(500, audioCtx.currentTime); osc.frequency.setValueAtTime(700, audioCtx.currentTime + 0.05); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); break;
        case 'enemyShoot': osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); break;
        case 'enemyDefeat': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); break;
        case 'bossAppear': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.5); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1); osc.start(); osc.stop(audioCtx.currentTime + 1); break;
        case 'bossAttack': osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); break;
        case 'bossLaser': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1); osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.4); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); break;
        case 'bossDefeat': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.8); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8); osc.start(); osc.stop(audioCtx.currentTime + 0.8); break;
        case 'gameOver': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1.5); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5); osc.start(); osc.stop(audioCtx.currentTime + 1.5); break;
    }
}
function initMobileControls() {
    const joystickZone = document.getElementById('joystick-zone');
    const stick = document.getElementById('joystick-stick');
    let startX, startY;
    joystickZone.addEventListener('touchstart', e => { e.preventDefault(); const touch = e.touches[0]; const rect = joystickZone.getBoundingClientRect(); startX = rect.left + rect.width / 2; startY = rect.top + rect.height / 2; joystick.active = true; });
    joystickZone.addEventListener('touchmove', e => { e.preventDefault(); if (!joystick.active) return; const touch = e.touches[0]; const dx = touch.clientX - startX; const dy = touch.clientY - startY; const dist = Math.hypot(dx, dy); const maxDist = 45; const clampedDist = Math.min(dist, maxDist); const angle = Math.atan2(dy, dx); joystick.dx = (clampedDist / maxDist) * Math.cos(angle); joystick.dy = (clampedDist / maxDist) * Math.sin(angle); stick.style.transform = `translate(calc(-50% + ${joystick.dx * maxDist}px), calc(-50% + ${joystick.dy * maxDist}px))`; });
    joystickZone.addEventListener('touchend', () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; stick.style.transform = 'translate(-50%, -50%)'; });
    document.getElementById('btn-dash').addEventListener('touchstart', e => { e.preventDefault(); triggerDash(); });
    // ボムボタンのタッチイベントも削除
    document.getElementById('btn-form').addEventListener('touchstart', e => { e.preventDefault(); cycleFormation(); });
}

function update() {
    if (gameState !== 'playing') return;
    try {
        frame++;
        if (player) { player.update(); updateCamera(); }
        soloWaveTimer++; soloMobTimer++;
        if (wave === 0 && soloWaveTimer > 60) startWave();
        
        const activeBosses = enemies.filter(e => e.isBoss && e.hp > 0);
        if (activeBosses.length > 0 && soloMobTimer >= 60) {
            soloMobTimer = 0;
            spawnMobs();
        }
        
        updateEnemies();
        enemies = enemies.filter(e => e.hp > 0);
        
        const bossCheck = enemies.filter(e => e.isBoss && e.hp > 0);
        if (bossCheck.length > 0) {
            ui.bossContainer.style.display = 'block';
            let totalHp = 0, totalMaxHp = 0;
            bossCheck.forEach(boss => { totalHp += boss.hp; totalMaxHp += boss.maxHp; });
            ui.bossHp.style.width = (totalHp / totalMaxHp * 100) + '%';
            ui.bossName.textContent = `BOSS DANGER x${bossCheck.length}`;
        } else {
            ui.bossContainer.style.display = 'none';
            if (currentBoss && currentBoss.hp <= 0 && enemies.filter(e=>e.isBoss).length===0 && wave > 0) {
                currentBoss = null;
                showMessage('◆ PATHOGEN ELIMINATED ◆');
                triggerScreenShake(40);
                enemies.forEach(e => { if (!e.isBoss && e.hp > 0) { e.hp = 0; score += 50; } });
                ui.score.textContent = score;
                setTimeout(() => { if (gameState === 'playing') startWave(); }, 3000);
            }
        }
        
        bullets.forEach(b => { if (!b.dead) b.update(); });
        bullets = bullets.filter(b => !b.dead);
        updateEnemyBullets();
        updateItems();
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);
        texts.forEach(t => t.update());
        texts = texts.filter(t => t.life > 0);
        updateCombo();
        updateScreenShake();
        draw();
        requestAnimationFrame(update);
    } catch (e) {
        console.error(e);
        requestAnimationFrame(update);
    }
}

init();
