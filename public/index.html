<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PLAZMERS Ver.1.004</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action: none; }
        #canvas { display: block; background: #0a0a15; }
        #menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #menu h1 { font-size: 42px; color: #0ff; text-shadow: 0 0 30px #0ff, 0 0 60px #08f; margin-bottom: 10px; letter-spacing: 8px; }
        #menu .version { font-size: 14px; color: #888; margin-bottom: 30px; }
        #menu input { width: 200px; padding: 12px; font-size: 18px; background: #111; border: 2px solid #0ff; color: #fff; margin: 10px; text-align: center; border-radius: 5px; }
        .menu-btn { padding: 15px 40px; font-size: 18px; background: transparent; border: 2px solid #0ff; color: #0ff; cursor: pointer; margin: 10px; transition: all 0.3s; border-radius: 5px; }
        .menu-btn:hover, .menu-btn:active { background: #0ff; color: #000; }
        #room-info { color: #0ff; font-size: 28px; margin: 20px; letter-spacing: 4px; }
        #status { color: #888; font-size: 14px; margin-top: 20px; }
        #dpad { position: fixed; left: 15px; bottom: 15px; width: 130px; height: 130px; z-index: 50; }
        .dpad-btn { position: absolute; width: 42px; height: 42px; background: rgba(0,255,255,0.15); border: 2px solid rgba(0,255,255,0.6); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #0ff; font-size: 18px; transition: all 0.1s; }
        .dpad-btn.active, .dpad-btn:active { background: rgba(0,255,255,0.5); box-shadow: 0 0 20px #0ff; }
        #dpad-up { left: 50%; top: 0; transform: translateX(-50%); }
        #dpad-down { left: 50%; bottom: 0; transform: translateX(-50%); }
        #dpad-left { left: 0; top: 50%; transform: translateY(-50%); }
        #dpad-right { right: 0; top: 50%; transform: translateY(-50%); }
        #btn-dash { position: fixed; left: 160px; bottom: 35px; width: 65px; height: 65px; background: rgba(255,153,0,0.15); border: 3px solid #f90; border-radius: 50%; color: #f90; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 50; transition: all 0.1s; }
        #btn-dash.active { background: rgba(255,153,0,0.6); box-shadow: 0 0 30px #f90, 0 0 60px #f60; transform: scale(1.1); }
        #weapons { position: fixed; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 50; }
        .weapon-btn { width: 85px; height: 50px; background: rgba(0,100,200,0.2); border: 2px solid rgba(0,150,255,0.6); border-radius: 8px; color: #fff; font-size: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; transition: all 0.15s; }
        .weapon-btn.active { background: rgba(0,255,100,0.4); border-color: #0f0; box-shadow: 0 0 15px #0f0; }
        .weapon-btn.disabled { opacity: 0.3; border-color: #333; }
        .weapon-name { font-weight: bold; font-size: 10px; }
        .weapon-level { font-size: 8px; color: #ff0; }
        #hud { position: fixed; top: 10px; left: 10px; color: #fff; font-size: 14px; z-index: 40; text-shadow: 2px 2px 4px #000; }
        #hud > div { margin-bottom: 3px; }
        #hp-bar { width: 150px; height: 12px; background: rgba(0,0,0,0.7); border: 1px solid #0ff; margin-top: 5px; }
        #hp-fill { height: 100%; background: linear-gradient(90deg, #0f0, #0ff); transition: width 0.3s; }
        #boss-bar { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); width: 280px; height: 18px; background: rgba(0,0,0,0.8); border: 2px solid #f00; display: none; z-index: 40; border-radius: 3px; }
        #boss-hp { height: 100%; background: linear-gradient(90deg, #f00, #ff0); transition: width 0.3s; }
        #boss-name { position: absolute; width: 100%; text-align: center; color: #fff; font-size: 11px; line-height: 18px; text-shadow: 1px 1px 2px #000; }
        #message { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); color: #0ff; font-size: 32px; font-weight: bold; text-shadow: 0 0 20px #0ff, 0 0 40px #08f; z-index: 60; display: none; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="menu">
        <h1>PLAZMERS</h1>
        <div class="version">Ver.1.004</div>
        <div id="menu-main">
            <input type="text" id="player-name" placeholder="YOUR NAME" maxlength="12">
            <br>
            <button class="menu-btn" onclick="hostGame()">HOST GAME</button>
            <br>
            <input type="text" id="room-code" placeholder="ROOM CODE" maxlength="4" style="text-transform:uppercase;">
            <button class="menu-btn" onclick="joinGame()">JOIN</button>
        </div>
        <div id="menu-waiting" class="hidden">
            <div id="room-info">ROOM: <span id="room-id"></span></div>
            <div id="players-list"></div>
            <button class="menu-btn" id="start-btn" onclick="startGame()">START GAME</button>
        </div>
        <div id="status">Connecting...</div>
    </div>
    <div id="dpad" class="hidden">
        <div class="dpad-btn" id="dpad-up">▲</div>
        <div class="dpad-btn" id="dpad-down">▼</div>
        <div class="dpad-btn" id="dpad-left">◀</div>
        <div class="dpad-btn" id="dpad-right">▶</div>
    </div>
    <div id="btn-dash" class="hidden">DASH</div>
    <div id="weapons" class="hidden">
        <div class="weapon-btn" id="btn-gatling" data-weapon="gatling"><span class="weapon-name">GATLING</span><span class="weapon-level">Lv.1</span></div>
        <div class="weapon-btn disabled" id="btn-fannel" data-weapon="fannel"><span class="weapon-name">FANNEL</span><span class="weapon-level">Lv.0</span></div>
        <div class="weapon-btn disabled" id="btn-missile" data-weapon="missile"><span class="weapon-name">MISSILE</span><span class="weapon-level">Lv.0</span></div>
        <div class="weapon-btn disabled" id="btn-laser" data-weapon="laser"><span class="weapon-name">LASER</span><span class="weapon-level">Lv.0</span></div>
    </div>
    <div id="hud" class="hidden">
        <div>WAVE: <span id="wave-text">1</span></div>
        <div>SCORE: <span id="score-text">0</span></div>
        <div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
    </div>
    <div id="boss-bar"><div id="boss-hp"></div><div id="boss-name"></div></div>
    <div id="message"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const WORLD_W = 2000, WORLD_H = 2000;
let socket = null, myId = null, myPlayer = null, gameState = null, isHost = false, frame = 0;
let camera = { x: 0, y: 0 }, screenShake = { x: 0, y: 0, intensity: 0 };
const input = { dx: 0, dy: 0, dashing: false };
const keys = { up: false, down: false, left: false, right: false };
let bullets = [], missiles = [], lasers = [], particles = [], effects = [], dashTrail = [], dashParticles = [];

function init() {
    resize();
    window.addEventListener('resize', resize);
    socket = io({ transports: ['websocket', 'polling'] });
    socket.on('connect', () => { document.getElementById('status').textContent = '✓ Connected'; document.getElementById('status').style.color = '#0f0'; });
    socket.on('hosted', (data) => { myId = data.playerId; myPlayer = data.player; isHost = true; document.getElementById('room-id').textContent = data.roomId; document.getElementById('menu-main').classList.add('hidden'); document.getElementById('menu-waiting').classList.remove('hidden'); document.getElementById('start-btn').style.display = 'block'; });
    socket.on('joined', (data) => { myId = data.playerId; myPlayer = data.player; isHost = false; document.getElementById('room-id').textContent = data.roomId; document.getElementById('menu-main').classList.add('hidden'); document.getElementById('menu-waiting').classList.remove('hidden'); document.getElementById('start-btn').style.display = 'none'; });
    socket.on('joinError', (data) => alert(data.message));
    socket.on('gameStarted', () => { document.getElementById('menu').classList.add('hidden'); document.getElementById('dpad').classList.remove('hidden'); document.getElementById('btn-dash').classList.remove('hidden'); document.getElementById('weapons').classList.remove('hidden'); document.getElementById('hud').classList.remove('hidden'); showMessage('WAVE 1 START!'); });
    socket.on('state', (state) => { gameState = state; const me = state.players.find(p => p.id === myId); if (me) { myPlayer = me; updateHUD(); updateWeaponButtons(); } if (state.boss) { document.getElementById('boss-bar').style.display = 'block'; document.getElementById('boss-name').textContent = state.boss.name; document.getElementById('boss-hp').style.width = (state.boss.hp / state.boss.maxHp * 100) + '%'; } else { document.getElementById('boss-bar').style.display = 'none'; } });
    socket.on('waveStart', (data) => { showMessage('WAVE ' + data.wave); triggerScreenShake(10); });
    socket.on('bossSpawn', (data) => { showMessage('⚠️ ' + data.name + ' ⚠️', 3000); triggerScreenShake(20); });
    socket.on('bossDefeated', (data) => { showMessage('🎉 BOSS DEFEATED! 🎉', 3000); if (gameState && gameState.boss) { for (let i = 0; i < 50; i++) { const angle = Math.random() * Math.PI * 2; const speed = 2 + Math.random() * 8; particles.push({ x: gameState.boss.x, y: gameState.boss.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: 3 + Math.random() * 8, life: 60, maxLife: 60, color: ['#f00', '#ff0', '#f80', '#fff'][Math.floor(Math.random() * 4)] }); } } triggerScreenShake(30); });
    socket.on('itemCollected', (data) => { showMessage(data.type + ' Lv UP!', 1000); for (let i = 0; i < 15; i++) { particles.push({ x: myPlayer.x + (Math.random() - 0.5) * 40, y: myPlayer.y + (Math.random() - 0.5) * 40, vx: (Math.random() - 0.5) * 3, vy: -1 - Math.random() * 3, size: 2 + Math.random() * 3, life: 40, maxLife: 40, color: '#ff0', type: 'sparkle' }); } });
    socket.on('fannelShot', (data) => { effects.push({ type: 'beam', x: data.x, y: data.y, tx: data.tx, ty: data.ty, life: 8 }); });
    socket.on('died', () => { showMessage('💀 YOU DIED 💀', 3000); triggerScreenShake(25); });
    setupControls();
    requestAnimationFrame(gameLoop);
}
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function updateHUD() { document.getElementById('wave-text').textContent = gameState.wave; document.getElementById('score-text').textContent = gameState.score; const hpPercent = Math.max(0, myPlayer.hp / myPlayer.maxHp * 100); document.getElementById('hp-fill').style.width = hpPercent + '%'; document.getElementById('hp-fill').style.background = hpPercent > 50 ? 'linear-gradient(90deg, #0f0, #0ff)' : hpPercent > 25 ? 'linear-gradient(90deg, #ff0, #f80)' : 'linear-gradient(90deg, #f00, #f80)'; }
function updateWeaponButtons() { ['gatling', 'fannel', 'missile', 'laser'].forEach(w => { const btn = document.getElementById('btn-' + w); const level = myPlayer.weapons[w]; const active = myPlayer.autoFire[w]; btn.querySelector('.weapon-level').textContent = 'Lv.' + level; btn.classList.toggle('disabled', level <= 0); btn.classList.toggle('active', active && level > 0); }); }
function showMessage(text, duration = 2000) { const msg = document.getElementById('message'); msg.textContent = text; msg.style.display = 'block'; setTimeout(() => { msg.style.display = 'none'; }, duration); }
function triggerScreenShake(intensity) { screenShake.intensity = Math.max(screenShake.intensity, intensity); }
function updateScreenShake() { if (screenShake.intensity > 0) { screenShake.x = (Math.random() - 0.5) * screenShake.intensity; screenShake.y = (Math.random() - 0.5) * screenShake.intensity; screenShake.intensity *= 0.9; if (screenShake.intensity < 0.5) screenShake.intensity = 0; } else { screenShake.x = 0; screenShake.y = 0; } }
function setupControls() {
    ['up', 'down', 'left', 'right'].forEach(dir => { const btn = document.getElementById('dpad-' + dir); const start = () => { keys[dir] = true; btn.classList.add('active'); updateInput(); }; const end = () => { keys[dir] = false; btn.classList.remove('active'); updateInput(); }; btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); }, { passive: false }); btn.addEventListener('touchend', (e) => { e.preventDefault(); end(); }, { passive: false }); btn.addEventListener('touchcancel', (e) => { e.preventDefault(); end(); }, { passive: false }); btn.addEventListener('mousedown', start); btn.addEventListener('mouseup', end); btn.addEventListener('mouseleave', end); });
    const dashBtn = document.getElementById('btn-dash'); const dashStart = () => { input.dashing = true; dashBtn.classList.add('active'); }; const dashEnd = () => { input.dashing = false; dashBtn.classList.remove('active'); }; dashBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dashStart(); }, { passive: false }); dashBtn.addEventListener('touchend', (e) => { e.preventDefault(); dashEnd(); }, { passive: false }); dashBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); dashEnd(); }, { passive: false }); dashBtn.addEventListener('mousedown', dashStart); dashBtn.addEventListener('mouseup', dashEnd); dashBtn.addEventListener('mouseleave', dashEnd);
    document.querySelectorAll('.weapon-btn').forEach(btn => { const toggle = () => toggleWeapon(btn.dataset.weapon); btn.addEventListener('touchend', (e) => { e.preventDefault(); toggle(); }, { passive: false }); btn.addEventListener('click', toggle); });
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowUp' || e.key === 'w') { keys.up = true; document.getElementById('dpad-up').classList.add('active'); } if (e.key === 'ArrowDown' || e.key === 's') { keys.down = true; document.getElementById('dpad-down').classList.add('active'); } if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = true; document.getElementById('dpad-left').classList.add('active'); } if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; document.getElementById('dpad-right').classList.add('active'); } if (e.key === 'Shift') dashStart(); if (e.key >= '1' && e.key <= '4') toggleWeapon(['gatling', 'fannel', 'missile', 'laser'][e.key - 1]); updateInput(); });
    document.addEventListener('keyup', (e) => { if (e.key === 'ArrowUp' || e.key === 'w') { keys.up = false; document.getElementById('dpad-up').classList.remove('active'); } if (e.key === 'ArrowDown' || e.key === 's') { keys.down = false; document.getElementById('dpad-down').classList.remove('active'); } if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = false; document.getElementById('dpad-left').classList.remove('active'); } if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = false; document.getElementById('dpad-right').classList.remove('active'); } if (e.key === 'Shift') dashEnd(); updateInput(); });
}
function updateInput() { input.dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0); input.dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0); if (input.dx !== 0 && input.dy !== 0) { input.dx *= 0.707; input.dy *= 0.707; } }
function toggleWeapon(weapon) { if (!myPlayer || myPlayer.weapons[weapon] <= 0) return; socket.emit('toggleWeapon', { weapon: weapon }); }
function hostGame() { const name = document.getElementById('player-name').value || 'Host'; socket.emit('hostRoom', { name: name }); }
function joinGame() { const name = document.getElementById('player-name').value || 'Player'; const code = document.getElementById('room-code').value.toUpperCase(); if (!code) { alert('Enter room code'); return; } socket.emit('joinRoom', { name: name, roomId: code }); }
function startGame() { socket.emit('startGame'); }
function updateDashTrail() {
    if (!myPlayer || !myPlayer.alive) return;
    if (myPlayer.dashing) {
        dashTrail.unshift({ x: myPlayer.x, y: myPlayer.y, angle: myPlayer.angle, life: 30, maxLife: 30, color: '#0ff' });
        for (let i = 0; i < 6; i++) { const spreadAngle = myPlayer.angle + Math.PI + (Math.random() - 0.5) * 1.2; const speed = 3 + Math.random() * 8; dashParticles.push({ x: myPlayer.x + (Math.random() - 0.5) * 20, y: myPlayer.y + (Math.random() - 0.5) * 20, vx: Math.cos(spreadAngle) * speed, vy: Math.sin(spreadAngle) * speed, size: 1 + Math.random() * 4, life: 20 + Math.random() * 15, maxLife: 35, color: Math.random() > 0.4 ? '#fff' : '#0ff', type: 'star' }); }
        if (Math.random() > 0.5) { dashParticles.push({ x: myPlayer.x + (Math.random() - 0.5) * 30, y: myPlayer.y + (Math.random() - 0.5) * 30, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, size: 2 + Math.random() * 3, life: 30 + Math.random() * 20, maxLife: 50, color: '#fff', type: 'sparkle' }); }
    }
    dashTrail.forEach(t => t.life--); dashTrail = dashTrail.filter(t => t.life > 0); if (dashTrail.length > 40) dashTrail.length = 40;
    dashParticles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life--; }); dashParticles = dashParticles.filter(p => p.life > 0);
}
function drawDashEffects() {
    if (!myPlayer) return;
    const glowColor = '#0ff';
    dashParticles.forEach(p => { const sx = p.x - camera.x + screenShake.x; const sy = p.y - camera.y + screenShake.y; const alpha = p.life / (p.maxLife || 35); const size = p.size * alpha; ctx.save(); ctx.globalAlpha = alpha; if (p.type === 'sparkle') { ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.shadowBlur = 8; ctx.shadowColor = p.color; const sparkleSize = size * 2; ctx.beginPath(); ctx.moveTo(sx - sparkleSize, sy); ctx.lineTo(sx + sparkleSize, sy); ctx.moveTo(sx, sy - sparkleSize); ctx.lineTo(sx, sy + sparkleSize); ctx.stroke(); } else { ctx.fillStyle = p.color; ctx.shadowBlur = 12; ctx.shadowColor = p.color; ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); });
    if (dashTrail.length > 2) { ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowBlur = 50; ctx.shadowColor = glowColor; ctx.strokeStyle = glowColor; ctx.lineWidth = 35; ctx.globalAlpha = 0.1; ctx.beginPath(); for (let i = 0; i < dashTrail.length; i++) { const t = dashTrail[i]; const sx = t.x - camera.x + screenShake.x; const sy = t.y - camera.y + screenShake.y; if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); } ctx.stroke(); for (let layer = 0; layer < 3; layer++) { const layerWidth = 25 - layer * 8; const layerAlpha = 0.15 + layer * 0.1; ctx.beginPath(); ctx.strokeStyle = layer === 2 ? '#fff' : glowColor; ctx.lineWidth = layerWidth; ctx.globalAlpha = layerAlpha; ctx.shadowBlur = 20 - layer * 5; for (let i = 0; i < dashTrail.length; i++) { const t = dashTrail[i]; const sx = t.x - camera.x + screenShake.x; const sy = t.y - camera.y + screenShake.y; if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); } ctx.stroke(); } ctx.beginPath(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.globalAlpha = 0.8; ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; for (let i = 0; i < Math.min(dashTrail.length, 15); i++) { const t = dashTrail[i]; const sx = t.x - camera.x + screenShake.x; const sy = t.y - camera.y + screenShake.y; if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); } ctx.stroke(); ctx.restore(); }
    dashTrail.forEach((t, idx) => { if (idx % 3 !== 0) return; const sx = t.x - camera.x + screenShake.x; const sy = t.y - camera.y + screenShake.y; const lifeRatio = t.life / (t.maxLife || 30); const alpha = lifeRatio * 0.5; const size = 10 * lifeRatio; ctx.save(); ctx.globalAlpha = alpha; ctx.translate(sx, sy); ctx.shadowBlur = 20; ctx.shadowColor = glowColor; ctx.fillStyle = glowColor; ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
}
function gameLoop() {
    frame++;
    if (gameState && myPlayer && myPlayer.alive) {
        if (frame % 2 === 0) socket.emit('input', input);
        const dashLevel = myPlayer.weapons.dash || 1; const speed = input.dashing ? (4 + dashLevel * 0.5) : 4;
        myPlayer.x += input.dx * speed; myPlayer.y += input.dy * speed;
        myPlayer.x = Math.max(30, Math.min(WORLD_W - 30, myPlayer.x)); myPlayer.y = Math.max(30, Math.min(WORLD_H - 30, myPlayer.y));
        myPlayer.dashing = input.dashing;
        if (input.dx !== 0 || input.dy !== 0) myPlayer.angle = Math.atan2(input.dy, input.dx);
        camera.x = myPlayer.x - canvas.width / 2; camera.y = myPlayer.y - canvas.height / 2;
        processWeapons();
    }
    updateDashTrail(); updateBullets(); updateParticles(); updateScreenShake();
    draw();
    requestAnimationFrame(gameLoop);
}
function processWeapons() {
    if (!myPlayer || !myPlayer.autoFire) return;
    if (myPlayer.autoFire.gatling && myPlayer.weapons.gatling > 0) { const level = myPlayer.weapons.gatling; const fireRate = Math.max(3, 12 - level); if (frame % fireRate === 0) { const bulletCount = level >= 8 ? 3 : level >= 4 ? 2 : 1; const spread = level >= 5 ? 0.15 : 0; for (let i = 0; i < bulletCount; i++) { const angle = myPlayer.angle + (i - (bulletCount - 1) / 2) * spread; bullets.push({ x: myPlayer.x + Math.cos(myPlayer.angle) * 20, y: myPlayer.y + Math.sin(myPlayer.angle) * 20, vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15, damage: 1 + Math.floor(level / 2), life: 50, color: '#0ff', size: 3 }); } } }
    if (myPlayer.autoFire.missile && myPlayer.weapons.missile > 0) { const level = myPlayer.weapons.missile; if (frame % 25 === 0) { for (let i = 0; i < level; i++) { const offsetAngle = myPlayer.angle + (i - (level - 1) / 2) * 0.3; missiles.push({ x: myPlayer.x, y: myPlayer.y, vx: Math.cos(offsetAngle) * 8, vy: Math.sin(offsetAngle) * 8, damage: 5 + level * 2, life: 100, trail: [] }); } } }
    if (myPlayer.autoFire.laser && myPlayer.weapons.laser > 0) { const level = myPlayer.weapons.laser; if (frame % 3 === 0) { const width = 4 + level * 2; const length = 250 + level * 40; const hits = []; const cos = Math.cos(myPlayer.angle), sin = Math.sin(myPlayer.angle); if (gameState) { gameState.enemies.forEach(e => { const dx = e.x - myPlayer.x, dy = e.y - myPlayer.y; const along = dx * cos + dy * sin; const perp = Math.abs(dx * sin - dy * cos); if (along > 0 && along < length && perp < width + e.size) { hits.push({ id: e.id, damage: 3 + level * 2 }); } }); if (gameState.boss) { const dx = gameState.boss.x - myPlayer.x, dy = gameState.boss.y - myPlayer.y; const along = dx * cos + dy * sin; const perp = Math.abs(dx * sin - dy * cos); if (along > 0 && along < length && perp < width + gameState.boss.size) { hits.push({ id: gameState.boss.id, damage: 3 + level * 2 }); } } if (hits.length > 0) socket.emit('attack', { weapon: 'laser', targets: hits }); } lasers.push({ x: myPlayer.x, y: myPlayer.y, angle: myPlayer.angle, length: length, width: width, life: 4 }); } }
}
function updateBullets() {
    const hits = [];

function createExplosion(x, y, radius) { for (let i = 0; i < 30; i++) { const angle = Math.random() * Math.PI * 2; const speed = 2 + Math.random() * 6; particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: 2 + Math.random() * 4, life: 30, maxLife: 30, color: ['#f80', '#ff0', '#f00'][Math.floor(Math.random() * 3)] }); } effects.push({ type: 'explosion', x: x, y: y, radius: radius, life: 20, maxLife: 20 }); triggerScreenShake(8); }

}
