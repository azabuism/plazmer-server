<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAZMERS - ONLINE</title>
    <style>
        body { margin: 0; background: #000810; overflow: hidden; font-family: 'Courier New', monospace; cursor: crosshair; }
        canvas { display: block; }
        #ui { position: fixed; top: 10px; left: 10px; color: #0ff; font-size: 16px; text-shadow: 0 0 5px #0ff; pointer-events: none;}
        #connect-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); color: #0ff; z-index: 999;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="connect-screen"><h1>CONNECTING TO INNER SPACE...</h1></div>
    <div id="ui">
        <div>WAVE: <span id="wave">0</span></div>
        <div>PLAYERS: <span id="p-count">0</span></div>
    </div>
    <canvas id="canvas"></canvas>

<script>
const socket = io();
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let myId = null;
let worldW = 3000, worldH = 3000;
let camera = { x: 0, y: 0 };
let gameState = { players: {}, enemies: [], bullets: [] };
let particles = [];

// 入力状態
const input = { targetX: 0, targetY: 0, dashPressed: false, changeForm: false };

// 初期化
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// サーバーからの初期設定受信
socket.on('init', (data) => {
    myId = data.id;
    worldW = data.worldW;
    worldH = data.worldH;
    document.getElementById('connect-screen').style.display = 'none';
    walls = data.walls; // 壁データ受信
});

// 毎フレームのサーバー更新受信
socket.on('state', (state) => {
    gameState = state;
    document.getElementById('wave').textContent = state.wave;
    document.getElementById('p-count').textContent = Object.keys(state.players).length;
});

// 入力送信ループ (常時送信)
canvas.addEventListener('mousemove', e => {
    // 画面上の位置をワールド座標に変換して送信
    input.targetX = e.clientX + camera.x;
    input.targetY = e.clientY + camera.y;
});

canvas.addEventListener('mousedown', e => {
    if(e.button === 0) { // 左クリック
        input.changeForm = true;
        // 一回だけ送るためにすぐ戻すフラグ管理が必要だが、
        // 簡易的にサーバー側でトグル処理させる
        socket.emit('input', { ...input, changeForm: true });
        input.changeForm = false; 
    }
});

document.addEventListener('keydown', e => {
    if(e.code === 'Space') {
        socket.emit('input', { ...input, dashPressed: true });
    }
});

// 定期的にマウス位置を送る
setInterval(() => {
    if(myId) socket.emit('input', input);
}, 50); // 20回/秒

// ========== 描画ループ ==========
function draw() {
    ctx.fillStyle = '#000810';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // カメラ更新
    if (myId && gameState.players[myId]) {
        const me = gameState.players[myId];
        camera.x = me.x - canvas.width / 2;
        camera.y = me.y - canvas.height / 2;
    }

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // 壁描画
    if(typeof walls !== 'undefined') {
        walls.forEach(w => {
            if(w.type === 'cell') {
                ctx.fillStyle = 'rgba(150,30,50,0.5)';
                ctx.beginPath(); ctx.arc(w.cx, w.cy, w.radius, 0, Math.PI*2); ctx.fill();
            }
        });
    }

    // 弾描画 (マクロスミサイルの軌跡など)
    gameState.bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
        
        // 簡易的なトレイル（クライアント側演出）
        if(Math.random() < 0.3) createParticle(b.x, b.y, b.color);
    });

    // 敵描画
    gameState.enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI*2); ctx.fill();
        // HPバー
        ctx.fillStyle = 'red';
        ctx.fillRect(e.x - e.size, e.y - e.size - 10, e.size*2, 4);
        ctx.fillStyle = 'lime';
        ctx.fillRect(e.x - e.size, e.y - e.size - 10, e.size*2 * (e.hp/e.maxHp), 4);
    });

    // プレイヤー描画
    for (const id in gameState.players) {
        const p = gameState.players[id];
        const isMe = (id === myId);
        
        // 本体
        ctx.fillStyle = isMe ? '#fff' : '#0ff';
        ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI*2); ctx.fill();
        
        // 名前と状態
        ctx.fillStyle = '#fff';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(isMe ? "YOU" : "ALLY", p.x, p.y - 20);
        
        if (p.formation === 1) { // HUNT MODE 表示
            ctx.strokeStyle = '#f0f';
            ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.stroke();
        }
        
        // DASHエフェクト
        if(p.dashing) createParticle(p.x, p.y, '#fff');
    }

    // パーティクル更新・描画 (クライアントのみで処理)
    updateParticles();

    ctx.restore();
    requestAnimationFrame(draw);
}

// クライアントサイド・パーティクルシステム
function createParticle(x, y, color) {
    particles.push({x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 20, color});
}
function updateParticles() {
    for(let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.globalAlpha = p.life / 20;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1.0;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

draw();
</script>
</body>
</html>
